version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: 'deps'
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: 'ci(deps)'
