name: Staff Production Fixture Boundary Apply

on:
  pull_request:
    paths:
      - 'mobile/apps/staff_app/lib/main.dart'
      - 'mobile/apps/staff_app/lib/staff_server_boundary_strings.dart'
      - 'mobile/apps/staff_app/test/staff_server_boundary_strings_test.dart'
      - 'mobile/tool/apply_staff_production_fixture_boundary.py'
      - '.github/workflows/staff-production-fixture-boundary-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - name: Apply Staff production fixture boundary
        run: python3 mobile/tool/apply_staff_production_fixture_boundary.py
      - name: Format changed Dart files
        run: |
          dart format \
            mobile/apps/staff_app/lib/main.dart \
            mobile/apps/staff_app/lib/staff_server_boundary_strings.dart \
            mobile/apps/staff_app/test/staff_server_boundary_strings_test.dart
      - name: Commit applied boundary
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Staff production fixture boundary already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/apps/staff_app/lib/main.dart \
            mobile/apps/staff_app/lib/staff_server_boundary_strings.dart \
            mobile/apps/staff_app/test/staff_server_boundary_strings_test.dart
          git commit -m 'fix(mobile): remove Staff production fixture data'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
