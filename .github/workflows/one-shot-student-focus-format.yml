name: One-shot student focus formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'codex/student-core-route-workflows-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Format only the Student workspace
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx prettier --write apps/web-student/src/features/experience/StudentDailyWorkspace.tsx
          test "$(git diff --name-only)" = "apps/web-student/src/features/experience/StudentDailyWorkspace.tsx"
          git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-student/src/features/experience/StudentDailyWorkspace.tsx
          git commit -m 'style(student): format generalized focus markup'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
