name: PR98 admin action boundary

on:
  push:
    branches:
      - ux/operational-school-erp-v1

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/operational-school-erp-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Make unsupported Admin actions explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = source.read_text()
          replacements = [
            ("              'Approve refund',", '              <PilotUnavailableAction key="a">Approve refund</PilotUnavailableAction>,'),
            ("              'View entry',", '              <PilotUnavailableAction key="a">View entry</PilotUnavailableAction>,'),
            ("              'Review PO',", '              <PilotUnavailableAction key="a">Review PO</PilotUnavailableAction>,'),
            ("              'Contact supplier',", '              <PilotUnavailableAction key="a">Contact supplier</PilotUnavailableAction>,'),
            ("              'Assign cover',", '              <PilotUnavailableAction key="a">Assign cover</PilotUnavailableAction>,'),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one marker for {old!r}, found {text.count(old)}')
            text = text.replace(old, new, 1)
          source.write_text(text)

          test = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          test_text = test.read_text()
          if 'renders unsupported Admin record actions as disabled controls' in test_text:
            raise SystemExit('Admin action-boundary regression test already exists')
          insertion = '''\n\n  it.each([\n    ['/admin/finance', 'admin', ['Approve refund', 'View entry']],\n    ['/admin/operations', 'admin', ['Review PO', 'Contact supplier', 'Assign cover']],\n  ] as const)(\n    'renders unsupported Admin record actions as disabled controls on %s',\n    (path, role, labels) => {\n      const markup = renderRoute(path, role);\n\n      for (const label of labels) expect(markup).toContain(label);\n      expect((markup.match(/disabled=\"\"/gu) ?? []).length).toBeGreaterThanOrEqual(labels.length);\n      expect(markup).toContain('operational-pilot-action-boundary');\n    },\n  );'''
          closing = test_text.rfind('\n});')
          if closing < 0:
            raise SystemExit('Test describe closing marker missing')
          test.write_text(test_text[:closing] + insertion + test_text[closing:])
          PY
      - run: npx prettier --write apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run build
      - run: npm run check:experience-budget
      - name: Commit verified slice and remove helper
        run: |
          rm .github/workflows/pr98-admin-action-boundary.yml
          rm -f .github/pr98-admin-action-boundary-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx .github/workflows/pr98-admin-action-boundary.yml .github/pr98-admin-action-boundary-trigger.txt
          git commit -m 'fix(ux): make unsupported admin record actions explicit'
          git push origin HEAD:ux/operational-school-erp-v1
