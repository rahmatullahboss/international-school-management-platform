name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - 'module/flutter-mobile-apps'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: write

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve workspace dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Fix and format encrypted sync storage
        run: |
          python3 mobile/tool/fix_sync_storage.py
          python3 mobile/tool/fix_sync_storage_tests.py
          dart format mobile/packages/sync_storage
      - name: Commit encrypted sync storage lifecycle fixes
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            mobile/pubspec.yaml \
            mobile/pubspec.lock \
            mobile/packages/sync_storage
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(MOB-01): finalize encrypted sync storage lifecycle"
          git push origin HEAD:module/flutter-mobile-apps
      - name: Verify generated files remain ignored
        run: >-
          git diff --exit-code -- mobile
          ':!mobile/tool/fix_sync_storage.py'
          ':!mobile/tool/fix_sync_storage_tests.py'
      - name: Verify native application configuration
        run: python3 mobile/tool/verify_native_projects.py
      - name: Analyze family app
        working-directory: mobile/apps/family_app
        run: flutter analyze
      - name: Analyze staff app
        working-directory: mobile/apps/staff_app
        run: flutter analyze
      - name: Analyze app bootstrap
        working-directory: mobile/packages/app_bootstrap
        run: flutter analyze
      - name: Analyze authentication
        working-directory: mobile/packages/authentication
        run: flutter analyze
      - name: Analyze design system
        working-directory: mobile/packages/design_system
        run: flutter analyze
      - name: Analyze Family domain
        working-directory: mobile/packages/family_domain
        run: dart analyze
      - name: Analyze Staff domain
        working-directory: mobile/packages/staff_domain
        run: dart analyze
      - name: Analyze sync engine
        working-directory: mobile/packages/sync_engine
        run: dart analyze
      - name: Analyze sync storage
        working-directory: mobile/packages/sync_storage
        run: flutter analyze
      - name: Analyze mobile core
        working-directory: mobile/packages/mobile_core
        run: dart analyze
      - name: Analyze API client
        working-directory: mobile/packages/api_client
        run: dart analyze
      - name: Test family app
        working-directory: mobile/apps/family_app
        run: flutter test
      - name: Test staff app
        working-directory: mobile/apps/staff_app
        run: flutter test
      - name: Test app bootstrap
        working-directory: mobile/packages/app_bootstrap
        run: flutter test
      - name: Test authentication
        working-directory: mobile/packages/authentication
        run: flutter test
      - name: Test design system
        working-directory: mobile/packages/design_system
        run: flutter test
      - name: Test Family domain
        working-directory: mobile/packages/family_domain
        run: dart test
      - name: Test Staff domain
        working-directory: mobile/packages/staff_domain
        run: dart test
      - name: Test sync engine
        working-directory: mobile/packages/sync_engine
        run: dart test
      - name: Test sync storage
        working-directory: mobile/packages/sync_storage
        run: flutter test
      - name: Test mobile core
        working-directory: mobile/packages/mobile_core
        run: dart test
      - name: Test API client
        working-directory: mobile/packages/api_client
        run: dart test
      - name: Build family Android debug APK
        working-directory: mobile/apps/family_app
        run: flutter build apk --debug
      - name: Build staff Android debug APK
        working-directory: mobile/apps/staff_app
        run: flutter build apk --debug
