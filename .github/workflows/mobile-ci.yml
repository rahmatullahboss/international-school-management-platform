name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - 'module/flutter-mobile-apps'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: write

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve workspace dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Fix and format durable sync engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          library_path = Path('mobile/packages/sync_engine/lib/school_sync_engine.dart')
          source = library_path.read_text(encoding='utf-8')
          old_payload = """    return EncryptedSyncPayload._(
            ciphertext: Uint8List.unmodifiable(ciphertext),
            contentType: _required(contentType, 'contentType'),
            keyAlias: _required(keyAlias, 'keyAlias'),
            schemaVersion: _required(schemaVersion, 'schemaVersion'),
          );
        }

        const EncryptedSyncPayload._({
          required this.ciphertext,
          required this.contentType,
          required this.keyAlias,
          required this.schemaVersion,
        });

        final Uint8List ciphertext;
        final String contentType;
        final String keyAlias;
        final String schemaVersion;

        @override
        String toString() =>
            'EncryptedSyncPayload(contentType: $contentType, schemaVersion: $schemaVersion, bytes: ${ciphertext.length})';
"""
          new_payload = """    return EncryptedSyncPayload._(
            ciphertext: Uint8List.fromList(ciphertext),
            contentType: _required(contentType, 'contentType'),
            keyAlias: _required(keyAlias, 'keyAlias'),
            schemaVersion: _required(schemaVersion, 'schemaVersion'),
          );
        }

        EncryptedSyncPayload._({
          required Uint8List ciphertext,
          required this.contentType,
          required this.keyAlias,
          required this.schemaVersion,
        }) : _ciphertext = ciphertext;

        final Uint8List _ciphertext;
        final String contentType;
        final String keyAlias;
        final String schemaVersion;

        Uint8List get ciphertext => Uint8List.fromList(_ciphertext);

        @override
        String toString() =>
            'EncryptedSyncPayload(contentType: $contentType, schemaVersion: $schemaVersion, bytes: ${_ciphertext.length})';
"""
          if old_payload in source:
              source = source.replace(old_payload, new_payload, 1)
          elif new_payload not in source:
              raise SystemExit('Unexpected encrypted payload declaration shape')

          old_retry = """final class RetrySchedule {
          const RetrySchedule({
            this.baseDelay = const Duration(seconds: 5),
            this.maximumDelay = const Duration(minutes: 15),
          }) : assert(!baseDelay.isNegative),
               assert(!maximumDelay.isNegative);

          final Duration baseDelay;
          final Duration maximumDelay;
"""
          new_retry = """final class RetrySchedule {
          factory RetrySchedule({
            Duration baseDelay = const Duration(seconds: 5),
            Duration maximumDelay = const Duration(minutes: 15),
          }) {
            if (baseDelay.isNegative ||
                maximumDelay.isNegative ||
                maximumDelay < baseDelay) {
              throw const SyncContractException('SYNC_RETRY_SCHEDULE_INVALID');
            }
            return RetrySchedule._(
              baseDelay: baseDelay,
              maximumDelay: maximumDelay,
            );
          }

          const RetrySchedule._({
            required this.baseDelay,
            required this.maximumDelay,
          });

          final Duration baseDelay;
          final Duration maximumDelay;
"""
          if old_retry in source:
              source = source.replace(old_retry, new_retry, 1)
          elif new_retry not in source:
              raise SystemExit('Unexpected retry schedule declaration shape')
          source = source.replace('const RetrySchedule(', 'RetrySchedule(')
          library_path.write_text(source, encoding='utf-8')

          test_path = Path('mobile/packages/sync_engine/test/sync_engine_test.dart')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('const RetrySchedule(', 'RetrySchedule(')
          tests = tests.replace('containsInOrder(<Object?>[', 'orderedEquals(<Object?>[')
          old_immutability = """    expect(payload.ciphertext, <int>[1, 2, 3]);
            expect(() => payload.ciphertext[0] = 8, throwsUnsupportedError);
            expect(payload.toString(), isNot(contains('[1, 2, 3]')));
"""
          new_immutability = """    expect(payload.ciphertext, <int>[1, 2, 3]);
            final exposed = payload.ciphertext;
            exposed[0] = 8;
            expect(payload.ciphertext, <int>[1, 2, 3]);
            expect(payload.toString(), isNot(contains('[1, 2, 3]')));
"""
          if old_immutability in tests:
              tests = tests.replace(old_immutability, new_immutability, 1)
          elif new_immutability not in tests:
              raise SystemExit('Unexpected ciphertext immutability test shape')
          test_path.write_text(tests, encoding='utf-8')
          PY
          dart format \
            mobile/packages/sync_engine/lib/school_sync_engine.dart \
            mobile/packages/sync_engine/test/sync_engine_test.dart
      - name: Commit durable sync compatibility fixes
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            mobile/pubspec.yaml \
            mobile/pubspec.lock \
            mobile/packages/sync_engine
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(MOB-01): finalize durable offline sync contracts"
          git push origin HEAD:module/flutter-mobile-apps
      - name: Verify generated files remain ignored
        run: git diff --exit-code -- mobile
      - name: Verify native application configuration
        run: python3 mobile/tool/verify_native_projects.py
      - name: Analyze family app
        working-directory: mobile/apps/family_app
        run: flutter analyze
      - name: Analyze staff app
        working-directory: mobile/apps/staff_app
        run: flutter analyze
      - name: Analyze app bootstrap
        working-directory: mobile/packages/app_bootstrap
        run: flutter analyze
      - name: Analyze authentication
        working-directory: mobile/packages/authentication
        run: flutter analyze
      - name: Analyze design system
        working-directory: mobile/packages/design_system
        run: flutter analyze
      - name: Analyze Family domain
        working-directory: mobile/packages/family_domain
        run: dart analyze
      - name: Analyze Staff domain
        working-directory: mobile/packages/staff_domain
        run: dart analyze
      - name: Analyze sync engine
        working-directory: mobile/packages/sync_engine
        run: dart analyze
      - name: Analyze mobile core
        working-directory: mobile/packages/mobile_core
        run: dart analyze
      - name: Analyze API client
        working-directory: mobile/packages/api_client
        run: dart analyze
      - name: Test family app
        working-directory: mobile/apps/family_app
        run: flutter test
      - name: Test staff app
        working-directory: mobile/apps/staff_app
        run: flutter test
      - name: Test app bootstrap
        working-directory: mobile/packages/app_bootstrap
        run: flutter test
      - name: Test authentication
        working-directory: mobile/packages/authentication
        run: flutter test
      - name: Test design system
        working-directory: mobile/packages/design_system
        run: flutter test
      - name: Test Family domain
        working-directory: mobile/packages/family_domain
        run: dart test
      - name: Test Staff domain
        working-directory: mobile/packages/staff_domain
        run: dart test
      - name: Test sync engine
        working-directory: mobile/packages/sync_engine
        run: dart test
      - name: Test mobile core
        working-directory: mobile/packages/mobile_core
        run: dart test
      - name: Test API client
        working-directory: mobile/packages/api_client
        run: dart test
      - name: Build family Android debug APK
        working-directory: mobile/apps/family_app
        run: flutter build apk --debug
      - name: Build staff Android debug APK
        working-directory: mobile/apps/staff_app
        run: flutter build apk --debug
