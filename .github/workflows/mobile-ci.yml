name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - 'module/flutter-mobile-apps'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: write

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve workspace dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Wire and format Staff production journeys
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('mobile/apps/staff_app/lib/main.dart')
          main = main_path.read_text(encoding='utf-8')
          managed_imports = [
              "import 'package:school_api_client/school_api_client.dart';",
              "import 'package:school_api_client/teacher_mobile_api.dart';",
              "import 'package:school_app_bootstrap/school_app_bootstrap.dart';",
              "import 'package:school_authentication/school_authentication.dart';",
              "import 'package:school_design_system/school_design_system.dart';",
              "import 'package:school_mobile_core/mobile_core.dart';",
              "import 'package:school_staff_domain/school_staff_domain.dart';",
          ]
          lines = main.splitlines()
          lines = [line for line in lines if line not in set(managed_imports)]
          anchor = "import 'package:go_router/go_router.dart';"
          if anchor not in lines:
              raise SystemExit('STAFF_IMPORT_ANCHOR_REQUIRED')
          index = lines.index(anchor) + 1
          lines[index:index] = managed_imports
          main = '\n'.join(lines) + '\n'

          managed_parts = [
              "part 'production_app.dart';",
              "part 'staff_journey_controller.dart';",
              "part 'teacher_production_journeys.dart';",
          ]
          lines = main.splitlines()
          lines = [line for line in lines if line not in set(managed_parts)]
          main_anchor = 'void main() {'
          if main_anchor not in lines:
              raise SystemExit('STAFF_MAIN_ANCHOR_REQUIRED')
          index = lines.index(main_anchor)
          lines[index:index] = managed_parts + ['']
          main_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          path = Path('mobile/apps/staff_app/lib/production_app.dart')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """  const StaffProductionApp({
              this.coordinator,
              this.initializeCoordinator = true,
              super.key,
            });

            final MobileAppCoordinator? coordinator;
            final bool initializeCoordinator;
""",
                  """  const StaffProductionApp({
              this.coordinator,
              this.initializeCoordinator = true,
              this.repository,
              super.key,
            });

            final MobileAppCoordinator? coordinator;
            final bool initializeCoordinator;
            final TeacherJourneyRepository? repository;
""",
              ),
              (
                  """        if (state.isReady && session != null) {
              return _AuthorizedStaffApp(
                coordinator: coordinator,
                session: session,
              );
            }
""",
                  """        if (state.isReady && session != null) {
              final repository =
                  widget.repository ??
                  (coordinator.apiClient == null
                      ? null
                      : TeacherMobileApi(coordinator.apiClient!));
              if (repository == null) {
                return MaterialApp(
                  debugShowCheckedModeBanner: false,
                  home: const MobileConfigurationFailureScreen(
                    appName: 'School Staff',
                    reasonCode: 'TEACHER_REPOSITORY_CONFIGURATION_REQUIRED',
                  ),
                  theme: SchoolTheme.light(),
                );
              }
              return _AuthorizedStaffApp(
                coordinator: coordinator,
                repository: repository,
                session: session,
              );
            }
""",
              ),
              (
                  """class _AuthorizedStaffApp extends StatefulWidget {
            const _AuthorizedStaffApp({required this.coordinator, required this.session});

            final MobileAppCoordinator coordinator;
            final SchoolSession session;
""",
                  """class _AuthorizedStaffApp extends StatefulWidget {
            const _AuthorizedStaffApp({
              required this.coordinator,
              required this.repository,
              required this.session,
            });

            final MobileAppCoordinator coordinator;
            final TeacherJourneyRepository repository;
            final SchoolSession session;
""",
              ),
              (
                  """class _AuthorizedStaffAppState extends State<_AuthorizedStaffApp> {
            late GoRouter _router;

            @override
            void initState() {
              super.initState();
              _router = _createRouter();
            }
""",
                  """class _AuthorizedStaffAppState extends State<_AuthorizedStaffApp> {
            late StaffJourneyController _journey;
            late GoRouter _router;

            @override
            void initState() {
              super.initState();
              _journey = StaffJourneyController(
                repository: widget.repository,
                session: widget.session,
              );
              _router = _createRouter();
              unawaited(_journey.initialize());
            }
""",
              ),
              (
                  """  @override
            void didUpdateWidget(covariant _AuthorizedStaffApp oldWidget) {
              super.didUpdateWidget(oldWidget);
              if (oldWidget.session.tenantId != widget.session.tenantId ||
                  oldWidget.session.campusId != widget.session.campusId ||
                  !setEquals(
                    oldWidget.session.capabilities,
                    widget.session.capabilities,
                  )) {
                _router.dispose();
                _router = _createRouter();
              }
            }
""",
                  """  @override
            void didUpdateWidget(covariant _AuthorizedStaffApp oldWidget) {
              super.didUpdateWidget(oldWidget);
              final scopeChanged =
                  oldWidget.session.tenantId != widget.session.tenantId ||
                  oldWidget.session.campusId != widget.session.campusId ||
                  oldWidget.session.activePersona != widget.session.activePersona ||
                  !setEquals(
                    oldWidget.session.capabilities,
                    widget.session.capabilities,
                  );
              final repositoryChanged = oldWidget.repository != widget.repository;
              if (repositoryChanged) {
                _journey.dispose();
                _journey = StaffJourneyController(
                  repository: widget.repository,
                  session: widget.session,
                );
                unawaited(_journey.initialize());
              } else if (scopeChanged) {
                unawaited(_journey.updateSession(widget.session));
              }
              if (repositoryChanged || scopeChanged) {
                _router.dispose();
                _router = _createRouter();
              }
            }
""",
              ),
              (
                  """            GoRoute(
              path: '/',
              builder: (context, state) =>
                  _AuthorizedStaffHomeScreen(session: session),
            ),
""",
                  """            GoRoute(
              path: '/',
              builder: (context, state) => _TeacherTodayScreen(
                journey: _journey,
                session: session,
              ),
            ),
""",
              ),
              (
                  """            if (session.can(SchoolCapability.attendanceTake))
              GoRoute(
                path: '/attendance',
                builder: (context, state) => const StaffAttendanceScreen(),
              ),
""",
                  """            if (session.can(SchoolCapability.attendanceTake))
              GoRoute(
                path: '/attendance',
                builder: (context, state) =>
                    _TeacherRosterScreen(journey: _journey),
              ),
""",
              ),
              (
                  """  @override
            void dispose() {
              _router.dispose();
              super.dispose();
            }
""",
                  """  @override
            void dispose() {
              _router.dispose();
              _journey.dispose();
              super.dispose();
            }
""",
              ),
          ]

          for old, new in replacements:
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit('Unexpected Staff production declaration shape')
          path.write_text(source, encoding='utf-8')
          PY
          cd mobile
          dart format .
      - name: Commit repository-driven Staff production journeys
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            mobile/pubspec.lock \
            mobile/apps/staff_app/pubspec.yaml \
            mobile/apps/staff_app/lib/main.dart \
            mobile/apps/staff_app/lib/production_app.dart \
            mobile/apps/staff_app/lib/staff_journey_controller.dart \
            mobile/apps/staff_app/lib/teacher_production_journeys.dart \
            mobile/apps/staff_app/test/staff_journey_controller_test.dart \
            mobile/packages/staff_domain \
            mobile/packages/api_client/lib/teacher_mobile_api.dart \
            mobile/packages/api_client/test/teacher_mobile_api_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(MOB-01): drive Staff production UI from teacher read models"
          git push origin HEAD:module/flutter-mobile-apps
      - name: Verify generated files remain ignored
        run: git diff --exit-code -- mobile
      - name: Verify native application configuration
        run: python3 mobile/tool/verify_native_projects.py
      - name: Analyze family app
        working-directory: mobile/apps/family_app
        run: flutter analyze
      - name: Analyze staff app
        working-directory: mobile/apps/staff_app
        run: flutter analyze
      - name: Analyze app bootstrap
        working-directory: mobile/packages/app_bootstrap
        run: flutter analyze
      - name: Analyze authentication
        working-directory: mobile/packages/authentication
        run: flutter analyze
      - name: Analyze design system
        working-directory: mobile/packages/design_system
        run: flutter analyze
      - name: Analyze Family domain
        working-directory: mobile/packages/family_domain
        run: dart analyze
      - name: Analyze Staff domain
        working-directory: mobile/packages/staff_domain
        run: dart analyze
      - name: Analyze mobile core
        working-directory: mobile/packages/mobile_core
        run: dart analyze
      - name: Analyze API client
        working-directory: mobile/packages/api_client
        run: dart analyze
      - name: Test family app
        working-directory: mobile/apps/family_app
        run: flutter test
      - name: Test staff app
        working-directory: mobile/apps/staff_app
        run: flutter test
      - name: Test app bootstrap
        working-directory: mobile/packages/app_bootstrap
        run: flutter test
      - name: Test authentication
        working-directory: mobile/packages/authentication
        run: flutter test
      - name: Test design system
        working-directory: mobile/packages/design_system
        run: flutter test
      - name: Test Family domain
        working-directory: mobile/packages/family_domain
        run: dart test
      - name: Test Staff domain
        working-directory: mobile/packages/staff_domain
        run: dart test
      - name: Test mobile core
        working-directory: mobile/packages/mobile_core
        run: dart test
      - name: Test API client
        working-directory: mobile/packages/api_client
        run: dart test
      - name: Build family Android debug APK
        working-directory: mobile/apps/family_app
        run: flutter build apk --debug
      - name: Build staff Android debug APK
        working-directory: mobile/apps/staff_app
        run: flutter build apk --debug
