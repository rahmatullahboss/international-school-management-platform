name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - 'module/flutter-mobile-apps'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: write

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - name: Show Flutter toolchain
        run: flutter --version
      - name: Resolve workspace dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Canonicalize mobile sources
        run: |
          cd mobile
          dart format .
          rm -rf .dart_tool apps/*/.dart_tool packages/*/.dart_tool
      - name: Commit canonical source cleanup
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- mobile; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A mobile
          git commit -m "chore(MOB-01): remove generated Flutter metadata"
          git push origin HEAD:module/flutter-mobile-apps
      - name: Restore workspace metadata for verification
        working-directory: mobile
        run: flutter pub get
      - name: Analyze family app
        working-directory: mobile/apps/family_app
        run: flutter analyze
      - name: Analyze staff app
        working-directory: mobile/apps/staff_app
        run: flutter analyze
      - name: Analyze design system
        working-directory: mobile/packages/design_system
        run: flutter analyze
      - name: Analyze mobile core
        working-directory: mobile/packages/mobile_core
        run: dart analyze
      - name: Analyze API client
        working-directory: mobile/packages/api_client
        run: dart analyze
      - name: Test family app
        working-directory: mobile/apps/family_app
        run: flutter test
      - name: Test staff app
        working-directory: mobile/apps/staff_app
        run: flutter test
      - name: Test design system
        working-directory: mobile/packages/design_system
        run: flutter test
      - name: Test mobile core
        working-directory: mobile/packages/mobile_core
        run: dart test
