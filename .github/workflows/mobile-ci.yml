name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - 'module/flutter-mobile-apps'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: write

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - name: Show Flutter toolchain
        run: flutter --version
      - name: Resolve workspace dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Apply panel hardening and canonical formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mobile/packages/design_system/lib/school_design_system.dart')
          source = path.read_text()
          old = """  @override
            Widget build(BuildContext context) => Container(
              decoration: BoxDecoration(
                border: Border.all(color: SchoolColors.structuralRule),
                borderRadius: BorderRadius.circular(16),
                color: SchoolColors.paper,
              ),
              padding: padding ?? const EdgeInsets.all(SchoolSpacing.md),
              child: child,
            );
          """
          new = """  @override
            Widget build(BuildContext context) => Material(
              clipBehavior: Clip.antiAlias,
              color: SchoolColors.paper,
              shape: RoundedRectangleBorder(
                borderRadius: BorderRadius.circular(16),
                side: const BorderSide(color: SchoolColors.structuralRule),
              ),
              child: Padding(
                padding: padding ?? const EdgeInsets.all(SchoolSpacing.md),
                child: child,
              ),
            );
          """
          if old in source:
              path.write_text(source.replace(old, new))
          elif 'Widget build(BuildContext context) => Material(' not in source:
              raise SystemExit('SchoolPanel implementation did not match the reviewed checkpoint')
          PY
          cd mobile
          dart format .
      - name: Commit canonical mobile sources
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- mobile; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile
          git commit -m "style(MOB-01): canonicalize Flutter checkpoint"
          git push origin HEAD:module/flutter-mobile-apps
      - name: Analyze family app
        working-directory: mobile/apps/family_app
        run: flutter analyze
      - name: Analyze staff app
        working-directory: mobile/apps/staff_app
        run: flutter analyze
      - name: Analyze design system
        working-directory: mobile/packages/design_system
        run: flutter analyze
      - name: Analyze mobile core
        working-directory: mobile/packages/mobile_core
        run: dart analyze
      - name: Analyze API client
        working-directory: mobile/packages/api_client
        run: dart analyze
      - name: Test family app
        working-directory: mobile/apps/family_app
        run: flutter test
      - name: Test staff app
        working-directory: mobile/apps/staff_app
        run: flutter test
      - name: Test design system
        working-directory: mobile/packages/design_system
        run: flutter test
      - name: Test mobile core
        working-directory: mobile/packages/mobile_core
        run: dart test
