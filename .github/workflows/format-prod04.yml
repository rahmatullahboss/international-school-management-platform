name: Format PROD-04

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'prod/runtime-credential-self-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/runtime-credential-self-check
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Format PROD-04 TypeScript
        run: npx prettier --write apps/platform-api/src/production-database-credential.ts apps/platform-api/src/production-database-credential.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-api/src/production-database-credential.ts apps/platform-api/src/production-database-credential.test.ts
          git commit -m 'style(prod): format runtime credential guard'
          git push origin HEAD:prod/runtime-credential-self-check
