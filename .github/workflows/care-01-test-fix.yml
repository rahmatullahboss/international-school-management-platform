name: CARE-01 Test Fix

on:
  push:
    branches:
      - module/student-support
    paths:
      - '.github/workflows/care-01-test-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/student-support
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Preserve original idempotent referral result
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/modules/learning-support/src/domain.ts')
          text = path.read_text()
          property_line = "  readonly #referralByIdempotency = new Map<string, string>();\n"
          if '#referralReplay' not in text:
              if property_line not in text:
                  raise SystemExit('referral idempotency property target missing')
              text = text.replace(
                  property_line,
                  property_line + "  readonly #referralReplay = new Map<string, LearningSupportReferral>();\n",
                  1,
              )

          old = """    if (existingId) {
              const existing = this.#referrals.get(this.#key(input.tenantId, existingId));
              if (!existing)
                throw new LearningSupportDomainError('LEARNING_SUPPORT_NOT_FOUND', 'Referral not found');
              return clone(existing);
            }
          """
          # YAML block indentation is stripped; normalize the literal before matching.
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = """    if (existingId) {
              const original = this.#referralReplay.get(replayKey);
              if (!original)
                throw new LearningSupportDomainError('LEARNING_SUPPORT_NOT_FOUND', 'Referral not found');
              return clone(original);
            }
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if 'const original = this.#referralReplay.get(replayKey);' not in text:
              if old not in text:
                  raise SystemExit('learning-support replay block target missing')
              text = text.replace(old, new, 1)

          replay_set = "    this.#referralReplay.set(replayKey, clone(referral));\n"
          idempotency_set = "    this.#referralByIdempotency.set(replayKey, referral.referralId);\n"
          if replay_set not in text:
              if idempotency_set not in text:
                  raise SystemExit('referral replay insertion target missing')
              text = text.replace(idempotency_set, idempotency_set + replay_set, 1)
          path.write_text(text)

          test_path = Path('tests/student-support/interfaces.test.tsx')
          test_text = test_path.read_text()
          test_text = test_text.replace(
              "expect(html).toContain('Step-up authentication');",
              "expect(html).toContain('step-up authentication');",
              1,
          )
          test_path.write_text(test_text)
          PY
      - run: npx prettier --write packages/modules/learning-support/src/domain.ts tests/student-support/interfaces.test.tsx
      - run: npx eslint packages/modules/learning-support/src/domain.ts tests/student-support/interfaces.test.tsx --max-warnings=0
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "CARE-01 Test Fix"
          git config user.email "care-01-test-fix@users.noreply.github.com"
          git add packages/modules/learning-support/src/domain.ts tests/student-support/interfaces.test.tsx
          git commit -m "fix(CARE-01): stabilize referral replay and interface assertion"
          git push origin HEAD:module/student-support
