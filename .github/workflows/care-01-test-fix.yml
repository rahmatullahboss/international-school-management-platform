name: CARE-01 Test Fix

on:
  push:
    branches:
      - module/student-support
    paths:
      - '.github/workflows/care-01-test-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/student-support
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Preserve original idempotent referral result
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/modules/learning-support/src/domain.ts')
          text = path.read_text()
          text = text.replace(
              "  readonly #referralByIdempotency = new Map<string, string>();\n",
              "  readonly #referralByIdempotency = new Map<string, string>();\n  readonly #referralReplay = new Map<string, LearningSupportReferral>();\n",
              1,
          )
          old = """    if (existingId) {
              const existing = this.#referrals.get(this.#key(input.tenantId, existingId));
              if (!existing)
                throw new LearningSupportDomainError('LEARNING_SUPPORT_NOT_FOUND', 'Referral not found');
              return clone(existing);
            }
          """
          new = """    if (existingId) {
              const original = this.#referralReplay.get(replayKey);
              if (!original)
                throw new LearningSupportDomainError('LEARNING_SUPPORT_NOT_FOUND', 'Referral not found');
              return clone(original);
            }
          """
          if old not in text:
              raise SystemExit('learning-support replay target missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              "    this.#referralByIdempotency.set(replayKey, referral.referralId);\n",
              "    this.#referralByIdempotency.set(replayKey, referral.referralId);\n    this.#referralReplay.set(replayKey, clone(referral));\n",
              1,
          )
          path.write_text(text)

          test_path = Path('tests/student-support/interfaces.test.tsx')
          test_text = test_path.read_text()
          old_assertion = "expect(html).toContain('Step-up authentication');"
          new_assertion = "expect(html).toContain('step-up authentication');"
          if old_assertion not in test_text:
              raise SystemExit('interface assertion target missing')
          test_path.write_text(test_text.replace(old_assertion, new_assertion, 1))
          PY
      - run: npx prettier --write packages/modules/learning-support/src/domain.ts tests/student-support/interfaces.test.tsx
      - run: npx eslint packages/modules/learning-support/src/domain.ts tests/student-support/interfaces.test.tsx --max-warnings=0
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "CARE-01 Test Fix"
          git config user.email "care-01-test-fix@users.noreply.github.com"
          git add packages/modules/learning-support/src/domain.ts tests/student-support/interfaces.test.tsx
          git commit -m "fix(CARE-01): stabilize referral replay and interface assertion"
          git push origin HEAD:module/student-support
