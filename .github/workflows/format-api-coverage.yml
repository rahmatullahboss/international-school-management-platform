name: Format API coverage

on:
  push:
    branches:
      - integration/coverage-e2e-100-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/coverage-e2e-100-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/platform-api/src/pilot-operator-api-coverage.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-api/src/pilot-operator-api-coverage.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format operator API coverage tests"
            git push origin HEAD:integration/coverage-e2e-100-v1
          fi
