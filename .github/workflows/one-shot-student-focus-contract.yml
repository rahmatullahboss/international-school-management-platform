name: One-shot student focus contract edit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'codex/student-core-route-workflows-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded focus contract edit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web-student/src/features/experience/StudentDailyWorkspace.tsx')
          text = path.read_text()
          replacements = {
              "  readonly focus?: 'documents' | 'messages';": "  readonly focus?: string;",
              '<div className="student-workspace__split" data-focus-group="documents">': '<div className="student-workspace__split">',
              '          data-focus-item="requests"\n': '',
              '          data-focus-item="documents"\n': '',
              '        data-focus-item="messages"\n': '',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          test "$(git diff --name-only)" = "apps/web-student/src/features/experience/StudentDailyWorkspace.tsx"
          git diff --check
          grep -q 'readonly focus?: string;' apps/web-student/src/features/experience/StudentDailyWorkspace.tsx
          ! grep -q 'data-focus-item\|data-focus-group' apps/web-student/src/features/experience/StudentDailyWorkspace.tsx

      - name: Commit focus contract edit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-student/src/features/experience/StudentDailyWorkspace.tsx
          git commit -m 'refactor(student): generalize route focus contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
