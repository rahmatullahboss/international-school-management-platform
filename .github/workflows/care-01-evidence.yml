          PY
      - run: npx prettier --write docs/execution/03-agent-board.json docs/execution/04-progress-tracker.md
      - run: python3 scripts/validate_execution_artifacts.py
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name "CARE-01 Evidence"
          git config user.email "care-01-evidence@users.noreply.github.com"
          git add docs/execution/03-agent-board.json docs/execution/04-progress-tracker.md
          git commit -m "docs(CARE-01): finalize tracker and board evidence"
          git push origin HEAD:module/student-support
