name: CARE-01 Evidence Update

on:
  push:
    branches:
      - module/student-support
    paths:
      - '.github/workflows/care-01-evidence.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/student-support
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Update CARE board and tracker evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          board_path = Path('docs/execution/03-agent-board.json')
          board = json.loads(board_path.read_text())
          board['updated_at'] = '2026-07-29'
          care = next(stream for stream in board['streams'] if stream['id'] == 'CARE-01')
          care['status'] = 'complete_review_ready_recovery_rehearsal_pending'
          care['starting_base_sha'] = '8cc8ee1562ade672b14c1c44af935fe7e2307976'
          care['threat_model_sha'] = '1ee5ef8dd5c38234cf67acfda5b73df4602f64d4'
          care['verified_implementation_sha'] = 'd257a9af11b03d573c4bb2165f934397be8e7fbe'
          care['draft_pull_request'] = 19
          care['ci'] = {
              'run_id': 30426849884,
              'status': 'success',
              'gates': [
                  'format', 'lint', 'architecture-boundaries', 'typecheck', 'unit-tests',
                  'fresh-postgresql', 'live-neon-driver', 'build', 'audit', 'licenses',
                  'provenance', 'chromium-browser', 'execution-artifacts'
              ],
          }
          care['neon_branch_id'] = 'br-raspy-smoke-ax0msb57'
          care['module_migrations'] = [
              '202607290201_CARE-01_security_contract',
              '202607290202_CARE-01_health',
              '202607290203_CARE-01_behavior',
              '202607290204_CARE-01_wellbeing',
              '202607290205_CARE-01_safeguarding_domain',
              '202607290206_CARE-01_learning_support',
          ]
          care['remaining_integration_gate'] = {
              'gate': 'fresh-disposable-wave1-to-care-recovery-rehearsal',
              'status': 'pending_external_capacity',
              'reason': 'Neon project branch limit is 10/10; satisfying the gate would require deleting or resetting another active agent branch, which CARE-01 did not do.',
              'owner': 'INTEG-01',
          }
          board_path.write_text(json.dumps(board, indent=2, ensure_ascii=False) + '\n')

          tracker_path = Path('docs/execution/04-progress-tracker.md')
          tracker = tracker_path.read_text()
          start_marker = '## CARE-01 evidence\n'
          end_marker = '## EXP-01 evidence\n'
          start = tracker.index(start_marker)
          end = tracker.index(end_marker, start)
          care_section = '''## CARE-01 evidence

