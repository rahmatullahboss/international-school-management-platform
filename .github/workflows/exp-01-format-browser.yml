name: EXP-01 Browser Format

on:
  push:
    branches:
      - module/experience-portals-reporting
    paths:
      - .github/workflows/exp-01-format-browser.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/experience-portals-reporting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply pinned Prettier output
        run: |
          npx prettier --write tests/experience/browser.e2e.ts
          if git diff --quiet -- tests/experience/browser.e2e.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/experience/browser.e2e.ts
          git commit -m "style(EXP-01): format persona browser evidence"
          git pull --rebase origin module/experience-portals-reporting
          git push origin HEAD:module/experience-portals-reporting
