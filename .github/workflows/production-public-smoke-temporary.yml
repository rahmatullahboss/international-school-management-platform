name: Temporary Production Public Smoke

on:
  push:
    branches:
      - deploy/cloudflare-production-pilot

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cloudflare-production
    env:
      API_URL: https://international-school-platform-api-production.rahmatullahzisan.workers.dev
      WEB_URL: https://international-school-platform-web-production.rahmatullahzisan.workers.dev
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify API health and database readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API_URL/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --silent --show-error "$API_URL/auth/v1/database-credential/readiness" | tee /tmp/db.json
          grep -q '"ready":true' /tmp/db.json

      - name: Verify web routes
        run: |
          set -euo pipefail
          for path in / /admin /teacher /family /student; do
            curl --fail --silent --show-error "$WEB_URL$path" > /tmp/page.html
            grep -qi '<!doctype html' /tmp/page.html
            echo "$path PASS"
          done

      - name: Verify PWA assets
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WEB_URL/manifest.webmanifest" > /tmp/manifest
          python3 -c 'import json; d=json.load(open("/tmp/manifest")); assert d.get("name")=="International School Platform"; assert d.get("start_url")=="/"; assert d.get("display")=="standalone"'
          curl --location --fail --silent --show-error "$WEB_URL/offline.html" > /tmp/offline
          grep -qi '<!doctype html' /tmp/offline
          curl --fail --silent --show-error "$WEB_URL/sw.js" > /tmp/sw
          grep -q 'addEventListener' /tmp/sw
          echo 'PWA PASS'

      - name: Capture auth readiness
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/auth.json --write-out '%{http_code}' "$API_URL/auth/v1/readiness" || true)
          cat /tmp/auth.json
          echo
          echo "AUTH_HTTP_STATUS=$status"
          python3 -c 'import json; d=json.load(open("/tmp/auth.json")); print("AUTH_STATE="+str(d.get("state"))); print("AUTH_LOGIN_ENABLED="+str(d.get("loginEnabled"))); print("AUTH_MISSING="+",".join(d.get("missingConfiguration") or []))'

      - name: Inventory Cloudflare cron triggers read-only
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "$auth" "$base" > /tmp/scripts.json
          python3 -c 'import json; d=json.load(open("/tmp/scripts.json")); [print(x.get("id") or x.get("name")) for x in (d.get("result") or []) if (x.get("id") or x.get("name"))]' > /tmp/scripts.txt
          total=0
          while IFS= read -r script; do
            [[ -n "$script" ]] || continue
            enc=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$script")
            curl --fail --silent --show-error -H "$auth" "$base/$enc/schedules" > /tmp/schedules.json
            count=$(python3 -c 'import json; d=json.load(open("/tmp/schedules.json")); print(len((d.get("result") or {}).get("schedules") or []))')
            if [[ "$count" -gt 0 ]]; then
              crons=$(python3 -c 'import json; d=json.load(open("/tmp/schedules.json")); print(",".join(x.get("cron","") for x in ((d.get("result") or {}).get("schedules") or [])))')
              echo "CRON|$script|$count|$crons"
              total=$((total + count))
            fi
          done < /tmp/scripts.txt
          echo "CRON_TOTAL|$total"
