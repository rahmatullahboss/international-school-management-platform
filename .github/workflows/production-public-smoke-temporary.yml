name: Temporary Production Public Smoke

on:
  push:
    branches:
      - deploy/cloudflare-production-pilot

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: https://international-school-platform-api-production.rahmatullahzisan.workers.dev
      WEB_URL: https://international-school-platform-web-production.rahmatullahzisan.workers.dev
    steps:
      - name: Verify API health and database readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API_URL/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --silent --show-error "$API_URL/auth/v1/database-credential/readiness" | tee /tmp/db.json
          grep -q '"ready":true' /tmp/db.json

      - name: Verify web routes
        run: |
          set -euo pipefail
          for path in / /admin /teacher /family /student; do
            curl --fail --silent --show-error "$WEB_URL$path" > /tmp/page.html
            grep -qi '<!doctype html' /tmp/page.html
            echo "$path PASS"
          done

      - name: Diagnose PWA assets
        continue-on-error: true
        run: |
          set -u
          failed=0
          for path in /manifest.webmanifest /offline.html /sw.js; do
            headers=$(mktemp)
            body=$(mktemp)
            status=$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$WEB_URL$path" || true)
            ctype=$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)
            size=$(wc -c < "$body" | tr -d ' ')
            echo "ASSET $path HTTP=$status SIZE=$size $ctype"
            head -c 240 "$body" | tr '\n' ' ' || true
            echo
            [[ "$status" == "200" ]] || failed=1
            if [[ "$path" == "/manifest.webmanifest" ]]; then
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("MANIFEST name=",d.get("name"),"start_url=",d.get("start_url"),"display=",d.get("display")); assert d.get("name")=="International School Platform"; assert d.get("start_url")=="/"; assert d.get("display")=="standalone"' "$body" || failed=1
            elif [[ "$path" == "/offline.html" ]]; then
              grep -qi '<!doctype html' "$body" || failed=1
            else
              grep -q 'addEventListener' "$body" || failed=1
            fi
          done
          [[ "$failed" == "0" ]]

      - name: Capture auth readiness
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/auth.json --write-out '%{http_code}' "$API_URL/auth/v1/readiness" || true)
          cat /tmp/auth.json
          echo
          echo "AUTH_HTTP_STATUS=$status"
          python3 -c 'import json; d=json.load(open("/tmp/auth.json")); print("AUTH_STATE="+str(d.get("state"))); print("AUTH_LOGIN_ENABLED="+str(d.get("loginEnabled"))); print("AUTH_MISSING="+",".join(d.get("missingConfiguration") or []))'
