name: Runtime Coverage

on:
  pull_request:
    paths:
      - 'apps/**/src/**'
      - 'packages/**/src/**'
      - 'tests/**'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-coverage.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/**/src/**'
      - 'packages/**/src/**'
      - 'tests/**'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-coverage.yml'

permissions:
  contents: read

jobs:
  measure-runtime-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Measure runtime coverage
        run: npm run test:coverage
      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: runtime-coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
