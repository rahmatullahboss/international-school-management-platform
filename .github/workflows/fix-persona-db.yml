name: Fix persona database verifier

on:
  pull_request:
    branches:
      - test/full-role-e2e-coverage-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/full-product-persona-e2e-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/full-product-persona-e2e-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Align browser-session verifier with canonical SQL signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/verify-product-persona-e2e.sh')
          text = path.read_text()
          for marker in (
              "    'persona-admissions-session',\n",
              "    'persona-finance-session',\n",
              "    'persona-support-aal1',\n",
              "    'persona-support-aal2',\n",
          ):
              if marker not in text:
                  raise SystemExit(f'expected marker not found: {marker!r}')
              text = text.replace(marker, '', 1)
          old = "    extract(epoch FROM clock_timestamp())::bigint,\n    extract(epoch FROM clock_timestamp() + interval '1 hour')::bigint\n"
          if text.count(old) != 4:
              raise SystemExit(f'expected four timestamp argument pairs, got {text.count(old)}')
          text = text.replace(
              old,
              "    clock_timestamp(),\n    clock_timestamp() + interval '1 hour'\n",
          )
          path.write_text(text)
          PY
      - run: npm run format -- tests/integration/verify-product-persona-e2e.sh
      - name: Commit verifier fix
        run: |
          git add tests/integration/verify-product-persona-e2e.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(e2e): align persona browser session verifier"
          git push origin HEAD:test/full-product-persona-e2e-v2