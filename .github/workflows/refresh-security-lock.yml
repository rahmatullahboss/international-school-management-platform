name: Refresh security lock

on:
  push:
    branches:
      - ux/operational-school-erp-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/operational-school-erp-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Refresh audited dependency lock
        run: |
          npm install --package-lock-only --save-dev 'wrangler@^4.118.0'
          npm install --package-lock-only --workspace=@school/platform-api 'hono@^4.12.34'
          npm audit fix --package-lock-only
          npm audit --audit-level=high
      - name: Commit deterministic dependency refresh
        run: |
          if git diff --quiet -- package.json package-lock.json apps/platform-api/package.json; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json apps/platform-api/package.json
          git commit -m 'chore(deps): refresh audited npm lock'
          git push origin HEAD:ux/operational-school-erp-v1
