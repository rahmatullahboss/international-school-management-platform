name: Temporary mobile remaining count-copy authoring

on:
  push:
    branches:
      - 'mobile/remaining-count-copy-adoption-v1'

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/remaining-count-copy-adoption-v1
      - name: Apply guarded patch
        run: python3 scripts/apply_remaining_count_copy.py
      - name: Format changed Dart files
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
      - name: Apply Dart formatter
        working-directory: mobile
        run: dart format apps/family_app/lib/family_interaction_screens.dart apps/family_app/test/family_production_count_copy_test.dart apps/staff_app/lib/teacher_production_journeys.dart apps/staff_app/test/staff_production_count_copy_test.dart
      - name: Remove temporary authoring helpers
        run: |
          rm scripts/apply_remaining_count_copy.py
          rm .github/workflows/tmp-mobile-remaining-count-authoring.yml
      - name: Commit authored checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/apps/family_app/lib/family_interaction_screens.dart mobile/apps/family_app/test/family_production_count_copy_test.dart mobile/apps/staff_app/lib/teacher_production_journeys.dart mobile/apps/staff_app/test/staff_production_count_copy_test.dart scripts/apply_remaining_count_copy.py .github/workflows/tmp-mobile-remaining-count-authoring.yml
          git diff --cached --check
          git commit -m "feat(mobile): localize remaining production counts"
          git push origin HEAD:mobile/remaining-count-copy-adoption-v1
