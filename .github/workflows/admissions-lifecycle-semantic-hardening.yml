name: Admissions lifecycle semantic hardening

on:
  push:
    branches:
      - codex/admissions-operational-lifecycle-ui-20260810

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-operational-lifecycle-ui-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply semantic hardening
        run: python3 .github/scripts/admissions-lifecycle-semantic-hardening.py
      - name: Format touched TypeScript
        run: npx prettier --write apps/platform-api/src/database-operator-domain-command-store.ts apps/platform-api/src/database-operator-domain-command-store.test.ts apps/platform-api/src/database-operator-work-queue-store.ts apps/platform-web/src/production-operator-work-queue.ts apps/platform-web/src/production-admissions-lifecycle.tsx
      - name: Commit semantic hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/database/post-integration-migrations/202608100201_PROD-05_admissions_lifecycle_work_queue.sql apps/platform-api/src/database-operator-domain-command-store.ts apps/platform-api/src/database-operator-domain-command-store.test.ts apps/platform-api/src/database-operator-work-queue-store.ts apps/platform-web/src/production-operator-work-queue.ts apps/platform-web/src/production-admissions-lifecycle.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(admissions): harden lifecycle placement bounds"
          git push origin HEAD:codex/admissions-operational-lifecycle-ui-20260810
