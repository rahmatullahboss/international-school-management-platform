name: Admissions lifecycle semantic hardening

on:
  push:
    branches:
      - codex/admissions-operational-lifecycle-ui-20260810

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-operational-lifecycle-ui-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply semantic regression fixtures
        run: python3 .github/scripts/admissions-lifecycle-semantic-hardening.py
      - name: Format touched TypeScript
        run: npx prettier --write apps/platform-api/src/database-operator-domain-command-store.test.ts apps/platform-api/src/database-operator-work-queue-store.test.ts apps/platform-api/src/production-operator-work-queue-api.test.ts apps/platform-web/src/production-operator-work-queue.test.ts
      - name: Commit semantic regression fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-api/src/database-operator-domain-command-store.test.ts apps/platform-api/src/database-operator-work-queue-store.test.ts apps/platform-api/src/production-operator-work-queue-api.test.ts apps/platform-web/src/production-operator-work-queue.test.ts tests/integration/verify-admissions-lifecycle-work-queue.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(admissions): lock lifecycle placement bounds"
          git push origin HEAD:codex/admissions-operational-lifecycle-ui-20260810
