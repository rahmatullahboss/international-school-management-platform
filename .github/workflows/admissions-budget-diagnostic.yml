name: Admissions budget diagnostic

on:
  push:
    branches:
      - codex/admissions-operational-lifecycle-ui-20260810

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@school/platform-web
      - run: npm run check:experience-budget
