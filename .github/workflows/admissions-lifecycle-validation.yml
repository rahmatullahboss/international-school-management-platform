name: Admissions lifecycle validation

on:
  push:
    branches:
      - codex/admissions-operational-lifecycle-ui-20260810

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run apps/platform-api/src/database-operator-work-queue-store.test.ts apps/platform-api/src/production-operator-work-queue-api.test.ts apps/platform-api/src/database-operator-domain-command-store.test.ts apps/platform-web/src/production-operator-work-queue.test.ts apps/platform-web/src/production-operator-command.test.ts apps/platform-web/src/production-operator-portal.test.tsx
