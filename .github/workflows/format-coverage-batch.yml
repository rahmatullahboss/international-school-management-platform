name: Format coverage batch

on:
  push:
    branches:
      - integration/coverage-e2e-100-v1

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/coverage-e2e-100-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npx prettier --write packages/modules/ledger/src/contracts/coverage.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/modules/ledger/src/contracts/coverage.test.ts
          git commit -m "style(test): format ledger coverage batch"
          git push origin HEAD:integration/coverage-e2e-100-v1
