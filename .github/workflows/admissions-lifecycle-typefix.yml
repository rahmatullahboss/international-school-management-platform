name: Admissions lifecycle typefix

on:
  push:
    branches:
      - codex/admissions-operational-lifecycle-ui-20260810

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-operational-lifecycle-ui-20260810
      - name: Narrow support fallback command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/platform-web/src/production-operator-portal.tsx')
          text = path.read_text()
          old = """    } else {
      body = {
        command,
        reason: formString(form, 'reason'),
        requestedMinutes: Number(formString(form, 'requestedMinutes')),
      };
    }
"""
          new = """    } else if (command === 'support.break-glass.request') {
      body = {
        command,
        reason: formString(form, 'reason'),
        requestedMinutes: Number(formString(form, 'requestedMinutes')),
      };
    } else {
      return;
    }
"""
          if old not in text:
              raise SystemExit('expected fallback command block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit narrowing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-web/src/production-operator-portal.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(admissions): narrow fallback operator command"
          git push origin HEAD:codex/admissions-operational-lifecycle-ui-20260810
