name: Remove visible pilot boundary

on:
  push:
    branches:
      - codex/remove-visible-pilot-boundary-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/remove-visible-pilot-boundary-20260809
      - name: Replace visible pilot boundary with accessible-only availability text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tsx = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = tsx.read_text()
          text = text.replace('operational-pilot-action-boundary', 'operational-action-availability')
          old = '''      <aside className="operational-pilot-note" id="operational-action-availability">
        <strong>Pilot boundary</strong>
        <span>
          Records shown here are synthetic. Controls that would write, send, publish, approve,
          download or fetch privileged production data stay disabled unless an existing safe route
          contract is wired. Local attendance marking can be saved on this device without sending a
          production write.
        </span>
      </aside>'''
          new = '''      <span className="operational-sr-only" id="operational-action-availability">
        This action is unavailable in the current environment.
      </span>'''
          if old not in text:
              raise SystemExit('visible pilot boundary target not found')
          tsx.write_text(text.replace(old, new, 1))

          css = Path('apps/platform-web/src/operational-module-surface.css')
          text = css.read_text()
          old = '''.operational-pilot-note {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.8rem;
  padding: 0.8rem 0;
  border-block: 1px solid var(--op-rule);
  color: var(--op-muted);
  font-size: 0.78rem;
  line-height: 1.45;
}

.operational-pilot-note strong {
  color: var(--op-ink);
}'''
          new = '''.operational-sr-only {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}'''
          if old not in text:
              raise SystemExit('pilot boundary CSS target not found')
          css.write_text(text.replace(old, new, 1))

          tests = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          text = tests.read_text()
          old = '''    expect(markup).toContain('operational-pilot-action-boundary');
    expect(markup).toContain('Approve with AAL2');
    expect(markup).toContain('disabled=""');
    expect(markup).toContain('existing safe route contract is wired');'''
          new = '''    expect(markup).toContain('operational-action-availability');
    expect(markup).toContain('operational-sr-only');
    expect(markup).toContain('Approve with AAL2');
    expect(markup).toContain('disabled=""');
    expect(markup).toContain('This action is unavailable in the current environment.');
    expect(markup).not.toContain('Pilot boundary');'''
          if old not in text:
              raise SystemExit('pilot boundary test target not found')
          tests.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write \
            apps/platform-web/src/operational-module-surface.tsx \
            apps/platform-web/src/operational-module-surface.css \
            apps/platform-web/src/operational-module-surface.test.tsx
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            apps/platform-web/src/operational-module-surface.css \
            apps/platform-web/src/operational-module-surface.test.tsx \
            apps/platform-web/src/operational-module-surface.tsx | sort)"
          if [ -z "$changed" ]; then exit 0; fi
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.css apps/platform-web/src/operational-module-surface.test.tsx
          git commit -m "fix(ux): remove visible pilot action boundary"
          git push origin HEAD:codex/remove-visible-pilot-boundary-20260809
