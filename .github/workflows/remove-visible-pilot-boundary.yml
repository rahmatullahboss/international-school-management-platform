name: Remove visible pilot boundary

on:
  push:
    branches:
      - codex/remove-visible-pilot-boundary-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/remove-visible-pilot-boundary-20260809
      - name: Replace visible pilot boundary with accessible-only availability text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          tsx = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = tsx.read_text().replace('operational-pilot-action-boundary', 'operational-action-availability')
          pattern = r'\n      <aside className="operational-pilot-note" id="operational-action-availability">.*?\n      </aside>'
          replacement = '\n      <span className="operational-sr-only" id="operational-action-availability">\n        This action is unavailable in the current environment.\n      </span>'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('visible pilot boundary target not found')
          tsx.write_text(text)
          css = Path('apps/platform-web/src/operational-module-surface.css')
          text = css.read_text()
          pattern = r'\n\.operational-pilot-note \{.*?\n\}\n\n\.operational-pilot-note strong \{.*?\n\}'
          replacement = '\n.operational-sr-only {\n  position: absolute;\n  inline-size: 1px;\n  block-size: 1px;\n  overflow: hidden;\n  clip: rect(0 0 0 0);\n  white-space: nowrap;\n}'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('pilot boundary CSS target not found')
          css.write_text(text)
          tests = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          text = tests.read_text()
          old = "    expect(markup).toContain('operational-pilot-action-boundary');\n    expect(markup).toContain('Approve with AAL2');\n    expect(markup).toContain('disabled=\"\"');\n    expect(markup).toContain('existing safe route contract is wired');"
          new = "    expect(markup).toContain('operational-action-availability');\n    expect(markup).toContain('operational-sr-only');\n    expect(markup).toContain('Approve with AAL2');\n    expect(markup).toContain('disabled=\"\"');\n    expect(markup).toContain('This action is unavailable in the current environment.');\n    expect(markup).not.toContain('Pilot boundary');"
          if old not in text:
              raise SystemExit('pilot boundary test target not found')
          tests.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.css apps/platform-web/src/operational-module-surface.test.tsx
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' apps/platform-web/src/operational-module-surface.css apps/platform-web/src/operational-module-surface.test.tsx apps/platform-web/src/operational-module-surface.tsx | sort)"
          if [ -z "$changed" ]; then exit 0; fi
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.css apps/platform-web/src/operational-module-surface.test.tsx
          git commit -m "fix(ux): remove visible pilot action boundary"
          git push origin HEAD:codex/remove-visible-pilot-boundary-20260809
