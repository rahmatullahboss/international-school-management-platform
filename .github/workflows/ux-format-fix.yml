name: Format UX Continuity Branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: ux-continuity-format
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'ux/smooth-operational-experience-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/smooth-operational-experience-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      - name: Apply source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('apps/platform-web/src/main.tsx')
          main_text = main.read_text(encoding='utf-8')
          main_text = main_text.replace("  type MouseEvent as ReactMouseEvent,\n", "")
          main.write_text(main_text, encoding='utf-8')

          shared = Path('apps/platform-web/src/portal-shared.tsx')
          shared_text = shared.read_text(encoding='utf-8')
          shared_text = shared_text.replace(
              "export function shellUtilityActions(_activeRole: PilotRole) {\n  return [] as const;\n}",
              "export function shellUtilityActions(activeRole: PilotRole) {\n  void activeRole;\n  return [] as const;\n}",
          )
          shared.write_text(shared_text, encoding='utf-8')
          PY

      - run: npm run format
      - run: npm run lint

      - name: Commit canonical UX source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(ux): format continuous navigation source'
          git push origin HEAD:ux/smooth-operational-experience-v1
