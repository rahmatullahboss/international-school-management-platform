name: Format UX Continuity Branch

on:
  push:
    branches:
      - ux/smooth-operational-experience-v1

permissions:
  contents: write

concurrency:
  group: ux-continuity-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/smooth-operational-experience-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      - name: Remove stale type import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/platform-web/src/main.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace("  type MouseEvent as ReactMouseEvent,\n", "")
          path.write_text(text, encoding='utf-8')
          PY

      - run: npm run format
      - run: npm run lint

      - name: Commit canonical UX source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(ux): format continuous navigation source'
          git push origin HEAD:ux/smooth-operational-experience-v1
