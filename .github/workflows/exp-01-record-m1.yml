name: EXP-01 Record Milestone 1

on:
  push:
    branches:
      - module/experience-portals-reporting
    paths:
      - .github/workflows/exp-01-record-m1.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/experience-portals-reporting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Update checkpoint evidence
        run: |
          python3 <<'PY'
          from pathlib import Path

          tracker_path = Path('docs/execution/04-progress-tracker.md')
          tracker = tracker_path.read_text(encoding='utf-8')
          old_row = "| `EXP-01` | 3 | ready | `60836a8fe92f64ba581c4bde65005729d1fe14b2` | persona shells | reviewed Wave 2 gate passed | none |"
          new_row = "| `EXP-01` | 3 | in progress; milestone 1 complete | `60836a8fe92f64ba581c4bde65005729d1fe14b2` | admin experience | checkpoint `7742a993a4959ae75c900ae1ce4b77041d991f92`; CI `30440461448` green | none |"
          if tracker.count(old_row) != 1:
              raise SystemExit('EXP-01 tracker row changed unexpectedly')
          tracker = tracker.replace(old_row, new_row)

          heading = '## EXP-01 evidence'
          record = """

          ## EXP-01 evidence

          Date/time: 2026-07-29T15:38:00+06:00
          Stream: EXP-01
          Milestone completed: 1 — persona experience foundation
          Git branch: `module/experience-portals-reporting`
          Worktree: `.worktrees/exp-01-experience`
          Neon branch: `agent/exp-01-experience` (`br-billowing-bar-axe2et95`), project `lingering-brook-52999532`
          Starting base: reviewed Wave 2 integration SHA `60836a8fe92f64ba581c4bde65005729d1fe14b2`
          Checkpoint SHA: `7742a993a4959ae75c900ae1ce4b77041d991f92`
          Changed owned paths: `packages/modules/documents-experience/**`; persona experience adapters in `apps/web-admin`, `apps/web-teacher`, `apps/web-family` and `apps/web-student`; `tests/experience/**`; experience documentation; workspace package/typecheck/browser registration
          Focused checks and results: CI `30440461448` PASS — format, lint, architecture boundaries, TypeScript project references, full Vitest suite, fresh 40-migration PostgreSQL replay, live Neon driver, build, dependency audit, licence/provenance, all Chromium suites and execution-artifact validation; EXP Chromium proof passed semantic navigation, keyboard skip-link focus, mobile RTL containment, offline state and reduced-motion behavior
          UI/design evidence when applicable: Impeccable v4.0.2; `PRODUCT.md` blob `5e769c75f28c0c5cc426f5b85eaf46f032a3367f`; `DESIGN.md` blob `4be926a77d501dd8f16934ad4c50672ba754d66f`; Operate-mode surface brief, capability-filtered persona separation, explicit session/network states, responsive/RTL, keyboard and reduced-motion proofs; established Operational Ledger authority consumed without replacing module-owned workspaces
          Database evidence: dedicated EXP Neon branch verified with the exact reviewed 40-migration Wave 2 ledger; no new EXP schema required for the shell milestone
          Gate outcome: milestone 1 passed; `GATE-EXP-COMPLETE` remains blocked pending milestones 2–8
          Exact next milestone: 2 — admin experience, cross-module exception queues, governed search, approvals and bulk-operation surfaces
          Dirty/uncommitted state: no uncommitted branch changes; one-shot evidence workflow removed after recording
          Production mutation performed: no
          """
          if heading not in tracker:
              tracker = tracker.rstrip() + record
          tracker_path.write_text(tracker.rstrip() + '\n', encoding='utf-8')

          milestone_path = Path('docs/modules/experience/milestone-1-persona-foundation.md')
          milestone = milestone_path.read_text(encoding='utf-8')
          old_context = "The reviewed branch does not contain the root `PRODUCT.md` or `DESIGN.md` files referenced by the execution contract. EXP-01 did not recreate or modify those coordinator-owned authorities as a side effect. The checkpoint inherits the established Operate language visible in the reviewed SIS, finance, academics, operations, integrations and student-support surfaces: bright institutional paper, ink-blue structure, restrained teal actions, amber exceptions, compact task-first information and explicit audit/security state."
          new_context = "The active EXP branch consumes the reviewed root authorities: `PRODUCT.md` blob `5e769c75f28c0c5cc426f5b85eaf46f032a3367f` and `DESIGN.md` blob `4be926a77d501dd8f16934ad4c50672ba754d66f`. The checkpoint follows their Operational Ledger direction: institutional paper, ink-blue structure, restrained teal actions, amber exceptions, task-first information and explicit permission, assurance, network and recovery state. It composes existing module-owned workspaces rather than replacing them."
          if milestone.count(old_context) != 1:
              raise SystemExit('Milestone context changed unexpectedly')
          milestone = milestone.replace(old_context, new_context)
          old_verification = "## Verification intent\n\nFocused tests cover capability filtering, RTL resolution, persona separation, offline guidance, verified-session context and recoverable loading/error states. Full format, lint, boundaries, typecheck, test, build, accessibility/browser and design-detector checks remain required before the milestone gate is passed."
          new_verification = """## Verification

CI run `30440461448` passed format, lint, architecture boundaries, TypeScript project references, the full Vitest suite, fresh replay of all 40 reviewed migrations, the live Neon driver, build, dependency audit, licence/provenance checks, all Chromium suites and the execution-artifact validator.

Focused component tests cover capability filtering, RTL resolution, persona separation, offline guidance, verified-session context and recoverable loading/error states. EXP-specific Chromium tests prove semantic navigation, keyboard skip-link focus, mobile RTL containment, explicit offline recovery and reduced-motion behavior.

Milestone 1 is passed at checkpoint `7742a993a4959ae75c900ae1ce4b77041d991f92`."""
          if milestone.count(old_verification) != 1:
              raise SystemExit('Milestone verification section changed unexpectedly')
          milestone = milestone.replace(old_verification, new_verification)
          milestone_path.write_text(milestone.rstrip() + '\n', encoding='utf-8')
          PY
          npx prettier --write \
            docs/execution/04-progress-tracker.md \
            docs/modules/experience/milestone-1-persona-foundation.md
          python3 scripts/validate_execution_artifacts.py
      - name: Commit checkpoint evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/execution/04-progress-tracker.md \
            docs/modules/experience/milestone-1-persona-foundation.md
          git commit -m "docs(EXP-01): record persona foundation checkpoint"
          git pull --rebase origin module/experience-portals-reporting
          git push origin HEAD:module/experience-portals-reporting
