name: Remove visible fixture copy

on:
  push:
    branches:
      - codex/remove-visible-fixture-copy-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/remove-visible-fixture-copy-20260809
      - name: Replace visible pilot and fixture copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          surface = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = surface.read_text()
          replacements = {
              "Saved on this device. No production attendance write was sent.":
                  "Saved on this device. Attendance has not been submitted to the school.",
              "No production payments in this pilot.":
                  "Review the available payment channels; payment submission is not available on this screen.",
              "Only Wednesday’s synthetic schedule is loaded in this pilot fixture.":
                  "Only Wednesday’s published schedule is available in this view.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing source copy: {old}')
              text = text.replace(old, new, 1)
          surface.write_text(text)

          tests = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          text = tests.read_text()
          old = "expect(markup).toContain('Only Wednesday’s synthetic schedule is loaded');"
          new = "expect(markup).toContain('Only Wednesday’s published schedule is available in this view.');"
          if old not in text:
              raise SystemExit('student timetable copy assertion not found')
          text = text.replace(old, new, 1)
          old = "    expect(markup).toContain('operational-action-availability');\n  });\n\n  it('wires the family offline form draft"
          new = "    expect(markup).toContain('operational-action-availability');\n    expect(markup).toContain('payment submission is not available on this screen');\n    expect(markup).not.toContain('No production payments in this pilot');\n  });\n\n  it('wires the family offline form draft"
          if old not in text:
              raise SystemExit('family finance contract insertion point not found')
          tests.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' apps/platform-web/src/operational-module-surface.test.tsx apps/platform-web/src/operational-module-surface.tsx | sort)"
          if [ -z "$changed" ]; then exit 0; fi
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx
          git commit -m "fix(ux): replace visible fixture copy"
          git push origin HEAD:codex/remove-visible-fixture-copy-20260809
