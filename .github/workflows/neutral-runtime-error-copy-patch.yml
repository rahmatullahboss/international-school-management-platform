name: Neutral runtime error copy patch

on:
  push:
    branches:
      - codex/neutral-runtime-error-copy-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/neutral-runtime-error-copy-20260809
      - name: Replace surfaced pilot API error language
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          resource = Path('apps/platform-web/src/pilot-resource.ts')
          text = resource.read_text()
          replacements = {
              '`Pilot session API returned ${response.status}.`': '`Staging session service returned ${response.status}.`',
              "'Pilot session API returned an invalid identity scope.'": "'Staging session service returned an invalid identity scope.'",
              "'Pilot session API returned an expired identity session.'": "'Staging session service returned an expired session.'",
              '`Pilot read API returned ${response.status}.`': '`Staging data service returned ${response.status}.`',
              "'Pilot read API returned a snapshot outside the requested scope.'": "'Staging data service returned data outside the requested scope.'",
              "'Pilot identity session could not be renewed.'": "'Staging identity session could not be renewed.'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing runtime error target: {old}')
              text = text.replace(old, new, 1)
          resource.write_text(text)

          browser = Path('tests/browser/pilot-portals.spec.ts')
          text = browser.read_text()
          anchor = "test('a failed signed refresh keeps the last safe role data instead of showing a loading page', async ({\n  page,\n}) => {"
          test_block = '''test('staging session failures use neutral service language', async ({ page }) => {
  await configurePilotApi(page);
  await page.route('https://pilot-api.test/pilot/v1/sessions/admin', async (route) => {
    await route.fulfill({
      status: 503,
      headers: { 'access-control-allow-origin': '*' },
      contentType: 'application/json',
      body: JSON.stringify({ error: 'temporarily_unavailable' }),
    });
  });

  await page.goto('/admin');
  await expect(page.getByText('Using saved data')).toBeVisible();
  await expect(page.getByText(/Staging session service returned 503/u)).toBeVisible();
  await expect(page.getByText(/Pilot session API/u)).toHaveCount(0);
});

'''
          if test_block not in text:
              if anchor not in text:
                  raise SystemExit('browser failure-test insertion point not found')
              text = text.replace(anchor, test_block + anchor, 1)
          browser.write_text(text)
          PY
          npx prettier --write apps/platform-web/src/pilot-resource.ts tests/browser/pilot-portals.spec.ts
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' apps/platform-web/src/pilot-resource.ts tests/browser/pilot-portals.spec.ts | sort)"
          if [ -z "$changed" ]; then exit 0; fi
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/platform-web/src/pilot-resource.ts tests/browser/pilot-portals.spec.ts
          git commit -m "fix(ux): neutralize runtime error copy"
          git push origin HEAD:codex/neutral-runtime-error-copy-20260809
