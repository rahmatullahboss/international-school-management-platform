name: one-shot remove duplicate conversion check v2

on:
  push:
    branches:
      - codex/admissions-accept-convert-20260810

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-accept-convert-20260810
          fetch-depth: 0
      - name: Remove second collision block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('infra/database/post-integration-migrations/202608100101_PILOT-15_admissions_accept_convert_commands.sql')
          text = path.read_text()
          pattern = re.compile(r"  IF EXISTS \(\n    SELECT 1\n    FROM admissions\.applicant_conversion AS conversion\n    WHERE conversion\.tenant_id = session_context\.tenant_id\n      AND conversion\.idempotency_key = p_idempotency_key\n      AND conversion\.application_id <> p_application_id\n  \) THEN\n    RETURN jsonb_build_object\('accepted', false, 'reason', 'idempotency-conflict'\);\n  END IF;\n?", re.MULTILINE)
          matches = list(pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'expected two conversion collision blocks, found {len(matches)}')
          second = matches[1]
          text = text[:second.start()] + text[second.end():]
          path.write_text(text)
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add infra/database/post-integration-migrations/202608100101_PILOT-15_admissions_accept_convert_commands.sql
          git commit -m 'refactor(admissions): remove duplicate conversion collision check'
          git push origin HEAD:codex/admissions-accept-convert-20260810
