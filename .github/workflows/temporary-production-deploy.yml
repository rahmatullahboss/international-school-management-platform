name: Temporary authorized production deploy

on:
  push:
    branches:
      - deploy/cloudflare-production-pilot

permissions:
  contents: read

concurrency:
  group: temporary-cloudflare-production-deploy
  cancel-in-progress: true

jobs:
  verify-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Reuse the existing GitHub environment only as the Cloudflare account credential store.
    # The deployment target below is explicitly Wrangler env=production.
    environment: cloudflare-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API_URL: https://international-school-platform-api-production.rahmatullahzisan.workers.dev
      WEB_URL: https://international-school-platform-web-production.rahmatullahzisan.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install dependencies
        run: npm ci

      - name: Verify repository before production deploy
        run: npm run verify

      - name: Deploy production API Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config apps/platform-api/wrangler.jsonc --env production 2>&1 | tee api-production-deploy.log
          grep -Fq "$API_URL" api-production-deploy.log

      - name: Build and deploy production web Worker
        shell: bash
        run: |
          set -euo pipefail
          VITE_PLATFORM_API_URL="$API_URL" npm run build --workspace=@school/platform-web
          npx wrangler deploy --config apps/platform-web/wrangler.jsonc --env production 2>&1 | tee web-production-deploy.log
          grep -Fq "$WEB_URL" web-production-deploy.log

      - name: Smoke test live production deployment
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            local label="$3"
            for attempt in {1..12}; do
              if curl --location --fail --silent --show-error "$url" --output "$output"; then
                return 0
              fi
              if [[ "$attempt" == '12' ]]; then
                echo "$label did not become ready: $url" >&2
                return 1
              fi
              sleep 5
            done
          }

          fetch_with_retry "$API_URL/health" api-health.json 'API health'
          fetch_with_retry "$API_URL/auth/v1/readiness" api-readiness.json 'API auth readiness'
          fetch_with_retry "$WEB_URL/auth/v1/readiness" web-proxied-readiness.json 'Web-to-API service binding'
          fetch_with_retry "$WEB_URL/" web-index.html 'Role chooser'
          fetch_with_retry "$WEB_URL/admin" web-admin.html 'Admin portal'
          fetch_with_retry "$WEB_URL/teacher" web-teacher.html 'Teacher portal'
          fetch_with_retry "$WEB_URL/family" web-family.html 'Guardian portal'
          fetch_with_retry "$WEB_URL/student" web-student.html 'Student portal'
          fetch_with_retry "$WEB_URL/manifest.webmanifest" web-manifest.json 'PWA manifest'
          fetch_with_retry "$WEB_URL/offline.html" web-offline.html 'Offline page'

          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('api-health.json').read_text(encoding='utf-8'))
          assert health.get('status') == 'ok', health
          assert health.get('environment') == 'production', health

          readiness = json.loads(Path('api-readiness.json').read_text(encoding='utf-8'))
          proxied = json.loads(Path('web-proxied-readiness.json').read_text(encoding='utf-8'))
          assert readiness.get('schemaVersion') == 1, readiness
          assert readiness.get('mode') == 'oidc-bff', readiness
          assert proxied.get('schemaVersion') == 1, proxied
          assert proxied.get('mode') == 'oidc-bff', proxied

          for path in ['web-index.html', 'web-admin.html', 'web-teacher.html', 'web-family.html', 'web-student.html']:
              text = Path(path).read_text(encoding='utf-8').lower()
              assert '<!doctype html' in text, path

          manifest = json.loads(Path('web-manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('name'), manifest
          assert manifest.get('start_url') is not None, manifest

          print('production_auth_state=' + str(readiness.get('state')))
          print('production_missing_configuration=' + json.dumps(readiness.get('missingConfiguration', [])))
          PY

      - name: Publish production URLs
        shell: bash
        run: |
          {
            echo '### Production deployment verification'
            echo
            echo "- API: $API_URL"
            echo "- Web: $WEB_URL"
            echo '- Production deploy and live smoke completed from current main-derived branch.'
          } >> "$GITHUB_STEP_SUMMARY"
