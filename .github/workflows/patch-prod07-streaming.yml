name: Patch PROD-07 Streaming Caps

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'prod/streaming-body-bounds'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/streaming-body-bounds
      - name: Wire bounded stream readers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('apps/platform-api/src/index.ts')
          text = index.read_text()
          old = """import {\n  handleOidcBackchannelLogoutRequest,\n  isOidcBackchannelDeclaredLengthAllowed,\n} from './auth-backchannel.js';\n"""
          new = """import {\n  handleOidcBackchannelLogoutRequest,\n  isOidcBackchannelDeclaredLengthAllowed,\n  readBoundedOidcBackchannelBody,\n} from './auth-backchannel.js';\n"""
          if old not in text:
            raise SystemExit('backchannel import marker missing')
          text = text.replace(old, new, 1)
          old = """  let rawBody = '';\n  if (configured && declaredLengthAllowed) {\n    try {\n      rawBody = await context.req.text();\n    } catch {\n      rawBody = '';\n    }\n  }\n"""
          new = """  let rawBody = '';\n  if (configured && declaredLengthAllowed) {\n    rawBody = (await readBoundedOidcBackchannelBody(context.req.raw.body)) ?? '';\n  }\n"""
          if old not in text:
            raise SystemExit('backchannel body marker missing')
          index.write_text(text.replace(old, new, 1))

          operator = Path('apps/platform-api/src/production-operator-command-api.ts')
          text = operator.read_text()
          import_marker = """import { isAllowedAuthMutationOrigin } from './auth-logout.js';\n"""
          import_replacement = import_marker + """import { readBoundedUtf8RequestBody } from './bounded-request-body.js';\n"""
          if import_marker not in text:
            raise SystemExit('operator import marker missing')
          text = text.replace(import_marker, import_replacement, 1)
          old = """  try {\n    const text = await request.text();\n    if (new TextEncoder().encode(text).byteLength > MAX_BODY_BYTES) return undefined;\n    return JSON.parse(text) as unknown;\n  } catch {\n    return undefined;\n  }\n"""
          new = """  const text = await readBoundedUtf8RequestBody(request.body, MAX_BODY_BYTES);\n  if (text === undefined || text === '') return undefined;\n  try {\n    return JSON.parse(text) as unknown;\n  } catch {\n    return undefined;\n  }\n"""
          if old not in text:
            raise SystemExit('operator body marker missing')
          operator.write_text(text.replace(old, new, 1))

          test = Path('apps/platform-api/src/production-operator-command-api.test.ts')
          text = test.read_text()
          marker = """  it('rejects browser-selected session and tenancy scope', async () => {\n"""
          addition = """  it('rejects an undeclared streamed body over the byte cap before session work', async () => {\n    const deps = dependencies();\n    const oversized = request({ ...admissionsBody(), notes: 'x'.repeat(5000) });\n    expect(oversized.headers.get('content-length')).toBeNull();\n    const response = await handleProductionOperatorCommandRequest(\n      oversized,\n      environment,\n      deps.value,\n    );\n    expect(response?.status).toBe(400);\n    await expect(response?.json()).resolves.toMatchObject({\n      error: { code: 'operator_command_invalid' },\n    });\n    expect(deps.value.resolveSession).not.toHaveBeenCalled();\n    expect(deps.submit).not.toHaveBeenCalled();\n  });\n\n"""
          if marker not in text:
            raise SystemExit('operator test marker missing')
          test.write_text(text.replace(marker, addition + marker, 1))
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-api/src/index.ts apps/platform-api/src/production-operator-command-api.ts apps/platform-api/src/production-operator-command-api.test.ts
          git commit -m 'feat(prod): enforce streaming body caps on sensitive routes'
          git push origin HEAD:prod/streaming-body-bounds
