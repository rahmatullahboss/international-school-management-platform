name: E2E Format Authoring

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Print canonical formatted test
        shell: bash
        run: |
          npx prettier --write tests/browser/full-role-route-coverage.spec.ts
          printf '%s\n' '---BEGIN-FORMATTED---'
          cat tests/browser/full-role-route-coverage.spec.ts
          printf '%s\n' '---END-FORMATTED---'
