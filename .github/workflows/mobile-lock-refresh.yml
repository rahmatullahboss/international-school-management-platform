name: Mobile Lock Refresh

on:
  pull_request:
    paths:
      - 'mobile/packages/design_system/pubspec.yaml'
      - '.github/workflows/mobile-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve exact Flutter workspace lock
        working-directory: mobile
        run: flutter pub get
      - name: Commit generated lock when changed
        shell: bash
        run: |
          if git diff --quiet -- mobile/pubspec.lock; then
            echo 'mobile/pubspec.lock already matches Flutter 3.44.7.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/pubspec.lock
          git commit -m 'chore(mobile): refresh localization lock'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
