name: PR98 published attendance selection

on:
  push:
    branches:
      - ux/operational-school-erp-v1

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/operational-school-erp-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Wire published attendance record selection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = source.read_text()

          old_start = '''function AttendancePublished(props: { readonly student: boolean }): ReactElement {\n  return ('''
          new_start = '''function AttendancePublished(props: { readonly student: boolean }): ReactElement {\n  const [selectedAttendance, setSelectedAttendance] = useState<'12 Jul' | '14 Jul'>('12 Jul');\n\n  return ('''
          if old_start not in text:
            raise SystemExit('AttendancePublished function marker missing')
          text = text.replace(old_start, new_start, 1)

          old_rows = '''            rows={[\n              ['15 Jul', <Status key="s">Present</Status>, 'Full day', '—', 'View'],\n              [\n                '14 Jul',\n                <Status key="s">Present · Revised</Status>,\n                'Corrected by office',\n                'Previously late · history retained',\n                'View history',\n              ],\n              [\n                '12 Jul',\n                <Status key="s">Absent</Status>,\n                'Published 08:15',\n                'Explanation under review',\n                'Track explanation',\n              ],\n              [\n                '10 Jul',\n                <Status key="s">Late</Status>,\n                'Arrived 08:45',\n                'Published record',\n                'View',\n              ],\n              ['09 Jul', <Status key="s">Present</Status>, 'Full day', '—', 'View'],\n            ]}'''
          new_rows = '''            rows={[\n              [\n                '15 Jul',\n                <Status key="s">Present</Status>,\n                'Full day',\n                '—',\n                <PilotUnavailableAction key="a">View</PilotUnavailableAction>,\n              ],\n              [\n                '14 Jul',\n                <Status key="s">Present · Revised</Status>,\n                'Corrected by office',\n                'Previously late · history retained',\n                <button\n                  aria-label="View 14 July revision history"\n                  aria-pressed={selectedAttendance === '14 Jul'}\n                  key="a"\n                  onClick={() => setSelectedAttendance('14 Jul')}\n                  type="button"\n                >\n                  View history\n                </button>,\n              ],\n              [\n                '12 Jul',\n                <Status key="s">Absent</Status>,\n                'Published 08:15',\n                'Explanation under review',\n                <button\n                  aria-label="Track 12 July explanation"\n                  aria-pressed={selectedAttendance === '12 Jul'}\n                  key="a"\n                  onClick={() => setSelectedAttendance('12 Jul')}\n                  type="button"\n                >\n                  Track explanation\n                </button>,\n              ],\n              [\n                '10 Jul',\n                <Status key="s">Late</Status>,\n                'Arrived 08:45',\n                'Published record',\n                <PilotUnavailableAction key="a">View</PilotUnavailableAction>,\n              ],\n              [\n                '09 Jul',\n                <Status key="s">Present</Status>,\n                'Full day',\n                '—',\n                <PilotUnavailableAction key="a">View</PilotUnavailableAction>,\n              ],\n            ]}'''
          if old_rows not in text:
            raise SystemExit('Published attendance rows marker missing')
          text = text.replace(old_rows, new_rows, 1)

          old_pane = '''        <Pane\n          title="12 July absence"\n          description={\n            props.student\n              ? 'Your family submitted an explanation.'\n              : 'Household explanation lifecycle.'\n          }\n        >\n          <Timeline\n            label="Absence explanation timeline"\n            items={[\n              {\n                time: '08:15',\n                title: 'Absence published',\n                detail: 'Main Campus attendance ledger',\n                status: 'Published',\n              },\n              {\n                time: '09:30',\n                title: 'Explanation submitted',\n                detail: props.student\n                  ? 'Your family submitted an explanation.'\n                  : 'Family explanation received and preserved.',\n                status: 'Submitted',\n              },\n              {\n                time: '10:00',\n                title: 'School reviewing',\n                detail: 'Assigned to attendance officer',\n                status: 'In review',\n              },\n              {\n                time: 'Next',\n                title: 'Decision',\n                detail: 'The published outcome will appear here.',\n                status: 'Pending',\n              },\n            ]}\n          />\n        </Pane>'''
          new_pane = '''        <Pane\n          title={selectedAttendance === '12 Jul' ? '12 July absence' : '14 July revision history'}\n          description={\n            selectedAttendance === '12 Jul'\n              ? props.student\n                ? 'Your family submitted an explanation.'\n                : 'Household explanation lifecycle.'\n              : 'Published correction history; the prior state remains visible.'\n          }\n        >\n          <Timeline\n            label={\n              selectedAttendance === '12 Jul'\n                ? 'Absence explanation timeline'\n                : 'Attendance revision timeline'\n            }\n            items={\n              selectedAttendance === '12 Jul'\n                ? [\n                    {\n                      time: '08:15',\n                      title: 'Absence published',\n                      detail: 'Main Campus attendance ledger',\n                      status: 'Published',\n                    },\n                    {\n                      time: '09:30',\n                      title: 'Explanation submitted',\n                      detail: props.student\n                        ? 'Your family submitted an explanation.'\n                        : 'Family explanation received and preserved.',\n                      status: 'Submitted',\n                    },\n                    {\n                      time: '10:00',\n                      title: 'School reviewing',\n                      detail: 'Assigned to attendance officer',\n                      status: 'In review',\n                    },\n                    {\n                      time: 'Next',\n                      title: 'Decision',\n                      detail: 'The published outcome will appear here.',\n                      status: 'Pending',\n                    },\n                  ]\n                : [\n                    {\n                      time: '08:10',\n                      title: 'Original attendance published',\n                      detail: 'Late · original publication retained',\n                      status: 'Historical',\n                    },\n                    {\n                      time: '09:05',\n                      title: 'Office correction recorded',\n                      detail: 'Evidence reviewed by attendance office',\n                      status: 'Revised',\n                    },\n                    {\n                      time: '09:07',\n                      title: 'Present republished',\n                      detail: 'Current published state · prior version preserved',\n                      status: 'Current',\n                    },\n                  ]\n            }\n          />\n        </Pane>'''
          if old_pane not in text:
            raise SystemExit('Published attendance detail pane marker missing')
          text = text.replace(old_pane, new_pane, 1)
          source.write_text(text)

          unit = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          unit_text = unit.read_text()
          if 'renders published attendance record selectors' in unit_text:
            raise SystemExit('Attendance selector unit regression already exists')
          insertion = '''\n\n  it.each([\n    ['/family/attendance', 'guardian'],\n    ['/student/attendance', 'student'],\n  ] as const)('renders published attendance record selectors on %s', (path, role) => {\n    const markup = renderRoute(path, role);\n\n    expect(markup).toContain('View 14 July revision history');\n    expect(markup).toContain('Track 12 July explanation');\n    expect(markup).toContain('12 July absence');\n    expect(markup).toContain('disabled=""');\n  });'''
          closing = unit_text.rfind('\n});')
          if closing < 0:
            raise SystemExit('Unit test describe closing marker missing')
          unit.write_text(unit_text[:closing] + insertion + unit_text[closing:])

          browser = Path('tests/browser/platform-shell.spec.ts')
          browser_text = browser.read_text()
          if 'switches published attendance history in place' in browser_text:
            raise SystemExit('Attendance selector browser regression already exists')
          browser_text += '''\n\ntest('switches published attendance history in place', async ({ page }) => {\n  await page.goto('/family/attendance');\n  await expect(page.getByRole('heading', { name: '12 July absence' })).toBeVisible();\n  await page.getByRole('button', { name: 'View 14 July revision history' }).click();\n  await expect(page.getByRole('heading', { name: '14 July revision history' })).toBeVisible();\n  await expect(page.getByText('Original attendance published')).toBeVisible();\n  await page.getByRole('button', { name: 'Track 12 July explanation' }).click();\n  await expect(page.getByRole('heading', { name: '12 July absence' })).toBeVisible();\n});\n'''
          browser.write_text(browser_text)
          PY
      - run: npx prettier --write apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx tests/browser/platform-shell.spec.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run build
      - run: npm run check:experience-budget
      - name: Commit verified slice and remove helper
        run: |
          rm .github/workflows/pr98-attendance-record-selection.yml
          rm -f .github/pr98-attendance-record-selection-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx tests/browser/platform-shell.spec.ts .github/workflows/pr98-attendance-record-selection.yml .github/pr98-attendance-record-selection-trigger.txt
          git commit -m 'feat(ux): make published attendance history selectable'
          git push origin HEAD:ux/operational-school-erp-v1
