name: one-shot fix conversion replay order

on:
  push:
    branches:
      - codex/admissions-accept-convert-20260810

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-accept-convert-20260810
          fetch-depth: 0
      - name: Match canonical replay ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('infra/database/post-integration-migrations/202608100101_PILOT-15_admissions_accept_convert_commands.sql')
          text = path.read_text()
          replay_anchor = "  SELECT\n    conversion.conversion_id,\n    conversion.student_profile_id,\n    conversion.enrollment_id,\n"
          global_check = "  IF EXISTS (\n    SELECT 1\n    FROM admissions.applicant_conversion AS conversion\n    WHERE conversion.tenant_id = session_context.tenant_id\n      AND conversion.idempotency_key = p_idempotency_key\n      AND conversion.application_id <> p_application_id\n  ) THEN\n    RETURN jsonb_build_object('accepted', false, 'reason', 'idempotency-conflict');\n  END IF;\n\n"
          if text.count(replay_anchor) != 1:
              raise SystemExit(f'replay anchor mismatch: {text.count(replay_anchor)}')
          if text.count(global_check) != 1:
              raise SystemExit(f'global check mismatch: {text.count(global_check)}')
          text = text.replace(global_check, '', 1)
          text = text.replace(replay_anchor, global_check + replay_anchor, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit replay ordering
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add infra/database/post-integration-migrations/202608100101_PILOT-15_admissions_accept_convert_commands.sql
          git commit -m 'fix(admissions): enforce tenant-global conversion replay ordering'
          git push origin HEAD:codex/admissions-accept-convert-20260810
