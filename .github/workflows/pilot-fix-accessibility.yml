name: Fix PILOT-01 Accessibility

on:
  push:
    branches:
      - pilot/runtime-portal-composition

permissions:
  contents: write

concurrency:
  group: pilot-runtime-accessibility-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/runtime-portal-composition
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm ci

      - name: Add landing accessibility semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('apps/platform-web/src/main.tsx')
          text = main.read_text(encoding='utf-8')
          text = text.replace(
              '<div className="pilot-entry">\n      <header',
              '<div className="pilot-entry">\n      <a className="pilot-skip-link" href="#main-content">Skip to main content</a>\n      <header',
              1,
          )
          text = text.replace(
              '<main className="pilot-entry__main">',
              '<main id="main-content" className="pilot-entry__main">',
              1,
          )
          text = text.replace(
              '<div className="pilot-role-grid">',
              '<nav className="pilot-role-grid" aria-label="Primary navigation">',
              1,
          )
          text = text.replace(
              '              <strong>Open student portal</strong>\n            </a>\n          </div>\n        </section>',
              '              <strong>Open student portal</strong>\n            </a>\n          </nav>\n        </section>',
              1,
          )
          main.write_text(text, encoding='utf-8')

          css = Path('apps/platform-web/src/pilot.css')
          css_text = css.read_text(encoding='utf-8')
          addition = """

          .pilot-skip-link {
            position: absolute;
            z-index: 20;
            inset-block-start: -5rem;
            inset-inline-start: 1rem;
            padding: 0.75rem 1rem;
            color: white;
            font-weight: 800;
            border-radius: 0.5rem;
            background: #0b63ce;
          }

          .pilot-skip-link:focus {
            inset-block-start: 1rem;
          }

          .pilot-loading {
            min-height: 100vh;
            display: grid;
            align-content: center;
            gap: 0.4rem;
            padding: clamp(1.5rem, 7vw, 7rem);
            background: #f3f7f9;
          }

          .pilot-loading p {
            margin: 0;
            color: #0f766e;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
          }

          .pilot-loading h1 {
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 500;
          }
          """
          if '.pilot-skip-link {' not in css_text:
              css_text += addition
          css.write_text(css_text, encoding='utf-8')
          PY

      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck

      - name: Commit accessibility fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/main.tsx apps/platform-web/src/pilot.css tests/browser
          git commit -m 'fix(pilot): preserve landing accessibility contract'
          git push origin HEAD:pilot/runtime-portal-composition
