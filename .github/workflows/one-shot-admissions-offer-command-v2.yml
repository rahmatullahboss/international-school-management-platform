name: one-shot admissions offer command v2

on:
  push:
    branches:
      - codex/admissions-offer-enrolment-commands-20260809

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-offer-enrolment-commands-20260809
          fetch-depth: 0
      - name: Extract and run corrected patch block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-admissions-offer-command.yml').read_text().splitlines()
          start = None
          end = None
          for index, line in enumerate(workflow):
              if line.strip() == '- name: Apply guarded server-owned offer command patch':
                  for cursor in range(index + 1, len(workflow)):
                      if workflow[cursor].strip() == 'run: |':
                          start = cursor + 1
                          break
              if start is not None and index > start and line.strip() == '- name: Commit patch':
                  end = index
                  break
          if start is None or end is None:
              raise SystemExit('original helper patch block not found')
          block = []
          for line in workflow[start:end]:
              if line.startswith('          '):
                  block.append(line[10:])
              elif line.strip() == '':
                  block.append('')
              else:
                  raise SystemExit(f'unexpected helper indentation: {line!r}')
          script = '\n'.join(block) + '\n'
          old = "replace_once('tests/integration/verify-auth-durable-context.sh',\n    \"'PILOT-12', 'PILOT-13'\",\n    \"'PILOT-12', 'PILOT-13', 'PILOT-14'\")"
          new = "verifier_path = Path('tests/integration/verify-auth-durable-context.sh')\nverifier_text = verifier_path.read_text()\nstream_tail = \"'PILOT-12', 'PILOT-13'\"\nif verifier_text.count(stream_tail) != 3:\n    raise SystemExit(f'verifier: expected three stream-list tails, found {verifier_text.count(stream_tail)}')\nverifier_path.write_text(verifier_text.replace(stream_tail, \"'PILOT-12', 'PILOT-13', 'PILOT-14'\"))"
          if script.count(old) != 1:
              raise SystemExit(f'expected one stream-tail patch block, found {script.count(old)}')
          Path('/tmp/apply-admissions-offer.sh').write_text(script.replace(old, new, 1))
          PY
          bash /tmp/apply-admissions-offer.sh
      - name: Commit product patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            infra/database/post-integration-migration-manifest.json \
            infra/database/post-integration-migrations/202608090901_PILOT-14_admissions_offer_command.sql \
            tests/integration/verify-auth-durable-context.sh \
            apps/platform-api/src/operator-domain-commands.ts \
            apps/platform-api/src/database-operator-domain-command-store.ts \
            apps/platform-api/src/production-operator-command-api.ts \
            apps/platform-api/src/operator-domain-commands.test.ts \
            apps/platform-api/src/database-operator-domain-command-store.test.ts \
            apps/platform-api/src/production-operator-command-api.test.ts
          git commit -m 'feat(admissions): add server-owned offer issuance command'
          git push origin HEAD:codex/admissions-offer-enrolment-commands-20260809
