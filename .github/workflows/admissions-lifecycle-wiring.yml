name: Admissions lifecycle wiring

on:
  push:
    branches:
      - codex/admissions-operational-lifecycle-ui-20260810

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-operational-lifecycle-ui-20260810
      - name: Apply focused wiring
        run: |
          python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit focused wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-api/src/database-operator-domain-command-store.ts apps/platform-api/src/database-operator-domain-command-store.test.ts apps/platform-web/src/production-operator-portal.tsx tests/integration/verify-auth-durable-context.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(admissions): wire production lifecycle UI"
          git push origin HEAD:codex/admissions-operational-lifecycle-ui-20260810
