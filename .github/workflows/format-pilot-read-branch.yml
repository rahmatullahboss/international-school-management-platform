name: Format Pilot Read Branch

on:
  push:
    branches:
      - pilot/permission-aware-read-api-v1

permissions:
  contents: write

concurrency:
  group: pilot-read-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/permission-aware-read-api-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      - name: Apply exact source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/browser/pilot-portals.spec.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import { expect, test } from '@playwright/test';",
              "import { expect, test, type Page } from '@playwright/test';",
          )
          text = text.replace(
              "async function configurePilotApi(page: Parameters<typeof test>[0] extends never ? never : any): Promise<void> {",
              "async function configurePilotApi(page: Page): Promise<void> {",
          )
          path.write_text(text, encoding='utf-8')
          PY

      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck

      - name: Commit canonical scoped-read source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(pilot): format scoped read implementation'
          git push origin HEAD:pilot/permission-aware-read-api-v1
