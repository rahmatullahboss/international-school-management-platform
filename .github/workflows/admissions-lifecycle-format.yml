name: Admissions lifecycle format

on:
  push:
    branches:
      - codex/admissions-operational-lifecycle-ui-20260810

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-operational-lifecycle-ui-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/platform-api/src/database-operator-work-queue-store.ts apps/platform-api/src/production-operator-work-queue-api.test.ts apps/platform-web/src/production-admissions-lifecycle.tsx apps/platform-web/src/production-operator-work-queue.test.ts apps/platform-web/src/production-operator-work-queue.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-api/src/database-operator-work-queue-store.ts apps/platform-api/src/production-operator-work-queue-api.test.ts apps/platform-web/src/production-admissions-lifecycle.tsx apps/platform-web/src/production-operator-work-queue.test.ts apps/platform-web/src/production-operator-work-queue.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(admissions): format lifecycle slice"
          git push origin HEAD:codex/admissions-operational-lifecycle-ui-20260810
