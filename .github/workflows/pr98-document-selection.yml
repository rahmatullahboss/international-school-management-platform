name: PR98 document selection

on:
  push:
    branches:
      - ux/operational-school-erp-v1

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/operational-school-erp-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Wire authorised document selection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = source.read_text()

          old_start = '''function DocumentsWorkspace(props: { readonly student: boolean }): ReactElement {\n  return ('''
          new_start = '''function DocumentsWorkspace(props: { readonly student: boolean }): ReactElement {\n  type AuthorisedDocument =\n    | 'Term 2 progress report'\n    | 'School welcome letter'\n    | 'Enrolment confirmation'\n    | 'Term 1 report';\n  const [selectedDocument, setSelectedDocument] = useState<AuthorisedDocument>(\n    'Term 2 progress report',\n  );\n  const selectedDocumentDetail =\n    selectedDocument === 'Term 2 progress report'\n      ? {\n          category: 'Report card',\n          published: '28 July · 15:00',\n          version: 'v2.1',\n          file: 'PDF · 1.2 MB',\n          publisher: 'Admin Office',\n          history: [\n            {\n              time: 'v2.0',\n              title: 'Draft approved',\n              detail: 'Internal publication state',\n              status: 'Historical',\n            },\n            {\n              time: 'v2.1',\n              title: 'Final publication',\n              detail: 'Published 28 July',\n              status: 'Current',\n            },\n          ] as const,\n        }\n      : selectedDocument === 'School welcome letter'\n        ? {\n            category: 'Letter',\n            published: '1 August · 09:00',\n            version: 'v1.0',\n            file: 'PDF · 340 KB',\n            publisher: 'Admin Office',\n            history: [\n              {\n                time: 'v1.0',\n                title: 'Welcome letter published',\n                detail: 'Current authorised household copy',\n                status: 'Current',\n              },\n            ] as const,\n          }\n        : selectedDocument === 'Enrolment confirmation'\n          ? {\n              category: 'Record',\n              published: '10 September 2021 · 12:00',\n              version: 'v3.0',\n              file: 'PDF · 620 KB',\n              publisher: 'Admissions Office',\n              history: [\n                {\n                  time: 'v2.0',\n                  title: 'Prior confirmation',\n                  detail: 'Superseded version retained',\n                  status: 'Historical',\n                },\n                {\n                  time: 'v3.0',\n                  title: 'Current confirmation',\n                  detail: 'Current authorised revision',\n                  status: 'Current',\n                },\n              ] as const,\n            }\n          : {\n              category: 'Report',\n              published: '12 April · 16:00',\n              version: 'v1.4',\n              file: 'PDF · 1.0 MB · cached',\n              publisher: 'Admin Office',\n              history: [\n                {\n                  time: 'v1.4',\n                  title: 'Cached authorised copy',\n                  detail: 'Offline snapshot of the published record',\n                  status: 'Cached',\n                },\n              ] as const,\n            };\n\n  return ('''
          if old_start not in text:
            raise SystemExit('DocumentsWorkspace function marker missing')
          text = text.replace(old_start, new_start, 1)

          start = text.index('function DocumentsWorkspace')
          end = text.index('function StudentTimetable')
          before, section, after = text[:start], text[start:end], text[end:]

          replacements = [
            ("                'Open authorised copy',", '''                <button\n                  aria-label="Select Term 2 progress report"\n                  aria-pressed={selectedDocument === 'Term 2 progress report'}\n                  key="a"\n                  onClick={() => setSelectedDocument('Term 2 progress report')}\n                  type="button"\n                >\n                  View details\n                </button>,'''),
            ("                'Open',", '''                <button\n                  aria-label="Select School welcome letter"\n                  aria-pressed={selectedDocument === 'School welcome letter'}\n                  key="a"\n                  onClick={() => setSelectedDocument('School welcome letter')}\n                  type="button"\n                >\n                  View details\n                </button>,'''),
            ("                'View current version',", '''                <button\n                  aria-label="Select Enrolment confirmation"\n                  aria-pressed={selectedDocument === 'Enrolment confirmation'}\n                  key="a"\n                  onClick={() => setSelectedDocument('Enrolment confirmation')}\n                  type="button"\n                >\n                  View current version\n                </button>,'''),
            ("                'Open cached copy',", '''                <button\n                  aria-label="Select Term 1 report"\n                  aria-pressed={selectedDocument === 'Term 1 report'}\n                  key="a"\n                  onClick={() => setSelectedDocument('Term 1 report')}\n                  type="button"\n                >\n                  View cached details\n                </button>,'''),
            ("                'Retry',", '                <PilotUnavailableAction key="a">Retry</PilotUnavailableAction>,'),
          ]
          for old, new in replacements:
            if section.count(old) != 1:
              raise SystemExit(f'Expected one document action marker for {old!r}, found {section.count(old)}')
            section = section.replace(old, new, 1)

          old_detail = '''        <Pane title="Term 2 progress report" description="Selected authorised document metadata.">\n          <DefinitionList\n            label="Document metadata"\n            items={[\n              { term: 'Category', value: 'Report card' },\n              { term: 'Published', value: '28 July · 15:00' },\n              { term: 'Version', value: 'v2.1' },\n              { term: 'File', value: 'PDF · 1.2 MB' },\n              { term: 'Publisher', value: 'Admin Office' },\n              {\n                term: 'Authorisation',\n                value: props.student ? 'Samira Noor only' : 'Primary guardian only',\n              },\n            ]}\n          />\n          <Timeline\n            label="Document version history"\n            items={[\n              {\n                time: 'v2.0',\n                title: 'Draft approved',\n                detail: 'Internal publication state',\n                status: 'Historical',\n              },\n              {\n                time: 'v2.1',\n                title: 'Final publication',\n                detail: 'Published 28 July',\n                status: 'Current',\n              },\n            ]}\n          />'''
          new_detail = '''        <Pane title={selectedDocument} description="Selected authorised document metadata.">\n          <DefinitionList\n            label="Document metadata"\n            items={[\n              { term: 'Category', value: selectedDocumentDetail.category },\n              { term: 'Published', value: selectedDocumentDetail.published },\n              { term: 'Version', value: selectedDocumentDetail.version },\n              { term: 'File', value: selectedDocumentDetail.file },\n              { term: 'Publisher', value: selectedDocumentDetail.publisher },\n              {\n                term: 'Authorisation',\n                value: props.student\n                  ? 'Samira Noor only'\n                  : selectedDocument === 'School welcome letter'\n                    ? 'Verified household only'\n                    : 'Primary guardian only',\n              },\n            ]}\n          />\n          <Timeline label="Document version history" items={selectedDocumentDetail.history} />'''
          if old_detail not in section:
            raise SystemExit('DocumentsWorkspace detail pane marker missing')
          section = section.replace(old_detail, new_detail, 1)
          text = before + section + after
          source.write_text(text)

          unit = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          unit_text = unit.read_text()
          if 'renders authorised document selectors' in unit_text:
            raise SystemExit('Document selector unit regression already exists')
          insertion = '''\n\n  it.each([\n    ['/family/documents', 'guardian'],\n    ['/student/documents', 'student'],\n  ] as const)('renders authorised document selectors on %s', (path, role) => {\n    const markup = renderRoute(path, role);\n\n    expect(markup).toContain('Select Term 2 progress report');\n    expect(markup).toContain('Select School welcome letter');\n    expect(markup).toContain('Select Enrolment confirmation');\n    expect(markup).toContain('Select Term 1 report');\n    expect(markup).toContain('Not available in this scope');\n    expect(markup).toContain('Retry');\n    expect(markup).toContain('disabled=""');\n  });'''
          closing = unit_text.rfind('\n});')
          if closing < 0:
            raise SystemExit('Unit test describe closing marker missing')
          unit.write_text(unit_text[:closing] + insertion + unit_text[closing:])

          browser = Path('tests/browser/platform-shell.spec.ts')
          browser_text = browser.read_text()
          if 'switches authorised document metadata in place' in browser_text:
            raise SystemExit('Document selector browser regression already exists')
          browser_text += '''\n\ntest('switches authorised document metadata in place', async ({ page }) => {\n  await page.goto('/family/documents');\n  await expect(page.getByRole('heading', { name: 'Term 2 progress report' })).toBeVisible();\n  await page.getByRole('button', { name: 'Select School welcome letter' }).click();\n  await expect(page.getByRole('heading', { name: 'School welcome letter' })).toBeVisible();\n  await expect(page.getByText('PDF · 340 KB')).toBeVisible();\n  await page.getByRole('button', { name: 'Select Enrolment confirmation' }).click();\n  await expect(page.getByRole('heading', { name: 'Enrolment confirmation' })).toBeVisible();\n  await expect(page.getByText('Admissions Office')).toBeVisible();\n  await expect(page.getByRole('button', { name: 'Open authorised copy' })).toBeDisabled();\n  await expect(page.getByRole('button', { name: 'Download authorised copy' })).toBeDisabled();\n});\n'''
          browser.write_text(browser_text)
          PY
      - run: npx prettier --write apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx tests/browser/platform-shell.spec.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run build
      - run: npm run check:experience-budget
      - name: Commit verified slice and remove helper
        run: |
          rm .github/workflows/pr98-document-selection.yml
          rm -f .github/pr98-document-selection-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx tests/browser/platform-shell.spec.ts .github/workflows/pr98-document-selection.yml .github/pr98-document-selection-trigger.txt
          git commit -m 'feat(ux): make authorised document register selectable'
          git push origin HEAD:ux/operational-school-erp-v1
