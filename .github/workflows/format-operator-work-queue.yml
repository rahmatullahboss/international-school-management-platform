name: Format Operator Work Queue

on:
  push:
    branches:
      - prod/operator-work-queue

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/operator-work-queue
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply canonical formatting
        run: |
          npx prettier --write \
            apps/platform-api/src/database-operator-work-queue-store.ts \
            apps/platform-api/src/entry.ts \
            apps/platform-api/src/production-operator-work-queue-api.test.ts \
            apps/platform-web/src/production-operator-portal.tsx \
            apps/platform-web/src/production-operator-work-queue.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/platform-api/src/database-operator-work-queue-store.ts \
            apps/platform-api/src/entry.ts \
            apps/platform-api/src/production-operator-work-queue-api.test.ts \
            apps/platform-web/src/production-operator-portal.tsx \
            apps/platform-web/src/production-operator-work-queue.test.ts
          git commit -m 'style(prod): format operator work queue'
          git push origin HEAD:prod/operator-work-queue
