name: Format Production Candidate

on:
  push:
    branches:
      - prod/demo-school-production-readiness

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/demo-school-production-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply canonical formatting
        run: |
          npx prettier --write \
            apps/platform-api/src/auth-login-routes.ts \
            apps/platform-api/src/database-workspace-store.ts \
            apps/platform-api/src/database-workspace-store.test.ts \
            apps/platform-api/src/production-boundary.test.ts \
            apps/platform-web/src/pilot-resource.ts \
            apps/platform-web/src/production-gateway.tsx \
            apps/platform-web/src/production-operator-portal.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/platform-api/src/auth-login-routes.ts \
            apps/platform-api/src/database-workspace-store.ts \
            apps/platform-api/src/database-workspace-store.test.ts \
            apps/platform-api/src/production-boundary.test.ts \
            apps/platform-web/src/pilot-resource.ts \
            apps/platform-web/src/production-gateway.tsx \
            apps/platform-web/src/production-operator-portal.tsx
          git commit -m 'style(prod): apply canonical formatting'
          git push origin HEAD:prod/demo-school-production-readiness
