name: Format Operator Portal

on:
  push:
    branches:
      - prod/operator-domain-writes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/operator-domain-writes
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/platform-web/src/production-operator-portal.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/production-operator-portal.tsx
          git commit -m 'style(prod): format operator portal guards'
          git push origin HEAD:prod/operator-domain-writes
