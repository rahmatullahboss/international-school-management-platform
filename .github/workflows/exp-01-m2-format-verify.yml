name: EXP-01 Milestone 2 Formatter

on:
  push:
    branches:
      - module/exp-01-m2-ci-fix
    paths:
      - .github/workflows/exp-01-m2-format-verify.yml

permissions:
  contents: write

concurrency:
  group: exp-01-m2-formatter
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/exp-01-m2-ci-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Apply canonical formatter output
        run: |
          npx prettier --write \
            apps/web-admin/src/features/experience/AdminOperationsHome.tsx \
            tests/experience/admin-workflows.test.tsx
      - name: Commit formatting and remove one-shot workflow
        run: |
          git rm .github/workflows/exp-01-m2-format-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web-admin/src/features/experience/AdminOperationsHome.tsx \
            tests/experience/admin-workflows.test.tsx
          git commit -m "style(EXP-01): format administration milestone"
          git push origin HEAD:module/exp-01-m2-ci-fix
