name: One-shot guardian budget report

on:
  pull_request:
    branches: [main]

jobs:
  report:
    if: github.event.pull_request.head.ref == 'codex/guardian-core-route-workflows-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Print experience bundle budget only
        shell: bash
        run: |
          set -euo pipefail
          npm ci --silent >/dev/null 2>&1
          npm run build --workspace=@school/platform-web >/dev/null 2>&1
          node scripts/check-experience-build-budget.mjs || true
