name: One-shot nanoid lock repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'codex/student-documents-messages-workflows-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Generate guarded lock-only security fix
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          npm ci
          npm audit fix --package-lock-only
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const before = JSON.parse(fs.readFileSync('/tmp/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const key = 'node_modules/nanoid';
          const beforeNanoid = before.packages[key];
          const afterNanoid = after.packages[key];

          assert.equal(beforeNanoid?.version, '3.3.16');
          assert.equal(afterNanoid?.version, '3.3.18');
          assert.equal(afterNanoid?.resolved, 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz');
          assert.match(afterNanoid?.integrity ?? '', /^sha512-/);

          delete before.packages[key];
          delete after.packages[key];
          assert.deepEqual(after, before, 'npm audit fix changed more than the nanoid lock entry');
          NODE

      - name: Commit guarded lock repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): update nanoid security patch'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
