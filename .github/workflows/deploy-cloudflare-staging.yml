name: Deploy Cloudflare Staging

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify-deploy-smoke:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'deploy/cloudflare-staging-pilot' || github.head_ref == 'pilot/runtime-portal-composition' || github.head_ref == 'ux/smooth-operational-experience-v1' || github.head_ref == 'pilot/permission-aware-read-api-v1' || github.head_ref == 'pilot/signed-session-context-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Require staging credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Cloudflare staging requires CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the cloudflare-staging GitHub environment." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

      - name: Deploy staging API Worker
        shell: bash
        run: |
          set -euo pipefail
          secret_file=$(mktemp)
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          printf 'PILOT_SESSION_SECRET=%s\n' "$(openssl rand -hex 32)" > "$secret_file"
          npx wrangler deploy --config apps/platform-api/wrangler.jsonc --env staging --secrets-file "$secret_file" 2>&1 | tee api-deploy.log
          api_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' api-deploy.log | tail -1)
          if [[ -z "$api_url" ]]; then
            echo "Unable to resolve the deployed API URL from Wrangler output." >&2
            exit 1
          fi
          echo "API_URL=$api_url" >> "$GITHUB_ENV"

      - name: Build and deploy staging web Worker
        shell: bash
        run: |
          set -o pipefail
          VITE_PLATFORM_API_URL="$API_URL" npm run build --workspace=@school/platform-web
          npx wrangler deploy --config apps/platform-web/wrangler.jsonc --env staging 2>&1 | tee web-deploy.log
          web_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' web-deploy.log | tail -1)
          if [[ -z "$web_url" ]]; then
            echo "Unable to resolve the deployed web URL from Wrangler output." >&2
            exit 1
          fi
          echo "WEB_URL=$web_url" >> "$GITHUB_ENV"

      - name: Smoke test live staging services
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            local label="$3"
            shift 3
            for attempt in {1..12}; do
              if curl --location --fail --silent --show-error "$@" "$url" --output "$output"; then
                return 0
              fi
              if [[ "$attempt" == "12" ]]; then
                echo "$label did not become ready: $url" >&2
                return 1
              fi
              sleep 5
            done
          }

          staging_origin='https://international-school-platform-web-staging.rahmatullahzisan.workers.dev'
          fetch_with_retry "$API_URL/health" api-health.json "API health endpoint"
          fetch_with_retry "$API_URL/pilot/v1/sessions/admin" admin-session.json "Signed admin session" \
            --request POST \
            -H "Origin: $staging_origin"
          admin_token=$(python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('admin-session.json').read_text(encoding='utf-8'))
          token = payload.get('accessToken')
          assert isinstance(token, str) and len(token) > 32, payload
          print(token)
          PY
          )
          fetch_with_retry "$API_URL/pilot/v1/snapshots/admin" admin-snapshot.json "Signed scoped admin snapshot" \
            -H "Origin: $staging_origin" \
            -H "Authorization: Bearer $admin_token"
          fetch_with_retry "$WEB_URL/" web-index.html "Pilot role chooser"
          fetch_with_retry "$WEB_URL/admin" web-admin.html "Admin portal"
          fetch_with_retry "$WEB_URL/teacher" web-teacher.html "Teacher portal"
          fetch_with_retry "$WEB_URL/family" web-family.html "Guardian portal"
          fetch_with_retry "$WEB_URL/student" web-student.html "Student portal"
          fetch_with_retry "$WEB_URL/manifest.webmanifest" web-manifest.json "PWA manifest"
          fetch_with_retry "$WEB_URL/offline.html" web-offline.html "Offline page"

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('api-health.json').read_text(encoding='utf-8'))
          assert payload.get('status') == 'ok', payload
          assert payload.get('environment') == 'staging', payload

          session = json.loads(Path('admin-session.json').read_text(encoding='utf-8'))
          assert session.get('schemaVersion') == 1, session
          assert session.get('tokenType') == 'Bearer', session
          assert session.get('scope', {}).get('tenantId') == 'tenant-pilot-001', session
          assert session.get('scope', {}).get('campusId') == 'campus-main', session
          assert session.get('scope', {}).get('role') == 'admin', session
          assert session.get('scope', {}).get('subjectId') == 'principal-1', session

          snapshot = json.loads(Path('admin-snapshot.json').read_text(encoding='utf-8'))
          assert snapshot.get('schemaVersion') == 1, snapshot
          assert snapshot.get('scope', {}).get('tenantId') == 'tenant-pilot-001', snapshot
          assert snapshot.get('scope', {}).get('campusId') == 'campus-main', snapshot
          assert snapshot.get('scope', {}).get('role') == 'admin', snapshot
          assert snapshot.get('scope', {}).get('subjectId') == 'principal-1', snapshot
          assert 'finance.read' in snapshot.get('scope', {}).get('capabilities', []), snapshot
          assert snapshot.get('data', {}).get('metrics'), snapshot

          index_text = Path('web-index.html').read_text(encoding='utf-8')
          assert 'International School Platform' in index_text, index_text[:500]
          assert 'School Platform' in Path('web-manifest.json').read_text(encoding='utf-8')
          assert 'You are offline' in Path('web-offline.html').read_text(encoding='utf-8')

          for file_name in ['web-admin.html', 'web-teacher.html', 'web-family.html', 'web-student.html']:
              text = Path(file_name).read_text(encoding='utf-8')
              assert 'International School Platform' in text, (file_name, text[:500])
          PY

      - name: Publish staging URLs
        shell: bash
        run: |
          {
            echo '## Cloudflare staging deployment'
            echo
            echo "- Role chooser: $WEB_URL/"
            echo "- Admin: $WEB_URL/admin"
            echo "- Teacher: $WEB_URL/teacher"
            echo "- Guardian: $WEB_URL/family"
            echo "- Student: $WEB_URL/student"
            echo "- API health: $API_URL/health"
            echo "- Signed pilot session: $API_URL/pilot/v1/sessions/admin"
            echo "- Signed scoped admin snapshot: $API_URL/pilot/v1/snapshots/admin"
            echo '- Scope: ephemeral HMAC-signed synthetic sessions bind tenant, campus, role and subject before private ETag-revalidated snapshots; production identity and mutations remain disabled.'
          } >> "$GITHUB_STEP_SUMMARY"
