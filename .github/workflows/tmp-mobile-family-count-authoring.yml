name: Temporary mobile family count-copy authoring

on:
  push:
    branches:
      - 'mobile/family-count-copy-adoption-v1'

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/family-count-copy-adoption-v1
      - name: Apply guarded patch
        run: python3 scripts/apply_family_count_copy.py
      - name: Remove temporary authoring helpers
        run: |
          rm scripts/apply_family_count_copy.py
          rm .github/workflows/tmp-mobile-family-count-authoring.yml
      - name: Commit authored checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/apps/family_app/lib/main.dart mobile/apps/family_app/lib/family_interaction_screens.dart scripts/apply_family_count_copy.py .github/workflows/tmp-mobile-family-count-authoring.yml
          git diff --cached --check
          git commit -m "feat(mobile): adopt localized counts in Family production journeys"
          git push origin HEAD:mobile/family-count-copy-adoption-v1
