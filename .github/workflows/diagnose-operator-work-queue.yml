name: Diagnose Operator Work Queue

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci >/dev/null
      - name: Verify Wave 2 baseline
        run: npm run verify:migrations
      - name: Verify AUTH baseline
        run: npm run verify:auth-migrations
      - name: Verify persona baseline
        run: npm run verify:persona-e2e
      - name: Apply production hardening baseline
        run: bash tests/integration/verify-production-runtime.sh
      - name: Prepare operator queue fixtures
        run: |
          awk 'BEGIN { copy = 0 } /^INSERT INTO tenancy\.campus \($/ { copy = 1 } copy && $0 == "SQL" { exit } copy { print }' \
            tests/integration/verify-production-operator-work-queue.sh \
            | psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE"
      - name: Verify Admissions queue
        run: |
          actual="$(psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -AtF '|' -c "SET ROLE app_runtime; WITH q AS (SELECT platform.resolve_operator_work_queue('95100000-0000-4000-8000-000000000008'::uuid) AS value) SELECT value->>'role', jsonb_array_length(value->'items'), value->'items'->0->>'applicationId', value->'items'->0->>'applicationNumber', value->'items'->0->>'version' FROM q;")"
          echo "Admissions queue: $actual"
          test "$actual" = "admissions|1|95100000-0000-4000-8000-000000000203|APP-PROD-QUEUE-001|1"
      - name: Verify Finance queue
        run: |
          actual="$(psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -AtF '|' -c "SET ROLE app_runtime; WITH q AS (SELECT platform.resolve_operator_work_queue('95200000-0000-4000-8000-000000000008'::uuid) AS value) SELECT value->>'role', jsonb_array_length(value->'items'), value->'items'->0->>'bankStatementLineId', value->'items'->0->>'paymentId', value->'items'->0->>'amountMinor', jsonb_typeof(value->'items'->0->'amountMinor') FROM q;")"
          echo "Finance queue: $actual"
          test "$actual" = "finance|1|95200000-0000-4000-8000-000000000113|95200000-0000-4000-8000-000000000112|1500000|string"
      - name: Verify revocation
        run: |
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -Atqc "SELECT iam.revoke_browser_session('95100000-0000-4000-8000-000000000008'::uuid, 'operator work queue verification complete')" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -Atqc "SELECT iam.revoke_browser_session('95200000-0000-4000-8000-000000000008'::uuid, 'operator work queue verification complete')" >/dev/null
          actual="$(psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -Atqc "SET ROLE app_runtime; SELECT COALESCE(platform.resolve_operator_work_queue('95100000-0000-4000-8000-000000000008'::uuid)::text, 'null');")"
          echo "Revoked queue: $actual"
          test "$actual" = "null"
