name: Diagnose Operator Work Queue

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci >/dev/null
      - name: Verify Wave 2 baseline
        run: npm run verify:migrations
      - name: Verify AUTH baseline
        run: npm run verify:auth-migrations
      - name: Verify persona baseline
        run: npm run verify:persona-e2e
      - name: Apply production hardening baseline
        run: bash -x tests/integration/verify-production-runtime.sh
      - name: Diagnose operator work queues
        run: bash -x tests/integration/verify-production-operator-work-queue.sh
