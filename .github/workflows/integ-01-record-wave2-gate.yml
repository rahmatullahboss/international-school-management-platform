name: INTEG-01 Record Wave 2 Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integ-01-record-wave2-gate.yml

permissions:
  contents: write

jobs:
  record:
    if: github.head_ref == 'integration/international-school-platform-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/international-school-platform-v1
      - name: Record reviewed Wave 2 integration evidence
        run: |
          python3 <<'PY'
          from pathlib import Path

          candidate = '60836a8fe92f64ba581c4bde65005729d1fe14b2'
          tracker_path = Path('docs/execution/04-progress-tracker.md')
          tracker = tracker_path.read_text(encoding='utf-8')
          replacements = {
              "**Current repository state:** Wave 2 module implementation and review are complete. Reviewed candidates are `ACAD-01` `1d895afdf51f6d4f6323ada4b93d9ba32b244480`, `OPS-01` `fc749d7c0ece36964da8f923431bb3b7ac925e56` and `CARE-01` `9304bd6c425eca4ec69db90c1f1cab3f7a409b8d`. `INTEG-01` is ready to perform serial Wave 2 integration; `GATE-WAVE-2-INTEGRATED` remains blocked until migration composition, restricted-record boundaries and recovery rehearsal pass.":
              f"**Current repository state:** Wave 2 serial integration and verification are complete. Reviewed Wave 2 integration SHA is `{candidate}`; `GATE-WAVE-2-INTEGRATED` passed after canonical migration composition, restricted-record boundary journeys, full system verification and disposable Neon recovery replay. `EXP-01` is released to start from that exact reviewed SHA.",
              "| `GATE-WAVE-2-INTEGRATED` | blocked | `ACAD-01`, `OPS-01`, `CARE-01` reviewed and integrated |":
              f"| `GATE-WAVE-2-INTEGRATED` | passed | Reviewed integration SHA `{candidate}`; CI `30437010804`; Neon apply/recovery `30437011092`; 40 canonical migrations; 168 Wave 2 tenant tables protected; academic/attendance, staff/finance, activity-charge and restricted CARE journeys passed |",
              "Current readiness: `ACAD-01`, `OPS-01` and `CARE-01` are complete and reviewed. `INTEG-01` may now consume only the exact frozen Wave 2 SHAs recorded here. `EXP-01` remains blocked until `GATE-WAVE-2-INTEGRATED` passes.":
              f"Current readiness: `GATE-WAVE-2-INTEGRATED` passed at reviewed SHA `{candidate}`. `ACAD-01`, `OPS-01` and `CARE-01` are integrated; `EXP-01` may now start from that exact reviewed base. `INTEG-01` next accepts only a reviewed `EXP-01` SHA for serial Wave 3 integration.",
              "| `ACAD-01` | 2 | complete; reviewed; waiting integration | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `1d895afdf51f6d4f6323ada4b93d9ba32b244480`; PR `#7` green | none |":
              "| `ACAD-01` | 2 | complete; integrated by `INTEG-01` | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `1d895afdf51f6d4f6323ada4b93d9ba32b244480`; integration merge `7a6dee6` | none |",
              "| `OPS-01` | 2 | complete; reviewed; waiting integration | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `fc749d7c0ece36964da8f923431bb3b7ac925e56`; final branch CI `30419451935` green | none |":
              "| `OPS-01` | 2 | complete; integrated by `INTEG-01` | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `fc749d7c0ece36964da8f923431bb3b7ac925e56`; integration merge `51c714c` | none |",
              "| `CARE-01` | 2 | complete; reviewed; waiting integration | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `9304bd6c425eca4ec69db90c1f1cab3f7a409b8d`; draft PR `#19` final-head CI `30427728682` green | integration-owned conflict resolution and fresh disposable recovery rehearsal |":
              "| `CARE-01` | 2 | complete; integrated by `INTEG-01` | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `9304bd6c425eca4ec69db90c1f1cab3f7a409b8d`; integration merge `af8a58d` | none |",
              "| `EXP-01` | 3 | blocked | reviewed Wave 2 integration SHA | persona shells | none | `GATE-WAVE-2-INTEGRATED` |":
              f"| `EXP-01` | 3 | ready | `{candidate}` | persona shells | reviewed Wave 2 base `{candidate}` | none |",
              "| `INTEG-01` | gated serial | ready for Wave 2 integration | integration branch head `ec921ea26f6980017f848bfd6646a77868bd4cb1` | serially integrate reviewed ACAD, OPS and CARE SHAs | reviewed Wave 1 integration `8cc8ee1562ade672b14c1c44af935fe7e2307976` | `GATE-WAVE-2-INTEGRATED` verification pending |":
              f"| `INTEG-01` | gated serial | Wave 2 complete; ready for Wave 3 integration | integration branch from `ec921ea26f6980017f848bfd6646a77868bd4cb1` | integrate reviewed `EXP-01` SHA after completion | reviewed Wave 2 integration `{candidate}` | `EXP-01` completion and review |",
          }
          for old, new in replacements.items():
              if old not in tracker:
                  raise SystemExit(f'missing tracker replacement target: {old[:80]}')
              tracker = tracker.replace(old, new, 1)

          evidence = f"""
### Wave 2 checkpoint — `GATE-WAVE-2-INTEGRATED` passed

Date/time: 2026-07-29T14:53:09+06:00
Stream: INTEG-01
Milestone completed: Wave 2 serial integration, database/recovery verification, system verification and release evidence
Git branch: `integration/international-school-platform-v1`
Worktree: `.worktrees/integ-01-release`
Neon branch: `integration/international-school-platform-v1` (`br-shiny-silence-axznuy37`), parent `main` (`br-cool-wildflower-axsot8l1`)
Starting base: `ec921ea26f6980017f848bfd6646a77868bd4cb1`; reviewed Wave 1 integration `8cc8ee1562ade672b14c1c44af935fe7e2307976`
Accepted reviewed module SHAs: ACAD-01 `1d895afdf51f6d4f6323ada4b93d9ba32b244480`; OPS-01 `fc749d7c0ece36964da8f923431bb3b7ac925e56`; CARE-01 `9304bd6c425eca4ec69db90c1f1cab3f7a409b8d`
Reviewed Wave 2 integration SHA: `{candidate}`
Integration checkpoints: ACAD merge `7a6dee6`; OPS conflict-resolution merge `51c714c`; CARE conflict-resolution merge `af8a58d`; shared TypeScript composition and canonical migration/journey gates retained all reviewed module behavior
Database and recovery evidence: canonical manifest contains 40 migrations in Foundation 5 → SIS 6 → FIN 4 → INT 7 → ACAD 5 → OPS 7 → CARE 6 order; integration Neon apply/recovery run `30437011092` PASS; exact project/branch identity verified; already-applied migrations skipped safely; disposable fresh-database replay PASS; 168 Wave 2 tenant-owned tables verified with forced RLS and required policies; finance journal immutability/balance checks and cross-tenant negative probes PASS
Cross-module evidence: academic roster → duplicate-safe offline attendance; HR employment contract → balanced finance journal; activity enrolment → idempotent finance source document with waitlist no-charge; CARE-C4 unauthorized access masked/denied and exact case-member read immutably audited — all PASS
System evidence: GitHub CI run `30437010804` PASS; format, lint, architecture boundaries, typecheck, 452 tests PASS with one secret-backed local test skipped, fresh PostgreSQL Wave 2 migration suite, live Neon direct test 1/1, deterministic builds, dependency audit, licence/provenance, Chromium browser suite and execution-artifact validation PASS
Security/tenant outcome: no unresolved tenant-isolation, restricted-record authorization, finance, migration, academic-history or recovery invariant failure
Known non-blocking risk: GitHub reports Node.js 20 deprecation for `actions/checkout@v4` and `actions/setup-node@v4`, while runners force those actions onto Node.js 24; all execution passed and routine CI maintenance should upgrade action versions
Safe cleanup outcome: no existing Git branch, worktree or Neon branch was deleted, reset or force-cleaned; all active resources were retained
Gate outcome: `GATE-WAVE-2-INTEGRATED` PASS; exact reviewed base released for `EXP-01` is `{candidate}`
Exact next milestone: execute `EXP-01` from `{candidate}`, then integrate its reviewed SHA through `INTEG-01` Wave 3
Dirty/uncommitted state: release evidence and board/tracker update only
Production mutation performed: no

"""
          marker = '## Resume rule\n'
          if marker not in tracker:
              raise SystemExit('resume marker missing')
          tracker = tracker.replace(marker, evidence + marker, 1)
          tracker_path.write_text(tracker, encoding='utf-8')

          board_path = Path('docs/execution/03-agent-board.json')
          board = board_path.read_text(encoding='utf-8')
          board_replacements = {
              '    "wave_1": "8cc8ee1562ade672b14c1c44af935fe7e2307976"\n  },':
              f'    "wave_1": "8cc8ee1562ade672b14c1c44af935fe7e2307976",\n    "wave_2": "{candidate}"\n  }},',
              '    "wave_1_integration": "8cc8ee1562ade672b14c1c44af935fe7e2307976"\n  },':
              f'    "wave_1_integration": "8cc8ee1562ade672b14c1c44af935fe7e2307976",\n    "wave_2_integration": "{candidate}"\n  }},',
              '"status": "complete_reviewed_waiting_integration"': '"status": "complete_and_integrated"',
              '"status": "blocked_by_wave_2"': '"status": "ready_for_execution"',
              '"status": "ready_for_wave_2_integration"': '"status": "ready_for_wave_3_integration"',
          }
          for old, new in board_replacements.items():
              count = board.count(old)
              expected = 3 if old == '"status": "complete_reviewed_waiting_integration"' else 1
              if count != expected:
                  raise SystemExit(f'unexpected board replacement count {count} for {old}')
              board = board.replace(old, new)
          board_path.write_text(board, encoding='utf-8')
          PY
          python3 -m json.tool docs/execution/03-agent-board.json >/dev/null
          python3 scripts/validate_execution_artifacts.py
      - name: Commit gate evidence and remove one-time workflow
        run: |
          rm .github/workflows/integ-01-record-wave2-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/execution/03-agent-board.json docs/execution/04-progress-tracker.md .github/workflows/integ-01-record-wave2-gate.yml
          git commit -m "docs(INTEG-01): pass Wave 2 integration gate"
          git push origin HEAD:integration/international-school-platform-v1
