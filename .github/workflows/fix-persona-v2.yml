name: Fix persona v2

on:
  pull_request:
    branches:
      - test/full-role-e2e-coverage-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/full-product-persona-e2e-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/full-product-persona-e2e-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Remove unused operator helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/platform-web/src/operator-portal.tsx')
          text = path.read_text()
          old = "function isOperatorRole(value: unknown): value is OperatorRole {\n  return value === 'admissions' || value === 'finance' || value === 'support';\n}\n\n"
          if old not in text:
              raise SystemExit('expected helper not found')
          path.write_text(text.replace(old, '', 1))
          PY
      - run: npm run format
      - name: Commit fix
        run: |
          git add -- . ':(exclude).github/workflows/fix-persona-v2.yml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(web): remove unused operator helper"
          git push origin HEAD:test/full-product-persona-e2e-v2