name: Patch PROD-03 Debug Verifier

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'prod/runtime-credential-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/runtime-credential-boundary
      - name: Patch optional debug helper assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/verify-production-runtime.sh')
          text = path.read_text()
          old = """     OR has_function_privilege('app_production_runtime', 'public.show_db_tree()', 'EXECUTE') THEN\n"""
          new = """     OR (\n       to_regprocedure('public.show_db_tree()') IS NOT NULL\n       AND has_function_privilege(\n         'app_production_runtime',\n         to_regprocedure('public.show_db_tree()'),\n         'EXECUTE'\n       )\n     ) THEN\n"""
          if old not in text:
            raise SystemExit('debug helper assertion marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit verifier patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/verify-production-runtime.sh
          git commit -m 'test(prod): tolerate absent optional debug helper'
          git push origin HEAD:prod/runtime-credential-boundary
