name: INTEG-01 Apply Canonical Formatting

on:
  push:
    branches:
      - integration/international-school-platform-v1
    paths:
      - .github/workflows/integ-01-format-preview.yml
      - tests/integration/wave1-migration-manifest.test.ts
      - tests/integration/wave2-cross-module-journeys.test.ts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/international-school-platform-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Apply canonical Prettier formatting
        run: |
          npx prettier --write \
            tests/integration/wave1-migration-manifest.test.ts \
            tests/integration/wave2-cross-module-journeys.test.ts
      - name: Commit formatting when required
        run: |
          if git diff --quiet -- \
            tests/integration/wave1-migration-manifest.test.ts \
            tests/integration/wave2-cross-module-journeys.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/integration/wave1-migration-manifest.test.ts \
            tests/integration/wave2-cross-module-journeys.test.ts
          git commit -m "style(INTEG-01): apply canonical formatting"
          git push origin HEAD:integration/international-school-platform-v1
