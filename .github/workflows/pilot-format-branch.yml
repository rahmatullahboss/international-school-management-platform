name: Format PILOT-01 Branch

on:
  push:
    branches:
      - pilot/runtime-portal-composition

permissions:
  contents: write

concurrency:
  group: pilot-runtime-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/runtime-portal-composition
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm ci
      - run: npm run format

      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(pilot): format lazy portal bundles'
          git push origin HEAD:pilot/runtime-portal-composition
