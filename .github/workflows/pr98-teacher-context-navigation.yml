name: PR98 teacher context navigation

on:
  push:
    branches:
      - ux/operational-school-erp-v1

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/operational-school-erp-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Wire teacher navigation and permitted profile selection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = source.read_text()

          replacements = [
            ("              'Open roster',", '''              <a href="/teacher/students" key="a">\n                Open roster\n              </a>,'''),
            ("              'Open class',", '              <PilotUnavailableAction key="a">Open class</PilotUnavailableAction>,'),
            ("              'Prepare lesson',", '''              <a href="/teacher/resources" key="a">\n                Prepare lesson\n              </a>,'''),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one TeacherClasses marker for {old!r}, found {text.count(old)}')
            text = text.replace(old, new, 1)

          # In the class roster, Samira has a loaded permitted context on /teacher/students; Alex does not.
          roster_marker = "              'Open permitted profile',"
          class_start = text.index('function TeacherClasses')
          class_end = text.index('function TeacherAttendance')
          before, section, after = text[:class_start], text[class_start:class_end], text[class_end:]
          if section.count(roster_marker) != 2:
            raise SystemExit(f'Expected two TeacherClasses profile markers, found {section.count(roster_marker)}')
          section = section.replace(
            roster_marker,
            '''              <a href="/teacher/students" key="a">\n                Open permitted profile\n              </a>,''',
            1,
          )
          section = section.replace(
            roster_marker,
            '              <PilotUnavailableAction key="a">Open permitted profile</PilotUnavailableAction>,',
            1,
          )
          text = before + section + after

          old_function_start = '''function TeacherStudents(): ReactElement {\n  return ('''
          new_function_start = '''function TeacherStudents(): ReactElement {\n  const [selectedStudent, setSelectedStudent] = useState<'Samira Noor' | 'Riya Ahmed'>('Samira Noor');\n  const selectedTimeline =\n    selectedStudent === 'Samira Noor'\n      ? ([\n          {\n            time: '28 Jul',\n            title: 'Algebra checkpoint',\n            detail: 'A- · published feedback',\n            status: 'Published',\n          },\n          {\n            time: '29 Jul',\n            title: 'Learning adjustment',\n            detail: 'Adjusted task remains permitted for this class',\n            status: 'Current',\n          },\n          {\n            time: 'Next lesson',\n            title: 'Teacher action',\n            detail: 'Review adjusted task before class',\n            status: 'Next action',\n          },\n        ] as const)\n      : ([\n          {\n            time: '29 Jul',\n            title: 'Classwork',\n            detail: 'Steady progress · current teaching evidence',\n            status: 'Current',\n          },\n          {\n            time: 'Today',\n            title: 'Attendance',\n            detail: 'Present in the assigned class',\n            status: 'Current',\n          },\n          {\n            time: 'Next lesson',\n            title: 'Teacher action',\n            detail: 'No additional follow-up recorded',\n            status: 'Next action',\n          },\n        ] as const);\n\n  return ('''
          if old_function_start not in text:
            raise SystemExit('TeacherStudents function marker missing')
          text = text.replace(old_function_start, new_function_start, 1)

          student_start = text.index('function TeacherStudents')
          student_end = text.index('function MessageWorkspace')
          before, section, after = text[:student_start], text[student_start:student_end], text[student_end:]

          student_marker = "                'Open permitted profile',"
          if section.count(student_marker) != 2:
            raise SystemExit(f'Expected two TeacherStudents profile markers, found {section.count(student_marker)}')
          section = section.replace(
            student_marker,
            '''                <button\n                  aria-label="Open Samira Noor permitted profile"\n                  aria-pressed={selectedStudent === 'Samira Noor'}\n                  key="a"\n                  onClick={() => setSelectedStudent('Samira Noor')}\n                  type="button"\n                >\n                  Open profile\n                </button>,''',
            1,
          )
          section = section.replace(
            student_marker,
            '''                <button\n                  aria-label="Open Riya Ahmed permitted profile"\n                  aria-pressed={selectedStudent === 'Riya Ahmed'}\n                  key="a"\n                  onClick={() => setSelectedStudent('Riya Ahmed')}\n                  type="button"\n                >\n                  Open profile\n                </button>,''',
            1,
          )

          old_detail = '''        <Pane\n          title="Samira Noor · permitted context"\n          description="Current teaching relationship · read-only evidence timeline."\n        >\n          <Timeline\n            label="Samira learning evidence"\n            items={[\n              {\n                time: '28 Jul',\n                title: 'Algebra checkpoint',\n                detail: 'A- · published feedback',\n                status: 'Published',\n              },\n              {\n                time: '29 Jul',\n                title: 'Learning adjustment',\n                detail: 'Adjusted task remains permitted for this class',\n                status: 'Current',\n              },\n              {\n                time: 'Next lesson',\n                title: 'Teacher action',\n                detail: 'Review adjusted task before class',\n                status: 'Next action',\n              },\n            ]}\n          />'''
          new_detail = '''        <Pane\n          title={`${selectedStudent} · permitted context`}\n          description="Current teaching relationship · read-only evidence timeline."\n        >\n          <Timeline label={`${selectedStudent} learning evidence`} items={selectedTimeline} />'''
          if old_detail not in section:
            raise SystemExit('TeacherStudents detail pane marker missing')
          section = section.replace(old_detail, new_detail, 1)
          text = before + section + after
          source.write_text(text)

          unit = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          unit_text = unit.read_text()
          if 'wires Teacher class actions to real task routes' in unit_text:
            raise SystemExit('Teacher navigation regression test already exists')
          insertion = '''\n\n  it('wires Teacher class actions to real task routes and keeps unavailable class detail explicit', () => {\n    const markup = renderRoute('/teacher/classes', 'teacher');\n\n    expect(markup).toContain('href="/teacher/students"');\n    expect(markup).toContain('href="/teacher/resources"');\n    expect(markup).toContain('Open class');\n    expect(markup).toContain('disabled=""');\n  });\n\n  it('renders selectable permitted student context controls', () => {\n    const markup = renderRoute('/teacher/students', 'teacher');\n\n    expect(markup).toContain('Open Samira Noor permitted profile');\n    expect(markup).toContain('Open Riya Ahmed permitted profile');\n    expect(markup).toContain('Samira Noor · permitted context');\n    expect(markup).toContain('aria-pressed="true"');\n  });'''
          closing = unit_text.rfind('\n});')
          if closing < 0:
            raise SystemExit('Unit test describe closing marker missing')
          unit.write_text(unit_text[:closing] + insertion + unit_text[closing:])

          browser = Path('tests/browser/platform-shell.spec.ts')
          browser_text = browser.read_text()
          if 'switches Teacher permitted student context in place' in browser_text:
            raise SystemExit('Teacher context browser test already exists')
          browser_text += '''\n\ntest('switches Teacher permitted student context in place', async ({ page }) => {\n  await page.goto('/teacher/students');\n  await expect(page.getByRole('heading', { name: 'Samira Noor · permitted context' })).toBeVisible();\n  await page.getByRole('button', { name: 'Open Riya Ahmed permitted profile' }).click();\n  await expect(page.getByRole('heading', { name: 'Riya Ahmed · permitted context' })).toBeVisible();\n  await expect(page.getByText('Present in the assigned class')).toBeVisible();\n});\n'''
          browser.write_text(browser_text)
          PY
      - run: npx prettier --write apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx tests/browser/platform-shell.spec.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run build
      - run: npm run check:experience-budget
      - name: Commit verified slice and remove helper
        run: |
          rm .github/workflows/pr98-teacher-context-navigation.yml
          rm -f .github/pr98-teacher-context-navigation-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx tests/browser/platform-shell.spec.ts .github/workflows/pr98-teacher-context-navigation.yml .github/pr98-teacher-context-navigation-trigger.txt
          git commit -m 'feat(ux): wire teacher task navigation and context selection'
          git push origin HEAD:ux/operational-school-erp-v1
