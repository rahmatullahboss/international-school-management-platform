name: Fix persona current session signature

on:
  pull_request:
    branches:
      - test/full-role-e2e-coverage-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/full-product-persona-e2e-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/full-product-persona-e2e-v2
      - name: Align verifier with AUTH-07 current session signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/verify-product-persona-e2e.sh')
          text = path.read_text()
          replacements = {
              "    '30000000-0000-4000-8000-000000000003',\n    ARRAY['61000000-0000-4000-8000-000000000005'::uuid],":
              "    '30000000-0000-4000-8000-000000000003',\n    'persona-admissions-session',\n    ARRAY['61000000-0000-4000-8000-000000000005'::uuid],",
              "    '30000000-0000-4000-8000-000000000003',\n    ARRAY['62000000-0000-4000-8000-000000000005'::uuid],":
              "    '30000000-0000-4000-8000-000000000003',\n    'persona-finance-session',\n    ARRAY['62000000-0000-4000-8000-000000000005'::uuid],",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected sequence not found: {old!r}')
              text = text.replace(old, new, 1)
          support_old = "    '30000000-0000-4000-8000-000000000003',\n    ARRAY['63000000-0000-4000-8000-000000000005'::uuid],"
          if text.count(support_old) != 2:
              raise SystemExit(f'expected two support session sequences, got {text.count(support_old)}')
          text = text.replace(
              support_old,
              "    '30000000-0000-4000-8000-000000000003',\n    'persona-support-aal1',\n    ARRAY['63000000-0000-4000-8000-000000000005'::uuid],",
              1,
          )
          text = text.replace(
              support_old,
              "    '30000000-0000-4000-8000-000000000003',\n    'persona-support-aal2',\n    ARRAY['63000000-0000-4000-8000-000000000005'::uuid],",
              1,
          )
          path.write_text(text)
          PY
      - name: Commit verifier fix
        run: |
          git add tests/integration/verify-product-persona-e2e.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(e2e): align persona sessions with AUTH-07"
          git push origin HEAD:test/full-product-persona-e2e-v2
