name: one-shot fix production migration count

on:
  push:
    branches:
      - codex/admissions-offer-enrolment-commands-20260809

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-offer-enrolment-commands-20260809
          fetch-depth: 0
      - name: Update production ledger expectation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/verify-production-runtime.sh')
          text = path.read_text()
          old_count = "IF (SELECT count(*) FROM platform.schema_migration) <> 57 THEN"
          old_message = "expected 57 total migration ledger rows after production hardening"
          if text.count(old_count) != 1 or text.count(old_message) != 1:
              raise SystemExit('production migration count guard changed unexpectedly')
          text = text.replace(old_count, "IF (SELECT count(*) FROM platform.schema_migration) <> 58 THEN", 1)
          text = text.replace(old_message, "expected 58 total migration ledger rows after production hardening", 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/integration/verify-production-runtime.sh
          git commit -m 'test(prod): account for admissions offer migration'
          git push origin HEAD:codex/admissions-offer-enrolment-commands-20260809
