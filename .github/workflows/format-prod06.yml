name: Format PROD-06

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'prod/oidc-ingress-bounds'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/oidc-ingress-bounds
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Format PROD-06 files
        run: npx prettier --write apps/platform-api/src/auth-login-routes.test.ts apps/platform-api/src/auth-oidc-ingress.test.ts apps/platform-api/src/auth-oidc-ingress.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-api/src/auth-login-routes.test.ts apps/platform-api/src/auth-oidc-ingress.test.ts apps/platform-api/src/auth-oidc-ingress.ts
          git commit -m 'style(prod): format OIDC ingress bounds'
          git push origin HEAD:prod/oidc-ingress-bounds
