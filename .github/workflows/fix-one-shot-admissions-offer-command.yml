name: fix one-shot admissions offer command

on:
  push:
    branches:
      - codex/admissions-offer-enrolment-commands-20260809

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-offer-enrolment-commands-20260809
          fetch-depth: 0
      - name: Fix verifier stream-list guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-shot-admissions-offer-command.yml')
          lines = path.read_text().splitlines()
          target = None
          for index in range(len(lines) - 2):
              if (
                  lines[index].strip() == "replace_once('tests/integration/verify-auth-durable-context.sh'," and
                  lines[index + 1].strip() == "\"'PILOT-12', 'PILOT-13'\"," and
                  lines[index + 2].strip() == "\"'PILOT-12', 'PILOT-13', 'PILOT-14'\")"
              ):
                  target = index
                  break
          if target is None:
              raise SystemExit('helper target block not found')
          indent = lines[target][:len(lines[target]) - len(lines[target].lstrip())]
          replacement = [
              indent + "verifier_path = Path('tests/integration/verify-auth-durable-context.sh')",
              indent + "verifier_text = verifier_path.read_text()",
              indent + "stream_tail = \"'PILOT-12', 'PILOT-13'\"",
              indent + "if verifier_text.count(stream_tail) != 3:",
              indent + "    raise SystemExit(f'verifier: expected three stream-list tails, found {verifier_text.count(stream_tail)}')",
              indent + "verifier_path.write_text(verifier_text.replace(stream_tail, \"'PILOT-12', 'PILOT-13', 'PILOT-14'\"))",
          ]
          lines[target:target + 3] = replacement
          path.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
          git diff -- .github/workflows/one-shot-admissions-offer-command.yml
      - name: Commit helper fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/one-shot-admissions-offer-command.yml
          git commit -m 'ci: fix admissions offer patch guard'
          git push origin HEAD:codex/admissions-offer-enrolment-commands-20260809
