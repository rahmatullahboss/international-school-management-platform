name: one-shot wire admissions accept convert v2

on:
  push:
    branches:
      - codex/admissions-accept-convert-20260810

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-accept-convert-20260810
          fetch-depth: 0
      - name: Run corrected wiring patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('infra/database/post-integration-migrations/202608100101_PILOT-15_admissions_accept_convert_commands.sql')
          text = migration.read_text()
          old = "SELECT role_permission.tenant_id, role_permission.role_id, permission_key\nFROM iam.role_permission AS role_permission"
          new = "SELECT role_permission.tenant_id, role_permission.role_id, permission.permission_key\nFROM iam.role_permission AS role_permission"
          if text.count(old) != 1:
              raise SystemExit(f'permission alias anchor mismatch: {text.count(old)}')
          migration.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/one-shot-wire-accept-convert.yml').read_text().splitlines()
          start = None
          end = None
          for index, line in enumerate(workflow):
              if line.strip() == '- name: Wire commands and verification':
                  for cursor in range(index + 1, len(workflow)):
                      if workflow[cursor].strip() == 'run: |':
                          start = cursor + 1
                          break
              if start is not None and index > start and line.strip() == '- name: Commit wiring':
                  end = index
                  break
          if start is None or end is None:
              raise SystemExit('wire helper run block not found')
          block = []
          for line in workflow[start:end]:
              if line.startswith('          '):
                  block.append(line[10:])
              elif line.strip() == '':
                  block.append('')
              else:
                  raise SystemExit(f'unexpected helper indentation: {line!r}')
          script = '\n'.join(block) + '\n'
          marker = '\nnpx prettier --write '
          if script.count(marker) != 1:
              raise SystemExit(f'prettier marker mismatch: {script.count(marker)}')
          script = script.replace(marker, '\nnpm ci\n\nnpx prettier --write ', 1)
          Path('/tmp/wire-accept-convert.sh').write_text(script)
          PY
          bash /tmp/wire-accept-convert.sh
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            infra/database/post-integration-migration-manifest.json \
            infra/database/post-integration-migrations/202608100101_PILOT-15_admissions_accept_convert_commands.sql \
            tests/integration/verify-auth-durable-context.sh \
            tests/integration/verify-production-runtime.sh \
            .github/workflows/ci.yml \
            apps/platform-api/src/operator-domain-commands.ts \
            apps/platform-api/src/database-operator-domain-command-store.ts \
            apps/platform-api/src/production-operator-command-api.ts \
            apps/platform-api/src/operator-domain-commands.test.ts \
            apps/platform-api/src/database-operator-domain-command-store.test.ts \
            apps/platform-api/src/production-operator-command-api.test.ts
          git commit -m 'feat(admissions): wire offer acceptance and applicant conversion'
          git push origin HEAD:codex/admissions-accept-convert-20260810
