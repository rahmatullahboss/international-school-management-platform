name: Patch PILOT-07 Governance

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch-tracker:
    if: github.event.pull_request.head.ref == 'docs/pilot-runtime-projection-source-publisher-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pilot-runtime-projection-source-publisher-v1
          fetch-depth: 0
      - name: Patch progress tracker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/execution/04-progress-tracker.md')
          text = path.read_text()
          gate = 'GATE-PILOT-RUNTIME-PROJECTION-SOURCE-PUBLISHER-V1'
          if gate in text:
              raise SystemExit(0)

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one tracker marker, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '`GATE-PILOT-SAFE-MUTATION-V1` and `GATE-PILOT-RUNTIME-PROJECTION-WORKER-V1` have passed.',
              '`GATE-PILOT-SAFE-MUTATION-V1`, `GATE-PILOT-RUNTIME-PROJECTION-WORKER-V1` and `GATE-PILOT-RUNTIME-PROJECTION-SOURCE-PUBLISHER-V1` have passed.',
          )
          replace_once(
              'and a database-native SKIP LOCKED projection processor with applied-command deduplication, bounded retries and terminal dead-letter isolation, while real provider login, source publication, production database/worker bindings, production schedule activation and general production mutations remain disabled.',
              'and a database-native SKIP LOCKED projection processor with applied-command deduplication, bounded retries and terminal dead-letter isolation, plus a privileged non-HTTP projection source publisher with database-owned persona/subject derivation, monotonic source revisions and append-only evidence, while real provider login, production publisher credentials/mappings/source population, production database/worker bindings, production schedule activation and general production mutations remain disabled.',
          )
          replace_once(
              'followed by the durable runtime projection worker in [36-pilot-runtime-projection-worker-v1.md](36-pilot-runtime-projection-worker-v1.md) and [37-pilot-runtime-projection-worker-release-evidence.md](37-pilot-runtime-projection-worker-release-evidence.md).',
              'followed by the durable runtime projection worker in [36-pilot-runtime-projection-worker-v1.md](36-pilot-runtime-projection-worker-v1.md) and [37-pilot-runtime-projection-worker-release-evidence.md](37-pilot-runtime-projection-worker-release-evidence.md), and the controlled runtime projection source publisher in [38-pilot-runtime-projection-source-publisher-v1.md](38-pilot-runtime-projection-source-publisher-v1.md) and [39-pilot-runtime-projection-source-publisher-release-evidence.md](39-pilot-runtime-projection-source-publisher-release-evidence.md).',
          )

          gate_row = "| `GATE-PILOT-RUNTIME-PROJECTION-WORKER-V1` | passed | Implementation proof `c1bb4d3f5713d093bd9865d9c37dcf3e9db2c829`; main merge `a731f89fc4c6476580129ab0cd734e9250c0aa64`; root CI `30635344251`; deploy/smoke `30635344238`; exact event allowlist, SKIP LOCKED claims, source integrity, applied-command deduplication, bounded retry and terminal dead-letter isolation verified |"
          replace_once(
              gate_row,
              gate_row + "\n| `GATE-PILOT-RUNTIME-PROJECTION-SOURCE-PUBLISHER-V1` | passed | Implementation proof `0ae5b782adb2443d74fafdf4c191638b949d379d`; main merge `1321466a690c1f70be4d1528ed7015f029083302`; root CI `30648006915`; privileged function-only publication, reviewed persona mapping, server-owned subject, monotonic source revisions, append-only evidence and publisher-to-worker projection `8 → 9` verified |",
          )

          stream_row = "| `PILOT-06` | post-integration | durable runtime projection worker gate passed; source/database binding and schedule activation disabled | proof `c1bb4d3f5713d093bd9865d9c37dcf3e9db2c829`; main merge `a731f89fc4c6476580129ab0cd734e9250c0aa64`; CI `30635344251`; deploy `30635344238` |"
          replace_once(
              stream_row,
              stream_row + "\n| `PILOT-07` | post-integration | controlled runtime projection source publisher gate passed; production credentials, mappings and source population disabled | proof `0ae5b782adb2443d74fafdf4c191638b949d379d`; main merge `1321466a690c1f70be4d1528ed7015f029083302`; CI `30648006915`; non-HTTP staging deploy not required |",
          )

          closure = '''## PILOT-07 controlled runtime projection source publisher gate closure

Completed and verified on implementation proof `0ae5b782adb2443d74fafdf4c191638b949d379d` and main merge `1321466a690c1f70be4d1528ed7015f029083302`:

- separate no-login, no-bypass-RLS roles govern persona mapping and source publication;
- all privileged roles retain function-only access and `app_runtime` cannot publish source payloads;
- active account, exact membership/campus and current reviewed role mappings determine scope;
- persona and subject are database-owned and cannot be injected by the caller or payload;
- unmapped, ambiguous, inactive, stale, oversized and scope-bearing publications fail closed;
- source revisions are monotonic and the existing trigger owns payload digest and byte integrity;
- mapping changes and accepted source publications retain append-only governance and audit evidence;
- no public HTTP route or publisher credential was introduced;
- fresh PostgreSQL verified source publication, safe mutation, worker processing and projection revision `8 → 9` end to end.

Verification evidence:

- ordinary suite: 662 tests passed, with one environment-dependent direct-Neon test skipped and passed separately against live Neon;
- migrations: 40 canonical plus seven post-integration migrations, producing 47 ledger entries;
- browser journeys: 22 passed;
- format, lint, boundaries, TypeScript, builds, budget, audit, licence, provenance and artifact gates passed;
- root CI `30648006915` passed; Cloudflare staging was expectedly skipped for this non-HTTP milestone.

'''
          replace_once('## Live staging routes', closure + '## Live staging routes')

          lineage = '- PILOT-06 main merge: `a731f89fc4c6476580129ab0cd734e9250c0aa64`'
          replace_once(
              lineage,
              lineage + "\n- PILOT-07 proof: `0ae5b782adb2443d74fafdf4c191638b949d379d`\n- PILOT-07 main merge: `1321466a690c1f70be4d1528ed7015f029083302`",
          )

          replace_once(
              '- Repository tests: 654 passed, with one environment-dependent direct-Neon test skipped in the ordinary suite and passed separately; PILOT-06 adds database-native projection claims, source integrity, duplicate-delivery, retry/dead-letter, scheduled-boundary and readiness coverage without changing domain invariants.',
              '- Repository tests: 662 passed, with one environment-dependent direct-Neon test skipped in the ordinary suite and passed separately; PILOT-07 adds privileged source publication, persona/subject derivation, monotonic revision, append-only evidence and publisher-to-worker lifecycle coverage without changing domain invariants.',
          )
          replace_once(
              '- Post-integration manifest: six migrations through PILOT-06; 46 total ledger entries verified.',
              '- Post-integration manifest: seven migrations through PILOT-07; 47 total ledger entries verified.',
          )
          replace_once(
              '- implement reviewed source publishers into `runtime_projection_source`;',
              '- configure reviewed domain-owned snapshot composers, production persona mappings and least-privilege publisher credentials;',
          )
          replace_once(
              'PILOT-04 through PILOT-06 add tenant-safe database read models, one allowlisted safe mutation and a durable projection processor while real login, source publication, database/worker bindings and schedule activation remain explicitly disabled.',
              'PILOT-04 through PILOT-07 add tenant-safe database read models, one allowlisted safe mutation, a durable projection processor and a controlled non-HTTP source publisher while real login, production publisher credentials/mappings/source population, database/worker bindings and schedule activation remain explicitly disabled.',
          )

          path.write_text(text)
          PY
      - name: Commit tracker update
        shell: bash
        run: |
          if git diff --quiet -- docs/execution/04-progress-tracker.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/execution/04-progress-tracker.md
          git commit -m 'docs(pilot): update tracker for source publisher gate'
          git push origin HEAD:refs/heads/docs/pilot-runtime-projection-source-publisher-v1
