name: Fix long content overflow

on:
  push:
    branches:
      - codex/ux-hardening-long-content-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/ux-hardening-long-content-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Apply shared translated-content reflow fix
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/platform-web/src/operational-module-surface.css')
          text = path.read_text()
          root_old = "  color: var(--op-ink);\n  display: grid;"
          root_new = "  color: var(--op-ink);\n  overflow-wrap: anywhere;\n  display: grid;"
          media_old = "  .operational-pane > header {\n    align-items: start;\n    flex-direction: column;\n  }"
          media_new = "  .operational-pane > header {\n    align-items: stretch;\n    flex-direction: column;\n  }"
          if root_old in text:
              text = text.replace(root_old, root_new, 1)
          elif root_new not in text:
              raise SystemExit('module wrap target not found')
          if media_old in text:
              text = text.replace(media_old, media_new, 1)
          elif media_new not in text:
              raise SystemExit('mobile header stretch target not found')
          path.write_text(text)
          PY
          if git diff --quiet -- apps/platform-web/src/operational-module-surface.css; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            test "$(git diff --name-only)" = "apps/platform-web/src/operational-module-surface.css"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify long-content contract
        run: npx playwright test -c playwright.config.mjs tests/browser/ux-hardening.spec.ts --grep "long translated task content" --reporter=line
      - name: Commit verified CSS fix
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/platform-web/src/operational-module-surface.css
          git commit -m "fix(ux): constrain translated task content"
          git push origin HEAD:codex/ux-hardening-long-content-20260809
