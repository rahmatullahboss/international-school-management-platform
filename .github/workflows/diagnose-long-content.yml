name: Fix long content overflow

on:
  push:
    branches:
      - codex/ux-hardening-long-content-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/ux-hardening-long-content-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Apply minimal queue-heading reflow fix
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/platform-web/src/operational-module-surface.css')
          text = path.read_text()
          old = ".operational-module__header > div {\n  min-inline-size: 0;\n}"
          new = ".operational-module__header > div,\n.operational-section__heading > div {\n  min-inline-size: 0;\n  overflow-wrap: anywhere;\n}"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('targeted reflow rule not found')
          PY
          if git diff --quiet -- apps/platform-web/src/operational-module-surface.css; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            test "$(git diff --name-only)" = "apps/platform-web/src/operational-module-surface.css"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify long-content contract
        run: npx playwright test -c playwright.config.mjs tests/browser/ux-hardening.spec.ts --grep "long translated task content" --reporter=line
      - name: Commit verified CSS fix
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/platform-web/src/operational-module-surface.css
          git commit -m "fix(ux): constrain translated queue headings"
          git push origin HEAD:codex/ux-hardening-long-content-20260809
