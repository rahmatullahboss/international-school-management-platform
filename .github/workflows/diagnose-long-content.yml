name: Diagnose long content overflow

on:
  push:
    branches:
      - codex/ux-hardening-long-content-20260809
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ux-hardening-long-content-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instrument long-content geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/ux-hardening.spec.ts')
          text = path.read_text()
          old = "    const layout = await textTarget.evaluate((element) => {"
          new = "    console.log('GEOMETRY', await textTarget.evaluate((element) => { const style = getComputedStyle(element); const parent = element.parentElement; const main = element.closest('#experience-main'); const rect = element.getBoundingClientRect(); const parentRect = parent?.getBoundingClientRect(); const mainRect = main?.getBoundingClientRect(); return { tag: element.tagName, className: element.className, text: element.textContent, rect: { left: rect.left, right: rect.right, width: rect.width }, clientWidth: element.clientWidth, scrollWidth: element.scrollWidth, overflowWrap: style.overflowWrap, wordBreak: style.wordBreak, whiteSpace: style.whiteSpace, parent: parent ? { tag: parent.tagName, className: parent.className, rect: parentRect && { left: parentRect.left, right: parentRect.right, width: parentRect.width } } : null, mainRect: mainRect && { left: mainRect.left, right: mainRect.right, width: mainRect.width }, viewport: document.documentElement.clientWidth }; }));\n\n    const layout = await textTarget.evaluate((element) => {"
          if old not in text:
              raise SystemExit('geometry insertion target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npx playwright install --with-deps chromium
      - name: Run long-content test only
        run: npx playwright test -c playwright.config.mjs tests/browser/ux-hardening.spec.ts --grep "long translated task content" --reporter=line
