name: Format PROD-07

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'prod/streaming-body-bounds'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod/streaming-body-bounds
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/platform-api/src/bounded-request-body.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-api/src/bounded-request-body.test.ts
          git commit -m 'style(prod): format bounded request body tests'
          git push origin HEAD:prod/streaming-body-bounds
