name: Staff Domain Localization Apply

on:
  pull_request:
    paths:
      - 'mobile/apps/staff_app/lib/main.dart'
      - 'mobile/apps/staff_app/lib/production_app.dart'
      - 'mobile/apps/staff_app/lib/teacher_production_journeys.dart'
      - 'mobile/apps/staff_app/lib/staff_production_strings.dart'
      - 'mobile/apps/staff_app/lib/staff_production_dynamic_strings.dart'
      - 'mobile/apps/staff_app/test/staff_production_strings_test.dart'
      - 'mobile/tool/apply_staff_domain_localization.py'
      - '.github/workflows/staff-domain-localization-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - name: Apply bounded Staff localization wiring
        run: python3 mobile/tool/apply_staff_domain_localization.py
      - name: Format changed Dart files
        run: |
          dart format \
            mobile/apps/staff_app/lib/main.dart \
            mobile/apps/staff_app/lib/production_app.dart \
            mobile/apps/staff_app/lib/teacher_production_journeys.dart \
            mobile/apps/staff_app/lib/staff_production_strings.dart \
            mobile/apps/staff_app/lib/staff_production_dynamic_strings.dart \
            mobile/apps/staff_app/test/staff_production_strings_test.dart
      - name: Commit applied localization wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Staff localization wiring already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/apps/staff_app/lib/main.dart \
            mobile/apps/staff_app/lib/production_app.dart \
            mobile/apps/staff_app/lib/teacher_production_journeys.dart \
            mobile/apps/staff_app/lib/staff_production_strings.dart \
            mobile/apps/staff_app/lib/staff_production_dynamic_strings.dart \
            mobile/apps/staff_app/test/staff_production_strings_test.dart
          git commit -m 'feat(mobile): localize Staff production copy'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
