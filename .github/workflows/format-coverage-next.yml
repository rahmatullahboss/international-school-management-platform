name: Format next coverage batch

on:
  push:
    branches:
      - integration/coverage-e2e-100-v1

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/coverage-e2e-100-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Format coverage files
        run: >-
          npx prettier --write
          apps/platform-web/src/operator-portal.test.tsx
          packages/modules/billing/src/contracts/coverage.test.ts
          apps/platform-web/src/pilot-data.test.ts
          apps/platform-web/src/portal-shared.test.tsx
          vitest.config.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/platform-web/src/operator-portal.test.tsx \
            packages/modules/billing/src/contracts/coverage.test.ts \
            apps/platform-web/src/pilot-data.test.ts \
            apps/platform-web/src/portal-shared.test.tsx \
            vitest.config.ts
          git commit -m "style(test): format coverage expansion"
          git push origin HEAD:integration/coverage-e2e-100-v1
