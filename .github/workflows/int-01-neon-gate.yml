name: INT-01 Neon Gate

on:
  push:
    branches:
      - module/international-integrations
  workflow_dispatch:
    inputs:
      operation:
        description: Neon gate operation
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
          - replay-database
          - replay-branch

permissions:
  contents: read

concurrency:
  group: int-01-neon-gate
  cancel-in-progress: false

jobs:
  neon-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Resolve operation
        id: operation
        env:
          DISPATCH_OPERATION: ${{ inputs.operation }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode=inspect
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${DISPATCH_OPERATION:-inspect}"
          elif [[ "$COMMIT_MESSAGE" == *"[neon-replay-db]"* ]]; then
            mode=replay-database
          elif [[ "$COMMIT_MESSAGE" == *"[neon-apply]"* ]]; then
            mode=apply
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Resolved INT-01 Neon gate mode: $mode"

      - name: Resolve Neon API availability
        id: neon
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -n "$NEON_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "NEON_API_KEY repository secret is required" >&2
            exit 1
          fi
          echo "NEON_API_KEY is not configured; live Neon gate remains pending."

      - uses: actions/setup-node@v4
        if: steps.neon.outputs.available == 'true' && steps.operation.outputs.mode != 'inspect'
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        if: steps.neon.outputs.available == 'true' && steps.operation.outputs.mode != 'inspect'
        run: npm ci

      - name: Run INT-01 Neon gate
        if: steps.neon.outputs.available == 'true'
        run: bash scripts/int-01-neon-gate.sh "${{ steps.operation.outputs.mode }}"
