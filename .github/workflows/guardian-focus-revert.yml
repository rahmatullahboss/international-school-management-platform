name: Guardian focus revert

on:
  push:
    branches:
      - codex/guardian-core-route-workflows-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/guardian-core-route-workflows-20260809
      - name: Restore Guardian workspace exactly from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            apps/web-family/src/features/experience/GuardianHouseholdWorkspace.tsx \
            apps/web-family/src/features/experience/guardian-household-workspace.css
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web-family/src/features/experience/GuardianHouseholdWorkspace.tsx apps/web-family/src/features/experience/guardian-household-workspace.css
          git diff --cached --quiet && exit 0
          git commit -m "fix(guardian): restore operational route behavior"
          git push origin HEAD:codex/guardian-core-route-workflows-20260809
