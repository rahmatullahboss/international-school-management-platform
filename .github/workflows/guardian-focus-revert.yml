name: Guardian focus revert

on:
  push:
    branches:
      - codex/guardian-core-route-workflows-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/guardian-core-route-workflows-20260809
      - name: Restore workspace contract and remove focus-only CSS
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- apps/web-family/src/features/experience/GuardianHouseholdWorkspace.tsx
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web-family/src/features/experience/guardian-household-workspace.css')
          text = path.read_text()
          start = text.index("\n:is(\n    [data-focus='applications'],")
          end = text.index("\n@media (max-width: 68rem)", start)
          path.write_text(text[:start] + text[end:])
          PY
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            apps/web-family/src/features/experience/GuardianHouseholdWorkspace.tsx \
            apps/web-family/src/features/experience/guardian-household-workspace.css | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web-family/src/features/experience/GuardianHouseholdWorkspace.tsx apps/web-family/src/features/experience/guardian-household-workspace.css
          git commit -m "fix(guardian): restore route detail workflows"
          git push origin HEAD:codex/guardian-core-route-workflows-20260809
