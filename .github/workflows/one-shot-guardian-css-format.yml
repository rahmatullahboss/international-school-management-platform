name: One-shot guardian CSS formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'codex/guardian-core-route-workflows-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Format only guardian workspace CSS
        shell: bash
        run: |
          set -euo pipefail
          npm ci --silent >/dev/null 2>&1
          npx prettier --write apps/web-family/src/features/experience/guardian-household-workspace.css
          test "$(git diff --name-only)" = "apps/web-family/src/features/experience/guardian-household-workspace.css"
          git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-family/src/features/experience/guardian-household-workspace.css
          git commit -m 'style(guardian): format focused route selectors'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
