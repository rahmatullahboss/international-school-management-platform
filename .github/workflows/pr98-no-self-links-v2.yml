name: PR98 remove fake self links v2

on:
  push:
    branches:
      - ux/operational-school-erp-v1

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/operational-school-erp-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply self-link safety fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = source.read_text()

          text, count = re.subn(
              r"function ActionBar\(props: \{\n  readonly page: PilotModulePage;\n  readonly context\?: string;\n\}\): ReactElement \{",
              "function ActionBar(props: {\n  readonly page: PilotModulePage;\n  readonly currentPath: string;\n  readonly context?: string;\n}): ReactElement {",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'ActionBar signature replacements: {count}')

          action_pattern = re.compile(
              r"\{props\.page\.actions\.map\(\(action, index\) => \(\s*"
              r"<a data-primary=\{index === 0 \? 'true' : 'false'\} href=\{action\.href\} key=\{action\.label\}>\s*"
              r"\{action\.label\}\s*</a>\s*\)\)\}"
          )
          action_replacement = '''{props.page.actions.map((action, index) =>
            action.href === props.currentPath ? (
              <PilotUnavailableAction key={action.label} primary={index === 0}>
                {action.label}
              </PilotUnavailableAction>
            ) : (
              <a data-primary={index === 0 ? 'true' : 'false'} href={action.href} key={action.label}>
                {action.label}
              </a>
            ),
          )}'''
          text, count = action_pattern.subn(action_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'ActionBar map replacements: {count}')

          text, count = re.subn(
              r"function PriorityQueue\(props: \{ readonly page: PilotModulePage \}\): ReactElement \{",
              "function PriorityQueue(props: {\n  readonly page: PilotModulePage;\n  readonly currentPath: string;\n}): ReactElement {",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'PriorityQueue signature replacements: {count}')

          text, count = re.subn(
              r"<a href=\{item\.href\}>Review</a>",
              '''{item.href === props.currentPath ? (
                <PilotUnavailableAction>Review</PilotUnavailableAction>
              ) : (
                <a href={item.href}>Review</a>
              )}''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'PriorityQueue action replacements: {count}')

          text, count = re.subn(
              r"<PriorityQueue page=\{routePage\('([^']+)'\)\} />",
              lambda match: (
                  f"<PriorityQueue page={{routePage('{match.group(1)}')}} "
                  f"currentPath=\"{match.group(1)}\" />"
              ),
              text,
          )
          if count < 1:
              raise SystemExit('No PriorityQueue calls updated')

          text, count = re.subn(
              r"<ActionBar page=\{props\.page\} />",
              '<ActionBar page={props.page} currentPath={props.path} />',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'ActionBar call replacements: {count}')

          body_self_link = re.compile(
              r'<a href="(/admin/(?:sis|academics))" key="([^"]+)">\s*([^<]+?)\s*</a>',
              re.MULTILINE,
          )
          text, count = body_self_link.subn(
              lambda match: (
                  f'<PilotUnavailableAction key="{match.group(2)}">'
                  f'{match.group(3).strip()}'
                  '</PilotUnavailableAction>'
              ),
              text,
          )
          if count < 1:
              raise SystemExit('No SIS/academics body self links updated')

          source.write_text(text)

          test = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          test_text = test.read_text()
          if 'does not render fake self-reloading actions' in test_text:
              raise SystemExit('Self-link regression test already exists')
          insertion = '''

  it.each([
    ['/admin/sis', 'admin'],
    ['/admin/academics', 'admin'],
  ] as const)('does not render fake self-reloading actions on %s', (path, role) => {
    const markup = renderRoute(path, role);

    expect(markup).not.toContain(`href="${path}"`);
    expect(markup).toContain('disabled=""');
  });'''
          closing = test_text.rfind('\n});')
          if closing < 0:
              raise SystemExit('Test describe closing marker missing')
          test.write_text(test_text[:closing] + insertion + test_text[closing:])
          PY
      - run: npx prettier --write apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run build
      - run: npm run check:experience-budget
      - name: Commit verified fix and remove helper
        run: |
          rm .github/workflows/pr98-no-self-links-v2.yml
          rm -f .github/pr98-no-self-links-v2-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx .github/workflows/pr98-no-self-links-v2.yml .github/pr98-no-self-links-v2-trigger.txt
          git commit -m 'fix(ux): stop fake self-reloading task actions'
          git push origin HEAD:ux/operational-school-erp-v1
