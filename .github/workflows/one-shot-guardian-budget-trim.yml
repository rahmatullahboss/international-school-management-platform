name: One-shot guardian budget trim

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  trim:
    if: github.event.pull_request.head.ref == 'codex/guardian-core-route-workflows-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded budget trim
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          portal = Path('apps/platform-web/src/portals/guardian.tsx')
          text = portal.read_text()
          replacements = {
              "  const routeSegment = props.path.slice('/family/'.length);\n  const usesHouseholdWorkspace = isHome || page !== undefined;\n": "",
              "      {usesHouseholdWorkspace ? (": "      {isHome || page !== undefined ? (",
              "          {...(isHome ? {} : { focus: routeSegment })}": "          {...(isHome ? {} : { focus: props.path.slice(8) })}",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'portal replacement mismatch: {old!r}')
              text = text.replace(old, new, 1)
          portal.write_text(text)

          css = Path('apps/web-family/src/features/experience/guardian-household-workspace.css')
          text = css.read_text()
          replacements = {
              "  --focus: #0b63ce;\n": "",
              "  --info-text: #16445f;\n": "",
              "  --success-text: #145c36;\n": "",
              "  --warning-text: #714900;\n": "",
              "  outline: 3px solid var(--focus);": "  outline: 3px solid #0b63ce;",
              "  color: var(--info-text);": "  color: #16445f;",
              "[data-state='due'],\n[data-state='due-soon'] {\n  --task-surface: var(--warning);\n  --task-text: var(--warning-text);\n}\n\n[data-state='due'] .guardian-workspace__status,\n[data-state='due-soon'] .guardian-workspace__status {\n  background: var(--task-surface);\n  color: var(--task-text);\n}\n": ":is([data-state='due'], [data-state='due-soon']) .guardian-workspace__status {\n  background: var(--warning);\n  color: #714900;\n}\n",
              "  color: var(--success-text);": "  color: #145c36;",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'css replacement mismatch ({count}): {old!r}')
              text = text.replace(old, new, 1)
          css.write_text(text)
          PY
          printf '%s\n' \
            apps/platform-web/src/portals/guardian.tsx \
            apps/web-family/src/features/experience/guardian-household-workspace.css | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check

      - name: Commit budget trim
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/portals/guardian.tsx apps/web-family/src/features/experience/guardian-household-workspace.css
          git commit -m 'perf(guardian): trim route-focus bundle overhead'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
