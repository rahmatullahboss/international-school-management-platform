name: PR98 self-link safety slice

on:
  push:
    branches:
      - ux/operational-school-erp-v1

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/operational-school-erp-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply bounded self-link safety changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = source.read_text()

          replacements = [
            (
              """function ActionBar(props: {\n  readonly page: PilotModulePage;\n  readonly context?: string;\n}): ReactElement {""",
              """function ActionBar(props: {\n  readonly page: PilotModulePage;\n  readonly currentPath: string;\n  readonly context?: string;\n}): ReactElement {""",
            ),
            (
              """      {props.page.actions.map((action, index) => (\n        <a data-primary={index === 0 ? 'true' : 'false'} href={action.href} key={action.label}>\n          {action.label}\n        </a>\n      ))}""",
              """      {props.page.actions.map((action, index) =>\n        action.href === props.currentPath ? (\n          <PilotUnavailableAction key={action.label} primary={index === 0}>\n            {action.label}\n          </PilotUnavailableAction>\n        ) : (\n          <a data-primary={index === 0 ? 'true' : 'false'} href={action.href} key={action.label}>\n            {action.label}\n          </a>\n        ),\n      )}""",
            ),
            (
              "function PriorityQueue(props: { readonly page: PilotModulePage }): ReactElement {",
              """function PriorityQueue(props: {\n  readonly page: PilotModulePage;\n  readonly currentPath: string;\n}): ReactElement {""",
            ),
            (
              "            <a href={item.href}>Review</a>",
              """            {item.href === props.currentPath ? (\n              <PilotUnavailableAction>Review</PilotUnavailableAction>\n            ) : (\n              <a href={item.href}>Review</a>\n            )}""",
            ),
            (
              "      <ActionBar page={props.page} />",
              "      <ActionBar page={props.page} currentPath={props.path} />",
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Missing exact marker: {old[:90]!r}')
            text = text.replace(old, new, 1)

          text, queue_count = re.subn(
            r"<PriorityQueue page=\{routePage\('([^']+)'\)\} />",
            lambda match: f"<PriorityQueue page={{routePage('{match.group(1)}')}} currentPath=\"{match.group(1)}\" />",
            text,
          )
          if queue_count < 1:
            raise SystemExit('No PriorityQueue call sites were updated')

          inline = {
            '''                <a href="/admin/sis" key="action">\n                  Review\n                </a>,''': '''                <PilotUnavailableAction key="action">Review</PilotUnavailableAction>,''',
            '''                <a href="/admin/sis" key="action">\n                  Open profile\n                </a>,''': '''                <PilotUnavailableAction key="action">Open profile</PilotUnavailableAction>,''',
            '''                <a href="/admin/sis" key="action">\n                  Compare\n                </a>,''': '''                <PilotUnavailableAction key="action">Compare</PilotUnavailableAction>,''',
            '''              <a href="/admin/academics" key="a">\n                Send reminder\n              </a>,''': '''              <PilotUnavailableAction key="a">Send reminder</PilotUnavailableAction>,''',
            '''              <a href="/admin/academics" key="a">\n                Reconcile\n              </a>,''': '''              <PilotUnavailableAction key="a">Reconcile</PilotUnavailableAction>,''',
            '''                <a href="/admin/academics" key="a">\n                  Approve\n                </a>,''': '''                <PilotUnavailableAction key="a">Approve</PilotUnavailableAction>,''',
          }
          for old, new in inline.items():
            if old not in text:
              raise SystemExit(f'Missing inline self-link marker: {old[:90]!r}')
            text = text.replace(old, new, 1)

          source.write_text(text)

          test = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          test_text = test.read_text()
          if 'does not expose same-route actions as working links' in test_text:
            raise SystemExit('Regression test already exists')
          insertion = '''\n\n  it.each([\n    ['/admin/sis', 'admin'],\n    ['/admin/academics', 'admin'],\n  ] as const)('does not expose same-route actions as working links on %s', (path, role) => {\n    const markup = renderRoute(path, role);\n\n    expect(markup).not.toContain(`href="${path}"`);\n    expect(markup).toContain('disabled=""');\n    expect(markup).toContain('operational-pilot-action-boundary');\n  });'''
          closing = test_text.rfind('\n});')
          if closing < 0:
            raise SystemExit('Test describe closing marker missing')
          test.write_text(test_text[:closing] + insertion + test_text[closing:])
          PY
      - run: npx prettier --write apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run build
      - run: npm run check:experience-budget
      - name: Commit verified slice and remove helper
        run: |
          rm .github/workflows/pr98-self-link-safety.yml
          rm -f .github/pr98-self-link-safety-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx .github/workflows/pr98-self-link-safety.yml .github/pr98-self-link-safety-trigger.txt
          git commit -m 'fix(ux): disable unsupported same-route actions'
          git push origin HEAD:ux/operational-school-erp-v1
