name: Teacher browser contract patch

on:
  push:
    branches:
      - codex/teacher-task-first-chrome-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/teacher-task-first-chrome-20260809
      - name: Update task-first gradebook browser contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/pilot-portals.spec.ts')
          text = path.read_text()
          old = "await expect(page.getByText('21 / 28')).toBeVisible();"
          new = "await expect(page.getByText(/21 of 28 entered/u)).toBeVisible();"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Teacher gradebook browser expectation not found')
          PY
          npx prettier --write tests/browser/pilot-portals.spec.ts
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then exit 0; fi
          test "$changed" = "tests/browser/pilot-portals.spec.ts"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser/pilot-portals.spec.ts
          git commit -m "test(teacher): assert task-first gradebook progress"
          git push origin HEAD:codex/teacher-task-first-chrome-20260809
