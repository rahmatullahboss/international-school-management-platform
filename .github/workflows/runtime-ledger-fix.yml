name: Runtime ledger fix

on:
  push:
    branches:
      - codex/admissions-operational-lifecycle-ui-20260810

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admissions-operational-lifecycle-ui-20260810
      - name: Update production runtime ledger expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/verify-production-runtime.sh')
          text = path.read_text()
          old = "IF (SELECT count(*) FROM platform.schema_migration) <> 59 THEN\n    RAISE EXCEPTION 'expected 59 total migration ledger rows after production hardening';"
          new = "IF (SELECT count(*) FROM platform.schema_migration) <> 60 THEN\n    RAISE EXCEPTION 'expected 60 total migration ledger rows after production hardening';"
          if old not in text:
              raise SystemExit('stale production ledger expectation not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit verifier correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/verify-production-runtime.sh
          git commit -m "test(runtime): account for admissions lifecycle migration"
          git push origin HEAD:codex/admissions-operational-lifecycle-ui-20260810
