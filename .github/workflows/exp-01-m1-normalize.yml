name: EXP-01 Milestone 1 Normalize

on:
  push:
    branches:
      - module/experience-portals-reporting
    paths:
      - .github/workflows/exp-01-m1-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/experience-portals-reporting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Generate lockfile and canonical formatting
        run: |
          npm install --package-lock-only --ignore-scripts
          npx prettier --write \
            packages/modules/documents-experience \
            apps/web-admin/package.json \
            apps/web-admin/tsconfig.json \
            apps/web-admin/src/features/experience \
            apps/web-teacher \
            apps/web-family/package.json \
            apps/web-family/tsconfig.json \
            apps/web-family/src/features/experience \
            apps/web-student \
            tests/experience \
            docs/modules/experience \
            tsconfig.json \
            package-lock.json
      - name: Verify focused checkpoint
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/experience/persona-shells.test.tsx
      - name: Commit generated normalization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package-lock.json \
            packages/modules/documents-experience \
            apps/web-admin/package.json \
            apps/web-admin/tsconfig.json \
            apps/web-admin/src/features/experience \
            apps/web-teacher \
            apps/web-family/package.json \
            apps/web-family/tsconfig.json \
            apps/web-family/src/features/experience \
            apps/web-student \
            tests/experience \
            docs/modules/experience \
            tsconfig.json
          git commit -m "style(EXP-01): normalize persona foundation"
          git pull --rebase origin module/experience-portals-reporting
          git push origin HEAD:module/experience-portals-reporting
