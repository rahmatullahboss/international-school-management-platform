name: One-shot guardian empty focus CSS

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'codex/guardian-core-route-workflows-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Exclude empty home focus from route hiding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web-family/src/features/experience/guardian-household-workspace.css')
          text = path.read_text()
          old = '[data-focus] > * {'
          new = ":is([data-focus='applications'], [data-focus='children'], [data-focus='attendance'], [data-focus='grades'], [data-focus='finance'], [data-focus='forms'], [data-focus='documents'], [data-focus='messages']) > * {"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one generic focus selector, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git diff --name-only)" = "apps/web-family/src/features/experience/guardian-household-workspace.css"
          git diff --check
      - name: Commit CSS fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-family/src/features/experience/guardian-household-workspace.css
          git commit -m 'style(guardian): preserve home dashboard with empty focus'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
