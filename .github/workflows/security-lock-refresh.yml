name: Security Lock Refresh

on:
  push:
    branches:
      - chore/security-dependency-refresh

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high
      - name: Commit generated lockfile and remove helper workflow
        run: |
          rm .github/workflows/security-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/security-lock-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(security): regenerate audited dependency lockfile"
          git push
