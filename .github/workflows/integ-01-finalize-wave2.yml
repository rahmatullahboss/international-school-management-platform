name: INTEG-01 Finalize Wave 2 Evidence

on:
  push:
    branches:
      - integration/international-school-platform-v1
    paths:
      - .github/workflows/integ-01-finalize-wave2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/international-school-platform-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Record reviewed Wave 2 integration evidence
        env:
          REVIEWED_SHA: 60836a8fe92f64ba581c4bde65005729d1fe14b2
          ROOT_CI_RUN: '30437010804'
          NEON_GATE_RUN: '30437011092'
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          reviewed = os.environ['REVIEWED_SHA']
          root_ci = os.environ['ROOT_CI_RUN']
          neon_run = os.environ['NEON_GATE_RUN']

          tracker_path = Path('docs/execution/04-progress-tracker.md')
          tracker = tracker_path.read_text(encoding='utf-8')

          replacements = {
              "**Current repository state:** Wave 2 module implementation and review are complete. Reviewed candidates are `ACAD-01` `1d895afdf51f6d4f6323ada4b93d9ba32b244480`, `OPS-01` `fc749d7c0ece36964da8f923431bb3b7ac925e56` and `CARE-01` `9304bd6c425eca4ec69db90c1f1cab3f7a409b8d`. `INTEG-01` is ready to perform serial Wave 2 integration; `GATE-WAVE-2-INTEGRATED` remains blocked until migration composition, restricted-record boundaries and recovery rehearsal pass.": f"**Current repository state:** Wave 2 serial integration is complete and `GATE-WAVE-2-INTEGRATED` passed at reviewed integration SHA `{reviewed}`. Exact reviewed `ACAD-01`, `OPS-01` and `CARE-01` candidates are integrated with coordinator-owned shared-file resolutions only. `EXP-01` is ready to execute from this exact reviewed Wave 2 base.",
              "| `GATE-WAVE-2-INTEGRATED` | blocked | `ACAD-01`, `OPS-01`, `CARE-01` reviewed and integrated |": f"| `GATE-WAVE-2-INTEGRATED` | passed | Reviewed integration SHA `{reviewed}`; root CI `{root_ci}` passed full verification, fresh 40-migration PostgreSQL replay, live Neon driver and browser suites; Wave 2 Neon apply/recovery run `{neon_run}` passed exact branch identity, canonical apply, RLS/finance/tenant verification and disposable database replay |",
              "Current readiness: `ACAD-01`, `OPS-01` and `CARE-01` are complete and reviewed. `INTEG-01` may now consume only the exact frozen Wave 2 SHAs recorded here. `EXP-01` remains blocked until `GATE-WAVE-2-INTEGRATED` passes.": f"Current readiness: `GATE-WAVE-2-INTEGRATED` has passed. `EXP-01` may now start only from reviewed Wave 2 integration SHA `{reviewed}`. `INTEG-01` waits for the reviewed `EXP-01` candidate before Wave 3 integration.",
              "| `ACAD-01` | 2 | complete; reviewed; waiting integration | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `1d895afdf51f6d4f6323ada4b93d9ba32b244480`; PR `#7` green | none |": "| `ACAD-01` | 2 | complete; reviewed; integrated by `INTEG-01` | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `1d895afdf51f6d4f6323ada4b93d9ba32b244480`; integration merge `7a6dee6136721801cb5fe0758f5a65adce90da31` | none |",
              "| `OPS-01` | 2 | complete; reviewed; waiting integration | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `fc749d7c0ece36964da8f923431bb3b7ac925e56`; final branch CI `30419451935` green | none |": "| `OPS-01` | 2 | complete; reviewed; integrated by `INTEG-01` | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `fc749d7c0ece36964da8f923431bb3b7ac925e56`; integration merge `51c714c06c16e15c1ced866980b56b04e1889932` | none |",
              "| `CARE-01` | 2 | complete; reviewed; waiting integration | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `9304bd6c425eca4ec69db90c1f1cab3f7a409b8d`; draft PR `#19` final-head CI `30427728682` green | integration-owned conflict resolution and fresh disposable recovery rehearsal |": "| `CARE-01` | 2 | complete; reviewed; integrated by `INTEG-01` | `8cc8ee1562ade672b14c1c44af935fe7e2307976` | complete | reviewed head `9304bd6c425eca4ec69db90c1f1cab3f7a409b8d`; integration merge `af8a58d79053882e3e5c41610f68c9e95f5f119c`; recovery passed | none |",
              "| `EXP-01` | 3 | blocked | reviewed Wave 2 integration SHA | persona shells | none | `GATE-WAVE-2-INTEGRATED` |": f"| `EXP-01` | 3 | ready | `{reviewed}` | persona shells | reviewed Wave 2 gate passed | none |",
              "| `INTEG-01` | gated serial | ready for Wave 2 integration | integration branch head `ec921ea26f6980017f848bfd6646a77868bd4cb1` | serially integrate reviewed ACAD, OPS and CARE SHAs | reviewed Wave 1 integration `8cc8ee1562ade672b14c1c44af935fe7e2307976` | `GATE-WAVE-2-INTEGRATED` verification pending |": f"| `INTEG-01` | gated serial | Wave 2 integrated; gate passed | `ec921ea26f6980017f848bfd6646a77868bd4cb1` | wait for reviewed `EXP-01`, then perform Wave 3 integration | reviewed Wave 2 integration `{reviewed}` | `EXP-01` completion |",
          }

          for old, new in replacements.items():
              count = tracker.count(old)
              if count != 1:
                  raise SystemExit(f'tracker replacement expected once, found {count}: {old[:80]}')
              tracker = tracker.replace(old, new)

          evidence_section = f"""

          ## INTEG-01 Wave 2 integration evidence

          Date/time: 2026-07-29T14:53:09+06:00
          Stream: INTEG-01
          Milestone completed: Wave 2 serial integration, database recovery verification and system verification
          Git branch: `integration/international-school-platform-v1`
          Worktree: `.worktrees/integ-01-release`
          Neon branch: `integration/international-school-platform-v1` (`br-shiny-silence-axznuy37`), project `lingering-brook-52999532`
          Starting base: reviewed Wave 1 integration branch head `ec921ea26f6980017f848bfd6646a77868bd4cb1`; frozen module base `8cc8ee1562ade672b14c1c44af935fe7e2307976`
          Checkpoint SHA: `{reviewed}`
          Reviewed inputs: ACAD-01 `1d895afdf51f6d4f6323ada4b93d9ba32b244480`; OPS-01 `fc749d7c0ece36964da8f923431bb3b7ac925e56`; CARE-01 `9304bd6c425eca4ec69db90c1f1cab3f7a409b8d`
          Changed integration-owned paths: serial merge/conflict resolutions, shared module TypeScript composition, canonical 40-migration manifest and verifier, Wave 2 cross-module journey tests, root CI and Neon recovery gate, release evidence; reviewed module implementations were not casually rewritten
          Focused checks and results: root CI `{root_ci}` PASS — format, lint, architecture boundaries, typecheck, full tests, fresh PostgreSQL replay of all 40 migrations with RLS/policy assertions, secret-backed live Neon driver, build, dependency audit, licence/provenance, Chromium browser suites including restricted student support and execution-artifact validation; cross-module journeys cover academic roster to duplicate-safe attendance, HR contract to balanced finance journal, activity enrolment to idempotent charge and masked/audited safeguarding reads
          Database and recovery evidence: Neon run `{neon_run}` PASS — exact project/branch identity, canonical Wave 2 apply, 40/40 migration ledger verification, tenant RLS/policy and finance invariant checks, tenant isolation probes, fresh disposable database replay from zero and safe cleanup
          Gate outcome: `GATE-WAVE-2-INTEGRATED` passed
          Exact next milestone: start `EXP-01` from exact reviewed Wave 2 integration SHA `{reviewed}`; after its reviewed completion, resume `INTEG-01` for Wave 3 integration
          Dirty/uncommitted state: no integration branch changes outside committed evidence; existing local worktrees were not reset, discarded or overwritten
          Production mutation performed: no; only the dedicated integration Neon branch and a disposable recovery database were used
          """
          if '## INTEG-01 Wave 2 integration evidence' not in tracker:
              tracker = tracker.rstrip() + evidence_section
          tracker_path.write_text(tracker.rstrip() + '\n', encoding='utf-8')

          board_path = Path('docs/execution/03-agent-board.json')
          board = json.loads(board_path.read_text(encoding='utf-8'))
          board['updated_at'] = '2026-07-29'
          board.setdefault('reviewed_bases', {})['wave_2'] = reviewed
          reviewed_shas = board.setdefault('reviewed_stream_shas', {})
          reviewed_shas['wave_2_integration_base'] = 'ec921ea26f6980017f848bfd6646a77868bd4cb1'
          reviewed_shas['wave_2_integration'] = reviewed

          statuses = {
              'ACAD-01': 'complete_and_integrated',
              'OPS-01': 'complete_and_integrated',
              'CARE-01': 'complete_and_integrated',
              'EXP-01': 'ready_for_execution',
              'INTEG-01': 'wave_2_integrated',
          }
          for stream in board['streams']:
              stream_id = stream['id']
              if stream_id in statuses:
                  stream['status'] = statuses[stream_id]
              if stream_id == 'EXP-01':
                  stream['reviewed_base'] = reviewed
              if stream_id == 'INTEG-01':
                  stream['reviewed_wave_2_sha'] = reviewed
          board_path.write_text(json.dumps(board, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          evidence = f"""# Wave 2 Integration Release Evidence

          **Program:** `international-school-platform-v1`
          **Gate:** `GATE-WAVE-2-INTEGRATED` — passed
          **Reviewed integration SHA:** `{reviewed}`
          **Integration PR:** `#25`
          **Date:** 2026-07-29

          ## Reviewed inputs

          - ACAD-01: `1d895afdf51f6d4f6323ada4b93d9ba32b244480`
          - OPS-01: `fc749d7c0ece36964da8f923431bb3b7ac925e56`
          - CARE-01: `9304bd6c425eca4ec69db90c1f1cab3f7a409b8d`
          - Shared Wave 1 module base: `8cc8ee1562ade672b14c1c44af935fe7e2307976`

          The candidates were integrated serially in ACAD, OPS, CARE order. Conflict handling was limited to coordinator-owned execution files and shared TypeScript/migration composition. Reviewed module implementation paths were preserved.

          ## System verification

          Root CI run `{root_ci}` passed:

          - formatting, lint and architecture boundaries;
          - TypeScript typecheck and full test suite;
          - cross-module academic attendance, staff/finance, activity charging and restricted CARE authorization/read-audit journeys;
          - fresh PostgreSQL replay of the canonical 40-migration manifest with ledger, schema, forced-RLS and policy assertions;
          - secret-backed live Neon serverless-driver test;
          - build, high-severity dependency audit, licence checks and deterministic provenance;
          - Chromium browser suites, including restricted student-support UI;
          - execution-artifact validation.

          ## Neon apply and recovery

          Neon gate run `{neon_run}` passed against project `lingering-brook-52999532`, integration branch `br-shiny-silence-axznuy37`:

          - exact project and branch identity verification;
          - canonical Wave 2 apply and 40/40 migration-ledger verification;
          - forced tenant RLS and `app_runtime` policy verification;
          - finance posting-function, immutability-trigger and balanced-journal checks;
          - rollback-only cross-tenant read/write probes;
          - fresh disposable database replay from zero, repeat verification and safe database cleanup.

          No production deployment, production database mutation, active branch deletion, worktree reset or destructive cleanup was performed.

          ## Gate decision

          `GATE-WAVE-2-INTEGRATED` is passed at `{reviewed}`. `EXP-01` is released and must use this exact reviewed SHA as its base. `GATE-PILOT-READY` remains blocked until EXP-01, Wave 3 integration and final system/recovery verification complete.
          """
          Path('docs/execution/07-wave-2-integration-release-evidence.md').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in evidence.splitlines()).strip() + '\n',
              encoding='utf-8',
          )
          PY
          npx prettier --write \
            docs/execution/03-agent-board.json \
            docs/execution/04-progress-tracker.md \
            docs/execution/07-wave-2-integration-release-evidence.md
      - name: Validate and commit evidence
        run: |
          python3 scripts/validate_execution_artifacts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/execution/03-agent-board.json \
            docs/execution/04-progress-tracker.md \
            docs/execution/07-wave-2-integration-release-evidence.md
          git commit -m "docs(INTEG-01): pass Wave 2 integration gate"
          git pull --rebase origin integration/international-school-platform-v1
          git push origin HEAD:integration/international-school-platform-v1
