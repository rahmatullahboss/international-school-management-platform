name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  author-pilot-12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply guarded PILOT-12 authoring patch
        run: python3 scripts/author_pilot_12.py
      - run: npm run format
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify AUTH post-integration migrations and projection monitoring contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:auth-migrations
      - name: Verify live Neon serverless driver
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - run: npm run build
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
      - name: Publish verified PILOT-12 implementation
        shell: bash
        run: |
          set -euo pipefail
          initial_head="$(git rev-parse HEAD)"
          test "$initial_head" = "${{ github.event.pull_request.head.sha }}"
          rm scripts/author_pilot_12.py
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git add .github/workflows/ci.yml \
            apps/platform-api/src/index.ts \
            apps/platform-api/src/runtime-projection-operations-monitor.test.ts \
            apps/platform-api/src/runtime-projection-operations-monitor.ts \
            apps/platform-api/src/database-projection-operations-monitor-store.test.ts \
            apps/platform-api/src/database-projection-operations-monitor-store.ts \
            infra/database/post-integration-migration-manifest.json \
            infra/database/post-integration-migrations/202608010401_PILOT-12_runtime_projection_operations_monitor.sql \
            tests/integration/verify-auth-durable-context.sh \
            scripts/author_pilot_12.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(pilot): implement projection operations monitor"
          remote_head="$(git ls-remote origin "refs/heads/${{ github.head_ref }}" | cut -f1)"
          test "$remote_head" = "$initial_head"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
