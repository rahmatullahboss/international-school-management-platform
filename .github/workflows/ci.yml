name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  author-operator-request-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply exact request-integrity patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/platform-api/src/pilot-operator-api.ts')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one marker, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "function auditKey(role: PilotOperatorRole, idempotencyKey: string): string {\n  return `${PILOT_OPERATOR_TENANT_ID}|${PILOT_OPERATOR_CAMPUS_ID}|${role}|${idempotencyKey}`;\n}",
              "function auditKey(\n  role: PilotOperatorRole,\n  command: string,\n  idempotencyKey: string,\n): string {\n  return `${PILOT_OPERATOR_TENANT_ID}|${PILOT_OPERATOR_CAMPUS_ID}|${role}|${command}|${idempotencyKey}`;\n}",
          )

          replace_once(
              "  const tenantId = body?.tenantId;\n  const campusId = body?.campusId;\n  const reason = body?.reason;\n  if (\n    idempotencyKey === undefined ||",
              "  const tenantId = body?.tenantId;\n  const campusId = body?.campusId;\n  const reason = body?.reason;\n  const bodyKeys = body === undefined ? [] : Object.keys(body);\n  const hasExactBodyShape =\n    bodyKeys.length === 3 &&\n    bodyKeys.every((key) => key === 'tenantId' || key === 'campusId' || key === 'reason');\n  if (\n    !hasExactBodyShape ||\n    idempotencyKey === undefined ||",
          )

          replace_once(
              "    typeof reason !== 'string' ||\n    reason.trim() !== reason ||\n    reason.length < 1 ||\n    reason.length > 500\n  ) {",
              "    typeof reason !== 'string' ||\n    reason.trim() !== reason ||\n    reason.length < 1 ||\n    reason.length > 500 ||\n    /[\\u0000-\\u001F\\u007F]/u.test(reason)\n  ) {",
          )

          replace_once(
              "  const key = auditKey(role, idempotencyKey);\n  const existing = receiptByIdempotencyKey.get(key);\n  if (existing !== undefined) {\n    return jsonResponse({ schemaVersion: 1, replayed: true, receipt: existing }, 200, corsHeaders);\n  }",
              "  const key = auditKey(role, command, idempotencyKey);\n  const existing = receiptByIdempotencyKey.get(key);\n  if (existing !== undefined) {\n    if (existing.reason !== reason) {\n      return jsonResponse(\n        {\n          error: {\n            code: 'pilot_idempotency_conflict',\n            message: 'The idempotency key is already bound to a different command request.',\n          },\n        },\n        409,\n        corsHeaders,\n      );\n    }\n    return jsonResponse({ schemaVersion: 1, replayed: true, receipt: existing }, 200, corsHeaders);\n  }",
          )

          path.write_text(text)
          PY
          npx prettier --write apps/platform-api/src/pilot-operator-api.ts
          git diff --check
          npx vitest run apps/platform-api/src/pilot-operator-api.test.ts
      - name: Publish request-integrity hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-api/src/pilot-operator-api.ts
          git commit -m 'fix(e2e): bind operator idempotency to exact request'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
