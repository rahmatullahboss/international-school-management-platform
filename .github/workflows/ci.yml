name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/exp-01-m2-ci-fix
          fetch-depth: 0
      - name: Apply deterministic EXP-01 fix and restore canonical CI
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('apps/web-admin/src/features/experience/AdminOperationsHome.tsx')
          source = source_path.read_text(encoding='utf-8')
          old_sort = (
              "  return exceptions\n"
              "    .filter((item) => hasCapability(capabilities, item.capability))\n"
              "    .toSorted((left, right) => {\n"
              "      const severityDifference = severityOrder[left.severity] - severityOrder[right.severity];\n"
              "      if (severityDifference !== 0) return severityDifference;\n"
              "      if (left.dueAt === undefined) return 1;\n"
              "      if (right.dueAt === undefined) return -1;\n"
              "      return left.dueAt.localeCompare(right.dueAt);\n"
              "    });\n"
          )
          new_sort = (
              "  const permitted = exceptions.filter((item) =>\n"
              "    hasCapability(capabilities, item.capability),\n"
              "  );\n"
              "  return [...permitted].sort((left, right) => {\n"
              "    const severityDifference = severityOrder[left.severity] - severityOrder[right.severity];\n"
              "    if (severityDifference !== 0) return severityDifference;\n"
              "    if (left.dueAt === undefined) return 1;\n"
              "    if (right.dueAt === undefined) return -1;\n"
              "    return left.dueAt.localeCompare(right.dueAt);\n"
              "  });\n"
          )
          if source.count(old_sort) != 1:
              raise SystemExit('selectAdminExceptions target missing or ambiguous')
          source = source.replace(old_sort, new_sort)

          old_bulk = (
              "  if (actions === undefined || selectedIds === undefined || selectedIds.length === 0) return [];\n"
              "  const selected = exceptions.filter((item) => selectedIds.includes(item.id));\n"
              "  const selectedGroups = new Set(selected.map((item) => item.bulkGroup).filter(Boolean));\n"
              "  return actions.filter(\n"
              "    (action) =>\n"
              "      selectedGroups.size === 1 &&\n"
              "      selectedGroups.has(action.group) &&\n"
              "      capabilities.includes(action.capability),\n"
              "  );\n"
          )
          new_bulk = (
              "  if (actions === undefined || selectedIds === undefined || selectedIds.length === 0) return [];\n"
              "  const selected = exceptions.filter((item) => selectedIds.includes(item.id));\n"
              "  if (selected.length !== selectedIds.length) return [];\n\n"
              "  return actions.filter(\n"
              "    (action) =>\n"
              "      capabilities.includes(action.capability) &&\n"
              "      selected.every(\n"
              "        (item) =>\n"
              "          item.bulkGroup === action.group && item.bulkCapability === action.capability,\n"
              "      ),\n"
              "  );\n"
          )
          if source.count(old_bulk) != 1:
              raise SystemExit('selectAdminBulkActions target missing or ambiguous')
          source_path.write_text(source.replace(old_bulk, new_bulk), encoding='utf-8')

          test_path = Path('tests/experience/admin-workflows.test.tsx')
          tests = test_path.read_text(encoding='utf-8')
          old_test = (
              "    expect(\n"
              "      selectAdminBulkActions(actions, exceptions, ['care-1'], ['attendance.bulk-remind']),\n"
              "    ).toEqual([]);\n"
              "  });\n"
          )
          new_test = (
              "    expect(\n"
              "      selectAdminBulkActions(actions, exceptions, ['care-1'], ['attendance.bulk-remind']),\n"
              "    ).toEqual([]);\n"
              "    expect(\n"
              "      selectAdminBulkActions(\n"
              "        actions,\n"
              "        exceptions,\n"
              "        ['attendance-1', 'care-1'],\n"
              "        ['attendance.bulk-remind'],\n"
              "      ),\n"
              "    ).toEqual([]);\n"
              "    expect(\n"
              "      selectAdminBulkActions(actions, exceptions, ['attendance-1', 'missing-id'], [\n"
              "        'attendance.bulk-remind',\n"
              "      ]),\n"
              "    ).toEqual([]);\n"
              "  });\n"
          )
          if tests.count(old_test) != 1:
              raise SystemExit('bulk safety test target missing or ambiguous')
          test_path.write_text(tests.replace(old_test, new_test), encoding='utf-8')
          PY
          rm -f .github/workflows/exp-01-m2-lint-safety-fix.yml
          git fetch origin module/experience-portals-reporting --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          npx prettier --write \
            apps/web-admin/src/features/experience/AdminOperationsHome.tsx \
            tests/experience/admin-workflows.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/exp-01-m2-lint-safety-fix.yml \
            apps/web-admin/src/features/experience/AdminOperationsHome.tsx \
            tests/experience/admin-workflows.test.tsx
          git commit -m "fix(EXP-01): harden admin sorting and bulk selection"
          git push origin HEAD:module/exp-01-m2-ci-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify live Neon serverless driver
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
