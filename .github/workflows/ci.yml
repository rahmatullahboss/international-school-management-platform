name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Format finance primitive coverage test for branch repair
        run: npx prettier --write packages/modules/billing/src/contracts/primitives-coverage.test.ts
      - name: Upload formatted finance primitive coverage test
        uses: actions/upload-artifact@v4
        with:
          name: formatted-finance-primitives
          path: packages/modules/billing/src/contracts/primitives-coverage.test.ts
          retention-days: 1
      - name: Stop until formatted source is committed
        run: git diff --exit-code -- packages/modules/billing/src/contracts/primitives-coverage.test.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - name: Run application tests with runtime coverage
        run: npm run test:coverage
      - name: Upload runtime coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify AUTH post-integration migrations and revocation contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:auth-migrations
      - name: Verify all product persona authorization and persisted mutation E2E
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:persona-e2e
      - name: Verify live Neon serverless driver
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - run: npm run build
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
