name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  author-pilot-09-capability-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply guarded teacher capability fix
        run: python3 scripts/fix_pilot_09_teacher_capabilities.py
      - name: Restore canonical workflow and remove authoring helper
        run: |
          rm scripts/fix_pilot_09_teacher_capabilities.py
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/ci.yml" > .github/workflows/ci.yml
      - name: Validate exact authoring scope
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            ".github/workflows/ci.yml"
            "infra/database/post-integration-migrations/202608010101_PILOT-09_teacher_runtime_projection_composer.sql"
            "scripts/fix_pilot_09_teacher_capabilities.py"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          test "$(grep -c "'capability', 'attendance.assigned.write'" infra/database/post-integration-migrations/202608010101_PILOT-09_teacher_runtime_projection_composer.sql)" -eq 2
          test "$(grep -c "'capability', 'gradebook.assigned.write'" infra/database/post-integration-migrations/202608010101_PILOT-09_teacher_runtime_projection_composer.sql)" -eq 3
          ! grep -q "'capability', 'attendance.manage'" infra/database/post-integration-migrations/202608010101_PILOT-09_teacher_runtime_projection_composer.sql
          ! grep -q "'capability', 'gradebook.manage'" infra/database/post-integration-migrations/202608010101_PILOT-09_teacher_runtime_projection_composer.sql
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify AUTH post-integration migrations and projection contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:auth-migrations
      - name: Verify live Neon serverless driver
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - run: npm run build
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
      - name: Publish verified PILOT-09 capability fix
        run: |
          expected_head="${{ github.event.pull_request.head.sha }}"
          remote_head="$(git ls-remote origin refs/heads/pilot/teacher-runtime-projection-composer-v1 | cut -f1)"
          test "$remote_head" = "$expected_head"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            infra/database/post-integration-migrations/202608010101_PILOT-09_teacher_runtime_projection_composer.sql \
            scripts/fix_pilot_09_teacher_capabilities.py
          git commit -m "fix(pilot): align teacher projection capabilities"
          git push origin HEAD:refs/heads/pilot/teacher-runtime-projection-composer-v1
