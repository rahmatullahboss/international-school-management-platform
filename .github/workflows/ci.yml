name: CI

on:
  push:
    branches:
      - 'integration/coverage-e2e-100-v1'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/coverage-e2e-100-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply deterministic pilot resource fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('apps/platform-web/src/pilot-resource.ts')
          source = source_path.read_text()
          old = """function resolveApiBase(): string | undefined {
            const runtimeOverride = window.__PLATFORM_API_URL__?.trim();
            if (runtimeOverride !== undefined && runtimeOverride !== '')
              return runtimeOverride.replace(/\\/$/u, '');

            const buildValue = (import.meta.env.VITE_PLATFORM_API_URL as string | undefined)?.trim();
            if (buildValue !== undefined && buildValue !== '') return buildValue.replace(/\\/$/u, '');

            if (
              window.location.hostname ===
              'international-school-platform-web-staging.rahmatullahzisan.workers.dev'
            ) {
              return 'https://international-school-platform-api-staging.rahmatullahzisan.workers.dev';
            }
            return undefined;
          }
          """
          new = """function resolveApiBase(
            runtimeValue = window.__PLATFORM_API_URL__,
            buildValue = import.meta.env.VITE_PLATFORM_API_URL as string | undefined,
            hostname = window.location.hostname,
          ): string | undefined {
            const runtimeOverride = runtimeValue?.trim();
            if (runtimeOverride !== undefined && runtimeOverride !== '')
              return runtimeOverride.replace(/\\/$/u, '');

            const buildOverride = buildValue?.trim();
            if (buildOverride !== undefined && buildOverride !== '')
              return buildOverride.replace(/\\/$/u, '');

            if (hostname === 'international-school-platform-web-staging.rahmatullahzisan.workers.dev') {
              return 'https://international-school-platform-api-staging.rahmatullahzisan.workers.dev';
            }
            return undefined;
          }
          """
          if old not in source:
              raise SystemExit('resolveApiBase source block not found')
          source_path.write_text(source.replace(old, new))

          test_path = Path('apps/platform-web/src/pilot-resource-client.test.ts')
          test = test_path.read_text()

          replacements = [
            (
              """  it('uses build-time API configuration when there is no runtime override', () => {
            vi.stubEnv('VITE_PLATFORM_API_URL', ' https://build.test/ ');
            expect(pilotResourceClientContract.resolveApiBase()).toBe('https://build.test');
          });
          """,
              """  it('uses build-time API configuration when there is no runtime override', () => {
            expect(
              pilotResourceClientContract.resolveApiBase(
                undefined,
                ' https://build.test/ ',
                'localhost',
              ),
            ).toBe('https://build.test');
          });
          """,
            ),
            (
              """    sessionStorage.failRemove = true;
            expect(() => pilotResourceClientContract.clearSession(key)).not.toThrow();
            expect(pilotResourceClientContract.readStoredSession(key, 'student')).toBeUndefined();
          });
          """,
              """    sessionStorage.failSet = false;
            sessionStorage.setItem(
              pilotResourceClientContract.sessionStorageKey(key),
              JSON.stringify(stored),
            );
            sessionStorage.failRemove = true;
            expect(() => pilotResourceClientContract.clearSession(key)).not.toThrow();
            expect(pilotResourceClientContract.readStoredSession(key, 'student')).toEqual(stored);
          });
          """,
            ),
            (
              """  it('deduplicates concurrent snapshot requests', async () => {
            let resolveSnapshot: ((response: Response) => void) | undefined;
            const deferred = new Promise<Response>((resolve) => {
              resolveSnapshot = resolve;
            });
            const fetchMock = vi
              .fn()
              .mockResolvedValueOnce(jsonResponse(sessionPayload('student')))
              .mockImplementationOnce(() => deferred);
            vi.stubGlobal('fetch', fetchMock);
            const key = pilotResourceClientContract.cacheKey(apiBase, 'student');
            const first = pilotResourceClientContract.requestSnapshot(apiBase, 'student', key, undefined);
            await Promise.resolve();
            const second = pilotResourceClientContract.requestSnapshot(apiBase, 'student', key, undefined);
            resolveSnapshot?.(jsonResponse(snapshotEnvelope('student')));
            const [left, right] = await Promise.all([first, second]);
            expect(left).toEqual(right);
            expect(fetchMock).toHaveBeenCalledTimes(2);
          });
          """,
              """  it('deduplicates concurrent snapshot requests', async () => {
            const sessionKey = pilotResourceClientContract.sessionKey(apiBase, 'student');
            pilotResourceClientContract.storeSession(
              sessionKey,
              storedSession('student', { expiresAt: now + 60_000 }),
            );
            let resolveSnapshot: ((response: Response) => void) | undefined;
            const deferred = new Promise<Response>((resolve) => {
              resolveSnapshot = resolve;
            });
            const fetchMock = vi.fn(() => deferred);
            vi.stubGlobal('fetch', fetchMock);
            const key = pilotResourceClientContract.cacheKey(apiBase, 'student');
            const first = pilotResourceClientContract.requestSnapshot(apiBase, 'student', key, undefined);
            const second = pilotResourceClientContract.requestSnapshot(apiBase, 'student', key, undefined);
            expect(fetchMock).toHaveBeenCalledTimes(1);
            resolveSnapshot?.(jsonResponse(snapshotEnvelope('student')));
            const [left, right] = await Promise.all([first, second]);
            expect(left).toEqual(right);
            expect(fetchMock).toHaveBeenCalledTimes(1);
          });
          """,
            ),
            (
              """    for (const [responses, message] of cases) {
              pilotResourceClientContract.resetMemory();
              const fetchMock = vi.fn();
          """,
              """    for (const [responses, message] of cases) {
              pilotResourceClientContract.resetMemory();
              installWindow();
              const fetchMock = vi.fn();
          """,
            ),
          ]

          for old, new in replacements:
              if old not in test:
                  raise SystemExit(f'test replacement block not found: {old[:60]!r}')
              test = test.replace(old, new)
          test_path.write_text(test)
          PY
      - run: npx prettier --write apps/platform-web/src/pilot-resource.ts apps/platform-web/src/pilot-resource-client.test.ts
      - name: Commit repaired client coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-web/src/pilot-resource.ts apps/platform-web/src/pilot-resource-client.test.ts
          git commit -m "test(web): stabilize pilot resource client coverage"
          git push origin HEAD:integration/coverage-e2e-100-v1
