name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  author-pilot-12-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply guarded PILOT-12 tracker patch
        run: python3 scripts/patch_pilot_12_tracker.py
      - name: Verify exact governance scope
        run: |
          git diff --check
          git diff -- docs/execution/04-progress-tracker.md
          test -z "$(git diff --name-only | grep -v '^docs/execution/04-progress-tracker.md$' || true)"
      - name: Publish tracker synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/execution/04-progress-tracker.md
          git commit -m 'docs(pilot): synchronize PILOT-12 governance tracker'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
