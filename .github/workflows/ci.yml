name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-pilot-13-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Canonically format test-first files
        run: |
          npx prettier --write \
            apps/platform-api/src/operator-domain-commands.test.ts \
            apps/platform-api/src/database-operator-domain-command-store.test.ts
          npx prettier --check \
            apps/platform-api/src/operator-domain-commands.test.ts \
            apps/platform-api/src/database-operator-domain-command-store.test.ts
          git diff --check
      - name: Publish formatting-only test checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- \
            apps/platform-api/src/operator-domain-commands.test.ts \
            apps/platform-api/src/database-operator-domain-command-store.test.ts; then
            echo 'Test files already canonical.'
            exit 0
          fi
          git add \
            apps/platform-api/src/operator-domain-commands.test.ts \
            apps/platform-api/src/database-operator-domain-command-store.test.ts
          git commit -m 'style(pilot): canonically format operator command tests'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
