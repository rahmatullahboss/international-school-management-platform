name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-pilot-05-migration:
    if: github.head_ref == 'pilot/safe-mutation-envelope-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/safe-mutation-envelope-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply PILOT-05 verification patch
        run: |
          python3 scripts/implement_pilot_05_http_and_verification.py
          python3 scripts/fix_pilot_05_control_validation.py
      - name: Capture concise PILOT-05 migration diagnostic
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          set +e
          npm run verify:auth-migrations > pilot-05-migration.log 2>&1
          status=$?
          set -e
          echo '--- PILOT-05 migration diagnostic ---'
          grep -n -E 'ERROR:|FATAL:|RAISE EXCEPTION|expected|must |failed|syntax error|does not exist|cannot|violates' pilot-05-migration.log | tail -n 100 || true
          echo '--- tail ---'
          tail -n 180 pilot-05-migration.log
          exit "$status"
