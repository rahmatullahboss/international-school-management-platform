name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:boundaries
      - name: Validate runtime secret boundary
        run: npm run validate:runtime-secret-boundary
      - name: Validate incident response and evidence retention policy
        run: npm run validate:incident-response-evidence-retention
      - name: Validate projection operations production policy
        run: npm run validate:projection-operations-policy
      - name: Validate production activation evidence contract
        run: npm run validate:production-activation-evidence
      - run: npm run typecheck
      - name: Run application tests with runtime coverage
        run: npm run test:coverage
      - name: Upload runtime coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify AUTH post-integration migrations and revocation contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:auth-migrations
      - name: Verify all product persona authorization and persisted mutation E2E
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:persona-e2e
      - name: Verify production runtime hardening
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-production-runtime.sh
      - name: Verify production runtime login credential identity
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-production-runtime-credential.sh
      - name: Verify production operator work queues
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-production-operator-work-queue.sh
      - name: Verify runtime projection dead-letter recovery
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:projection-recovery
      - name: Verify system-wide SECURITY DEFINER hygiene
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:security-definer-hygiene
      - name: Verify isolated database backup restore rollback
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:database-recovery
      - name: Verify PROD-08 survives isolated database recovery
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
          PROD08_RECOVERY_EPHEMERAL: '1'
        run: npm run verify:prod08-recovery
      - name: Verify admissions offer command transactions
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-admissions-offer-command.sh
      - name: Verify admissions offer acceptance and applicant conversion
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-admissions-accept-convert.sh
      - name: Verify admissions lifecycle work queue
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-admissions-lifecycle-work-queue.sh
      - name: Verify production projection worker credential boundary
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-production-projection-worker-credential.sh
      - name: Verify live Neon serverless driver
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - name: Record Dependabot live Neon boundary
        if: github.actor == 'dependabot[bot]'
        run: echo "Live Neon verification is intentionally skipped for Dependabot because repository Actions secrets are not exposed to Dependabot-triggered workflows; all secret-independent gates continue."
      - run: npm run build
      - name: Validate production Cloudflare bundles
        run: |
          (cd apps/platform-api && npx wrangler deploy --dry-run --env production --outdir /tmp/platform-api-production)
          (cd apps/platform-web && npx wrangler deploy --dry-run --env production --outdir /tmp/platform-web-production)
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
