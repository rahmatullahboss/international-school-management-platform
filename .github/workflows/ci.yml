name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-pilot-05-tests:
    if: github.head_ref == 'pilot/safe-mutation-envelope-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/safe-mutation-envelope-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted PILOT-05 tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-api/src/database-mutation-store.test.ts apps/platform-api/src/runtime-mutation.test.ts
          git commit -m 'test(pilot): format safe mutation contracts'
          git push origin HEAD:pilot/safe-mutation-envelope-v1

  verify:
    needs: format-pilot-05-tests
    if: always() && needs.format-pilot-05-tests.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canonical red verification resumes after test formatting.'
