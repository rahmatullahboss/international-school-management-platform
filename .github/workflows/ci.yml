name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  author-pilot-09-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply guarded PILOT-09 tracker closure
        run: python3 scripts/update_pilot_09_governance_tracker.py
      - run: npx prettier --check docs/execution/04-progress-tracker.md docs/execution/42-pilot-teacher-runtime-projection-composer-v1.md docs/execution/43-pilot-teacher-runtime-projection-composer-release-evidence.md
      - name: Publish governance tracker closure
        shell: bash
        run: |
          set -euo pipefail
          initial_head="$(git rev-parse HEAD)"
          test "$initial_head" = "${{ github.event.pull_request.head.sha }}"
          rm scripts/update_pilot_09_governance_tracker.py
          git add docs/execution/04-progress-tracker.md \
            scripts/update_pilot_09_governance_tracker.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(pilot): update tracker for teacher composer gate"
          remote_head="$(git ls-remote origin "refs/heads/${{ github.head_ref }}" | cut -f1)"
          test "$remote_head" = "$initial_head"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
