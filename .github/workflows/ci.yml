name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  format-pilot-04-tests:
    if: github.event_name == 'pull_request' && github.head_ref == 'pilot/database-read-models-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/database-read-models-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/platform-api/src/database-read-model-store.test.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-api/src/database-read-model-store.test.ts
          git commit -m 'style(pilot): format database read-model tests'
          git push origin HEAD:pilot/database-read-models-v1

  verify:
    needs: format-pilot-04-tests
    if: always() && needs.format-pilot-04-tests.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canonical repository verification resumes after PILOT-04 test formatting.'
