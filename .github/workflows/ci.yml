name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  sync-signed-session-board:
    if: github.event_name == 'pull_request' && github.head_ref == 'pilot/signed-session-context-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/signed-session-context-v1
          fetch-depth: 0
      - name: Synchronize machine-readable signed session state
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/execution/03-agent-board.json')
          board = json.loads(path.read_text(encoding='utf-8'))
          board['updated_at'] = '2026-07-30'
          board['program_status'] = 'pilot_runtime_signed_session_context'
          board['pilot_signed_session'] = {
              'id': 'PILOT-03',
              'status': 'gate_passed',
              'gate': 'GATE-PILOT-SIGNED-SESSION-V1',
              'branch': 'pilot/signed-session-context-v1',
              'reviewed_base_sha': 'f01cb446f8a6590e5800fba1f366e17a8eeedc2a',
              'implementation_proof_sha': '0a36ef62ec1622bdea6de7d0135bf30026845528',
              'root_ci_run': '30501350771',
              'cloudflare_deploy_run': '30501350785',
              'session_route': '/pilot/v1/sessions/:role',
              'snapshot_route': '/pilot/v1/snapshots/:role',
              'algorithm': 'HMAC-SHA256',
              'ttl_seconds': 900,
              'scope_dimensions': ['tenant', 'campus', 'role', 'subject'],
              'issuer_and_audience_verified': True,
              'server_resolved_capabilities': True,
              'browser_scope_headers_removed': True,
              'bearer_required': True,
              'session_storage': ['memory', 'sessionStorage'],
              'durable_token_storage': False,
              'renew_once_after_401': True,
              'expired_session_denied': True,
              'wrong_secret_denied': True,
              'cross_role_denied': True,
              'ephemeral_secret_per_deploy': True,
              'current_view_preserved_on_failure': True,
              'production_endpoint_enabled': False,
              'repository_tests_passed': 514,
              'browser_journeys_passed': 22,
              'synthetic_identity_only': True,
              'production_mutations_enabled': False,
              'remaining_release_gate': 'reviewed OAuth/OIDC Authorization Code with PKCE, issuer/JWKS validation, real memberships and tenant/campus resolution, database-backed policy, reviewed production browser session, logout/revocation, step-up, negative authorization tests, monitoring, backup, rollback, owner-led UAT and explicit production authorization',
          }
          path.write_text(json.dumps(board, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - run: python3 scripts/validate_execution_artifacts.py
      - name: Commit synchronized board
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/execution/03-agent-board.json
          git commit -m 'docs(pilot): synchronize signed session gate'
          git push origin HEAD:pilot/signed-session-context-v1

  verify:
    needs: sync-signed-session-board
    if: always() && needs.sync-signed-session-board.result == 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify live Neon serverless driver
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - run: npm run build
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
