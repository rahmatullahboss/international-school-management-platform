name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  author-product-persona-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize reviewed product-persona delta
        run: |
          set -euo pipefail
          SOURCE='57fc9cf4159d9040c95f92b3dcc1b10be5d1a331'
          git fetch --no-tags origin test/full-product-persona-e2e-v2
          paths=(
            apps/platform-api/src/entry.ts
            apps/platform-api/src/pilot-operator-api.ts
            apps/platform-api/src/pilot-operator-models.ts
            apps/platform-api/src/pilot-operator-sessions.ts
            apps/platform-api/wrangler.jsonc
            apps/platform-web/index.html
            apps/platform-web/src/entry.tsx
            apps/platform-web/src/operator-portal.tsx
            docs/execution/50-product-persona-e2e-v2.md
            docs/execution/51-product-persona-e2e-v2-evidence.md
            docs/execution/52-production-readiness-backlog.md
            package.json
            tests/browser/platform-api-e2e-worker.ts
            tests/browser/product-persona-v2.e2e.spec.ts
            tests/integration/verify-product-persona-e2e.sh
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE:$path" > "$path"
          done
          git diff --check
          test -z "$(git diff --name-only -- docs/execution/04-progress-tracker.md)"
          test ! -e docs/execution/48-product-persona-e2e-v2.md
          test ! -e docs/execution/49-product-persona-e2e-v2-evidence.md
          test ! -e docs/execution/50-production-readiness-backlog.md
          allowed='^(apps/platform-api/src/(entry|pilot-operator-api|pilot-operator-models|pilot-operator-sessions)\.ts|apps/platform-api/wrangler\.jsonc|apps/platform-web/index\.html|apps/platform-web/src/(entry\.tsx|operator-portal\.tsx)|docs/execution/(50-product-persona-e2e-v2|51-product-persona-e2e-v2-evidence|52-production-readiness-backlog)\.md|package\.json|tests/browser/(platform-api-e2e-worker|product-persona-v2\.e2e)\.ts|tests/integration/verify-product-persona-e2e\.sh)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { printf 'Unexpected files:\n%s\n' "$unexpected"; exit 1; }
      - name: Publish reviewed product-persona delta
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/platform-api/src/entry.ts \
            apps/platform-api/src/pilot-operator-api.ts \
            apps/platform-api/src/pilot-operator-models.ts \
            apps/platform-api/src/pilot-operator-sessions.ts \
            apps/platform-api/wrangler.jsonc \
            apps/platform-web/index.html \
            apps/platform-web/src/entry.tsx \
            apps/platform-web/src/operator-portal.tsx \
            docs/execution/50-product-persona-e2e-v2.md \
            docs/execution/51-product-persona-e2e-v2-evidence.md \
            docs/execution/52-production-readiness-backlog.md \
            package.json \
            tests/browser/platform-api-e2e-worker.ts \
            tests/browser/product-persona-v2.e2e.spec.ts \
            tests/integration/verify-product-persona-e2e.sh
          git commit -m 'feat(e2e): materialize product persona v2 delta'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
