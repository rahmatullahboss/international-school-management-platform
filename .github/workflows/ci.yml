name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  canonicalize-auth-02:
    if: github.event_name == 'pull_request' && github.head_ref == 'pilot/oidc-pkce-flow-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/oidc-pkce-flow-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Canonicalize strict AUTH-02 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('packages/policy/src/oidc-login-flow.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              "  const fetcher = vi.fn<typeof fetch>(async (input) => {\n",
              "  const fetcher = vi.fn<typeof fetch>(async (input) => {\n    await Promise.resolve();\n",
          )
          test = test.replace(
              "    consumeTransaction: async (transactionId) => {\n",
              "    consumeTransaction: async (transactionId) => {\n      await Promise.resolve();\n",
          )
          test = test.replace(
              "    resolveMembership: async () => membership,\n",
              "    resolveMembership: async () => {\n      await Promise.resolve();\n      return membership;\n    },\n",
          )
          test_path.write_text(test, encoding='utf-8')

          flow_path = Path('packages/policy/src/oidc-login-flow.ts')
          flow = flow_path.read_text(encoding='utf-8')
          flow = flow.replace(
              "    returnTo: input.returnTo,\n",
              "    ...(input.returnTo === undefined ? {} : { returnTo: input.returnTo }),\n",
          )
          flow = flow.replace(
              "    authorizationResponseIssuer: input.callback.issuer,\n",
              "    ...(input.callback.issuer === undefined\n      ? {}\n      : { authorizationResponseIssuer: input.callback.issuer }),\n",
          )
          flow_path.write_text(flow, encoding='utf-8')

          readiness_path = Path('apps/platform-api/src/auth-boundary.test.ts')
          readiness = readiness_path.read_text(encoding='utf-8').replace(
              "{ ...completeBindings, AUTH_MEMBERSHIP_SOURCE: undefined }",
              "{ ...completeBindings, AUTH_MEMBERSHIP_SOURCE: '' }",
          )
          readiness_path.write_text(readiness, encoding='utf-8')
          PY
      - run: npm run format
      - run: npm run lint -- --fix
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Commit canonical AUTH-02 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(auth): canonicalize PKCE flow contracts'
          git push origin HEAD:pilot/oidc-pkce-flow-v1

  verify:
    needs: canonicalize-auth-02
    if: always() && needs.canonicalize-auth-02.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canonical repository verification resumes after AUTH-02 formatting.'
