name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch-pilot-08-tracker:
    if: github.event.pull_request.head.ref == 'docs/pilot-admin-runtime-projection-composer-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pilot-admin-runtime-projection-composer-v1
          fetch-depth: 0
      - name: Apply guarded tracker patch
        run: |
          python3 scripts/patch_pilot_08_governance.py
          rm scripts/patch_pilot_08_governance.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit tracker update and restore canonical workflow
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(pilot): update tracker for admin composer gate'
          git push origin HEAD:refs/heads/docs/pilot-admin-runtime-projection-composer-v1
