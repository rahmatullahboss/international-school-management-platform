name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  sync-auth-05-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'docs/auth-05-cache-rotation-evidence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/auth-05-cache-rotation-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: python3 scripts/sync_auth_05_evidence.py
      - run: rm scripts/sync_auth_05_evidence.py
      - run: npm run format
      - run: python3 scripts/validate_execution_artifacts.py
      - name: Commit synchronized AUTH-05 evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(auth): synchronize provider cache rotation gate'
          git push origin HEAD:docs/auth-05-cache-rotation-evidence

  verify:
    needs: sync-auth-05-evidence
    if: always() && needs.sync-auth-05-evidence.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canonical repository verification resumes after AUTH-05 evidence synchronization.'
