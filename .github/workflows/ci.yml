name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  author-pilot-06:
    if: github.head_ref == 'pilot/runtime-projection-worker-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/runtime-projection-worker-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply PILOT-06 integration patch
        run: |
          python3 scripts/fix_pilot_06_authoring.py
          rm scripts/fix_pilot_06_authoring.py
          python3 scripts/implement_pilot_06.py
          rm scripts/implement_pilot_06.py
          python3 scripts/harden_pilot_06_runtime.py
          rm scripts/harden_pilot_06_runtime.py
      - run: npm run format
      - run: npx eslint . --fix
      - run: npm run format
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify post-integration migrations and projection processing
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:auth-migrations
      - name: Verify live Neon serverless driver
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - run: npm run build
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
      - name: Commit verified PILOT-06 runtime
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(pilot): complete durable runtime projection worker'
          git push origin HEAD:pilot/runtime-projection-worker-v1

  verify:
    needs: author-pilot-06
    if: always() && needs.author-pilot-06.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canonical verification resumes after PILOT-06 authoring.'
