name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  sync-pilot-read-board:
    if: github.event_name == 'pull_request' && github.head_ref == 'pilot/permission-aware-read-api-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/permission-aware-read-api-v1
          fetch-depth: 0
      - name: Synchronize machine-readable pilot state
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/execution/03-agent-board.json')
          board = json.loads(path.read_text(encoding='utf-8'))
          board['updated_at'] = '2026-07-30'
          board['program_status'] = 'pilot_runtime_scoped_read_api'
          board['pilot_read_api'] = {
              'id': 'PILOT-02',
              'status': 'gate_passed',
              'gate': 'GATE-PILOT-READ-API-V1',
              'branch': 'pilot/permission-aware-read-api-v1',
              'implementation_proof_sha': '73be1c1eb0418c8c2f744729354bd9f1a63467b0',
              'root_ci_run': '30495509757',
              'cloudflare_deploy_run': '30495509773',
              'api_route': '/pilot/v1/snapshots/:role',
              'scope_dimensions': ['api-origin', 'tenant', 'campus', 'role', 'subject'],
              'server_resolved_capabilities': True,
              'etag_revalidation': True,
              'private_cache_control': True,
              'current_view_preserved_during_refresh': True,
              'last_safe_snapshot_preserved_on_failure': True,
              'production_endpoint_enabled': False,
              'repository_tests_passed': 509,
              'browser_journeys_passed': 22,
              'synthetic_data_only': True,
              'production_mutations_enabled': False,
              'remaining_release_gate': 'reviewed OAuth/OIDC and tenant/campus context, database-backed policy evaluation, tenant-safe server cache isolation, approved staging seed/reset tooling, safe mutations, live negative tests, monitoring, backup, rollback, owner-led UAT and explicit production authorization',
          }
          path.write_text(json.dumps(board, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - run: python3 scripts/validate_execution_artifacts.py
      - name: Commit synchronized board
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/execution/03-agent-board.json
          git commit -m 'docs(pilot): synchronize scoped read API gate'
          git push origin HEAD:pilot/permission-aware-read-api-v1

  verify:
    needs: sync-pilot-read-board
    if: always() && (needs.sync-pilot-read-board.result == 'success' || needs.sync-pilot-read-board.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify live Neon serverless driver
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - run: npm run build
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
