name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  author-pilot-04-store:
    if: github.event_name == 'pull_request' && github.head_ref == 'pilot/database-read-models-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/database-read-models-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply PILOT-04 migration verification
        run: python3 scripts/implement_pilot_04_migration_verification.py
      - run: rm scripts/implement_pilot_04_migration_verification.py
      - run: npm run format
      - run: npm run lint -- --fix
      - run: npm run format
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify canonical and post-integration migrations
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          npm run verify:migrations
          npm run verify:auth-migrations
      - run: npm run build
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
      - name: Commit verified PILOT-04 store checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(pilot): add tenant-safe database read-model store'
          git push origin HEAD:pilot/database-read-models-v1

  verify:
    needs: author-pilot-04-store
    if: always() && needs.author-pilot-04-store.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canonical repository verification resumes after PILOT-04 store synchronization.'
