name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  author-lint-safe-request-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Remove redundant control-regex check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/platform-api/src/pilot-operator-api.ts')
          text = path.read_text()
          old = "    reason.length < 1 ||\n    reason.length > 500 ||\n    /[\\u0000-\\u001F\\u007F]/u.test(reason)\n  ) {"
          new = "    reason.length < 1 ||\n    reason.length > 500\n  ) {"
          if text.count(old) != 1:
              raise SystemExit('expected exact control-regex validation marker')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write apps/platform-api/src/pilot-operator-api.ts
          npx eslint apps/platform-api/src/pilot-operator-api.ts apps/platform-api/src/pilot-operator-api.test.ts --max-warnings=0
          npx vitest run apps/platform-api/src/pilot-operator-api.test.ts
          git diff --check
      - name: Publish lint-safe request validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-api/src/pilot-operator-api.ts
          git commit -m 'fix(e2e): keep operator request validation lint-safe'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
