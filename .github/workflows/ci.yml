name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-pilot-04-migration:
    if: github.head_ref == 'pilot/database-read-models-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Apply PILOT-04 verification patch
        run: python3 scripts/implement_pilot_04_migration_verification.py
      - name: Capture concise migration diagnostic
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          set +e
          npm run verify:auth-migrations > pilot-04-migration.log 2>&1
          status=$?
          set -e
          echo '--- PILOT-04 migration diagnostic ---'
          tail -n 160 pilot-04-migration.log
          exit "$status"
