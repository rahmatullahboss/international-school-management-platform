name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Canonically format production-candidate files for verification
        if: github.event_name == 'pull_request' && github.head_ref == 'prod/demo-school-production-readiness'
        run: |
          npx prettier --write \
            apps/platform-api/src/auth-login-routes.ts \
            apps/platform-api/src/database-workspace-store.ts \
            apps/platform-api/src/database-workspace-store.test.ts \
            apps/platform-api/src/production-boundary.test.ts \
            apps/platform-web/src/pilot-resource.ts \
            apps/platform-web/src/production-gateway.tsx \
            apps/platform-web/src/production-operator-portal.tsx
          git diff -- \
            apps/platform-api/src/auth-login-routes.ts \
            apps/platform-api/src/database-workspace-store.ts \
            apps/platform-api/src/database-workspace-store.test.ts \
            apps/platform-api/src/production-boundary.test.ts \
            apps/platform-web/src/pilot-resource.ts \
            apps/platform-web/src/production-gateway.tsx \
            apps/platform-web/src/production-operator-portal.tsx
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify AUTH post-integration migrations and revocation contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:auth-migrations
      - name: Verify all product persona authorization and persisted mutation E2E
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:persona-e2e
      - name: Verify production runtime hardening
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-production-runtime.sh
      - name: Verify live Neon serverless driver
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - run: npm run build
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
