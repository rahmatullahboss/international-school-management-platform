name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  canonicalize-auth-04:
    if: github.event_name == 'pull_request' && github.head_ref == 'pilot/auth-session-termination-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/auth-session-termination-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Remove duplicate durable-store construction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/platform-api/src/index.ts')
          source = path.read_text(encoding='utf-8')
          old = """  const result = await terminateBrowserSession({
    sessionSecret: context.env.AUTH_SESSION_SECRET,
    registrySource: context.env.AUTH_SESSION_REGISTRY_SOURCE,
    allowedOrigins: context.env.AUTH_ALLOWED_WEB_ORIGINS,
    origin,
    contentType: context.req.header('content-type'),
    cookieHeader: context.req.header('cookie'),
    scope,
    ...(durableLogoutRegistry(context.env) === undefined
      ? {}
      : { registry: durableLogoutRegistry(context.env) }),
  });
"""
          new = """  const registry = durableLogoutRegistry(context.env);
  const result = await terminateBrowserSession({
    sessionSecret: context.env.AUTH_SESSION_SECRET,
    registrySource: context.env.AUTH_SESSION_REGISTRY_SOURCE,
    allowedOrigins: context.env.AUTH_ALLOWED_WEB_ORIGINS,
    origin,
    contentType: context.req.header('content-type'),
    cookieHeader: context.req.header('cookie'),
    scope,
    ...(registry === undefined ? {} : { registry }),
  });
"""
          if old not in source:
              raise SystemExit('Expected logout registry construction was not found.')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - run: npm run format
      - run: npm run lint -- --fix
      - run: npm run format
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify canonical and AUTH post-integration migrations
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          npm run verify:migrations
          npm run verify:auth-migrations
      - name: Commit canonical AUTH-04 checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(auth): verify session termination boundary'
          git push origin HEAD:pilot/auth-session-termination-v1

  verify:
    needs: canonicalize-auth-04
    if: always() && needs.canonicalize-auth-04.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canonical repository verification resumes after AUTH-04 synchronization.'
