name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/exp-01-m5-student
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Format student milestone and restore canonical CI
        run: |
          npx prettier --write \
            apps/web-student/src/features/experience/StudentDailyWorkspace.tsx \
            apps/web-student/src/features/experience/student-daily-workspace.css \
            apps/web-student/src/features/experience/index.ts \
            apps/web-student/src/css.d.ts \
            tests/experience/student-workflows.test.tsx \
            docs/modules/experience/milestone-5-student-experience.md
          git fetch origin module/experience-portals-reporting --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            apps/web-student/src/features/experience/StudentDailyWorkspace.tsx \
            apps/web-student/src/features/experience/student-daily-workspace.css \
            apps/web-student/src/features/experience/index.ts \
            apps/web-student/src/css.d.ts \
            tests/experience/student-workflows.test.tsx \
            docs/modules/experience/milestone-5-student-experience.md
          git commit -m "style(EXP-01): format student milestone"
          git push origin HEAD:module/exp-01-m5-student
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify live Neon serverless driver
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py
