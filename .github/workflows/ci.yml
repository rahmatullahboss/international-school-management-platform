name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify all Wave 2 migrations on fresh PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:migrations
      - name: Verify AUTH post-integration migrations and revocation contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:auth-migrations
      - name: Verify all product persona authorization and persisted mutation E2E
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:persona-e2e
      - name: Verify production runtime hardening
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-production-runtime.sh
      - name: Verify production runtime login credential identity
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-production-runtime-credential.sh
      - name: Verify production operator work queues
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-production-operator-work-queue.sh
      - name: Verify live Neon serverless driver
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm run test:neon
      - run: npm run build
      - name: Validate production Cloudflare bundles
        run: |
          (cd apps/platform-api && npx wrangler deploy --dry-run --env production --outdir /tmp/platform-api-production)
          (cd apps/platform-web && npx wrangler deploy --dry-run --env production --outdir /tmp/platform-web-production)
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/validate_execution_artifacts.py

  apply-document-selection:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 98 && github.event.pull_request.head.ref == 'ux/operational-school-erp-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/operational-school-erp-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Guard exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Wire budget-neutral authorised document selection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = source.read_text()

          old_start = '''function DocumentsWorkspace(props: { readonly student: boolean }): ReactElement {\n  return ('''
          new_start = '''function DocumentsWorkspace(props: { readonly student: boolean }): ReactElement {\n  const [welcomeSelected, setWelcomeSelected] = useState(false);\n\n  return ('''
          if text.count(old_start) != 1:
            raise SystemExit('DocumentsWorkspace function marker missing or duplicated')
          text = text.replace(old_start, new_start, 1)

          start = text.index('function DocumentsWorkspace')
          end = text.index('function StudentTimetable')
          before, section, after = text[:start], text[start:end], text[end:]
          replacements = [
            ("                'Open authorised copy',", '''                <button key="a" onClick={() => setWelcomeSelected(false)} type="button">\n                  Term 2 details\n                </button>,'''),
            ("                'Open',", '''                <button key="a" onClick={() => setWelcomeSelected(true)} type="button">\n                  Welcome details\n                </button>,'''),
            ("                'View current version',", '                <PilotUnavailableAction key="a">View current version</PilotUnavailableAction>,'),
            ("                'Open cached copy',", '                <PilotUnavailableAction key="a">Open cached copy</PilotUnavailableAction>,'),
            ("                'Retry',", '                <PilotUnavailableAction key="a">Retry</PilotUnavailableAction>,'),
          ]
          for old, new in replacements:
            if section.count(old) != 1:
              raise SystemExit(f'Expected one document action marker for {old!r}, found {section.count(old)}')
            section = section.replace(old, new, 1)

          old_detail = '''        <Pane title="Term 2 progress report" description="Selected authorised document metadata.">\n          <DefinitionList\n            label="Document metadata"\n            items={[\n              { term: 'Category', value: 'Report card' },\n              { term: 'Published', value: '28 July · 15:00' },\n              { term: 'Version', value: 'v2.1' },\n              { term: 'File', value: 'PDF · 1.2 MB' },\n              { term: 'Publisher', value: 'Admin Office' },\n              {\n                term: 'Authorisation',\n                value: props.student ? 'Samira Noor only' : 'Primary guardian only',\n              },\n            ]}\n          />\n          <Timeline\n            label="Document version history"\n            items={[\n              {\n                time: 'v2.0',\n                title: 'Draft approved',\n                detail: 'Internal publication state',\n                status: 'Historical',\n              },\n              {\n                time: 'v2.1',\n                title: 'Final publication',\n                detail: 'Published 28 July',\n                status: 'Current',\n              },\n            ]}\n          />'''
          new_detail = '''        <Pane\n          title={welcomeSelected ? 'School welcome letter' : 'Term 2 progress report'}\n          description="Selected authorised document metadata."\n        >\n          <DefinitionList\n            label="Document metadata"\n            items={[\n              { term: 'Category', value: welcomeSelected ? 'Letter' : 'Report card' },\n              { term: 'Published', value: welcomeSelected ? '1 Aug' : '28 Jul' },\n              { term: 'File', value: welcomeSelected ? 'PDF · 340 KB' : 'PDF · 1.2 MB' },\n              {\n                term: 'Authorisation',\n                value: props.student\n                  ? 'Samira Noor only'\n                  : welcomeSelected\n                    ? 'Verified household only'\n                    : 'Primary guardian only',\n              },\n            ]}\n          />'''
          if old_detail not in section:
            raise SystemExit('DocumentsWorkspace detail pane marker missing')
          section = section.replace(old_detail, new_detail, 1)
          source.write_text(before + section + after)

          unit = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          unit_text = unit.read_text()
          if 'renders authorised document selectors' in unit_text:
            raise SystemExit('Document selector unit regression already exists')
          insertion = '''\n\n  it.each([\n    ['/family/documents', 'guardian'],\n    ['/student/documents', 'student'],\n  ] as const)('renders authorised document selectors on %s', (path, role) => {\n    const markup = renderRoute(path, role);\n\n    expect(markup).toContain('Term 2 details');\n    expect(markup).toContain('Welcome details');\n    expect(markup).toContain('View current version');\n    expect(markup).toContain('Open cached copy');\n    expect(markup).toContain('Retry');\n    expect(markup).toContain('Not available in this scope');\n    expect(markup).toContain('disabled=""');\n  });'''
          closing = unit_text.rfind('\n});')
          if closing < 0:
            raise SystemExit('Unit test describe closing marker missing')
          unit.write_text(unit_text[:closing] + insertion + unit_text[closing:])

          browser = Path('tests/browser/platform-shell.spec.ts')
          browser_text = browser.read_text()
          if 'switches authorised document metadata in place' in browser_text:
            raise SystemExit('Document selector browser regression already exists')
          browser_text += '''\n\ntest('switches authorised document metadata in place', async ({ page }) => {\n  await page.goto('/family/documents');\n  await expect(page.getByRole('heading', { name: 'Term 2 progress report' })).toBeVisible();\n  await page.getByRole('button', { name: 'Welcome details' }).click();\n  await expect(page.getByRole('heading', { name: 'School welcome letter' })).toBeVisible();\n  await expect(page.getByText('PDF · 340 KB')).toBeVisible();\n  await page.getByRole('button', { name: 'Term 2 details' }).click();\n  await expect(page.getByRole('heading', { name: 'Term 2 progress report' })).toBeVisible();\n  await expect(page.getByRole('button', { name: 'Open authorised copy' })).toBeDisabled();\n  await expect(page.getByRole('button', { name: 'Download authorised copy' })).toBeDisabled();\n});\n'''
          browser.write_text(browser_text)
          PY
      - run: npx prettier --write apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx tests/browser/platform-shell.spec.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run build
      - run: npm run check:experience-budget
      - name: Restore CI workflow and commit verified slice
        run: |
          git show "67aef3adb03399acb48b07c7a9a176ca44e2c4e0:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx tests/browser/platform-shell.spec.ts .github/workflows/ci.yml
          git commit -m 'feat(ux): make authorised document register selectable'
          git push origin HEAD:ux/operational-school-erp-v1
