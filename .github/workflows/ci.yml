name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  author-auth-08-permissions:
    if: github.event_name == 'pull_request' && github.head_ref == 'auth/database-permission-evaluation-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth/database-permission-evaluation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Add AUTH-08 database permission regression tests
        run: python3 scripts/implement_auth_08_permissions.py test
      - name: Prove database permission regressions fail before implementation
        shell: bash
        run: |
          set +e
          npx vitest run apps/platform-api/src/auth-durable-store.test.ts > auth-08-red.log 2>&1
          status=$?
          set -e
          cat auth-08-red.log
          test "$status" -ne 0
          grep -q 'evaluates active database permissions without browser-declared scope' auth-08-red.log
          grep -q 'rejects malformed permission keys before database access' auth-08-red.log
      - name: Apply AUTH-08 database permission implementation
        run: python3 scripts/implement_auth_08_permissions.py implementation
      - name: Align account-wide revocation fixture with the added AAL1 session
        run: python3 scripts/fix_auth_08_migration_fixture.py
      - run: rm scripts/implement_auth_08_permissions.py scripts/fix_auth_08_migration_fixture.py
      - run: npm run format
      - run: npm run lint -- --fix
      - run: npm run format
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify canonical and AUTH migrations
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          npm run verify:migrations
          npm run verify:auth-migrations
      - run: npm run build
      - run: npm run check:experience-budget
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run provenance:generate
      - run: git diff --exit-code -- artifacts THIRD_PARTY_NOTICES.md
      - run: python3 scripts/validate_execution_artifacts.py
      - name: Commit verified AUTH-08 permission checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(auth): evaluate permissions from active database sessions'
          git push origin HEAD:auth/database-permission-evaluation-v1

  verify:
    needs: author-auth-08-permissions
    if: always() && needs.author-auth-08-permissions.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canonical repository verification resumes after AUTH-08 permission synchronization.'
