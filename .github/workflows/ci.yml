name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-pilot-04-workflows:
    if: github.head_ref == 'pilot/database-read-models-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/database-read-models-v1
          fetch-depth: 0
      - name: Synchronize canonical CI and staging smoke
        run: |
          python3 scripts/finalize_pilot_04_workflows.py
          rm scripts/finalize_pilot_04_workflows.py
          grep -q "pilot/database-read-models-v1" .github/workflows/deploy-cloudflare-staging.yml
          grep -q "runtime_read_model_configuration_invalid" .github/workflows/deploy-cloudflare-staging.yml
          grep -q "contents: read" .github/workflows/ci.yml
      - name: Commit final workflow synchronization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(pilot): verify database read models on staging'
          git push origin HEAD:pilot/database-read-models-v1
