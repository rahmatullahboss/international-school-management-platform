name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'program/**'
      - 'module/**'
      - 'integration/**'

permissions:
  contents: write

jobs:
  harden-auth-05-cache:
    if: github.event_name == 'pull_request' && github.head_ref == 'pilot/oidc-key-rotation-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/oidc-key-rotation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Add bounded timestamp regression tests
        run: python3 scripts/harden_auth_05_cache.py test
      - name: Prove regressions fail before implementation
        shell: bash
        run: |
          set +e
          npx vitest run packages/policy/src/oidc-provider-cache.test.ts > auth-05-red.log 2>&1
          status=$?
          set -e
          cat auth-05-red.log
          test "$status" -ne 0
          grep -q 'rejects discovery cache records outside bounded freshness windows' auth-05-red.log
          grep -q 'rejects future-dated JWKS cache records' auth-05-red.log
      - name: Apply bounded timestamp validation
        run: python3 scripts/harden_auth_05_cache.py implementation
      - run: rm scripts/harden_auth_05_cache.py
      - run: npm run format
      - run: npm run lint -- --fix
      - run: npm run format
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run test
      - name: Verify canonical and AUTH post-integration migrations
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          npm run verify:migrations
          npm run verify:auth-migrations
      - name: Commit hardened AUTH-05 checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(auth): bound cached OIDC provider timestamps'
          git push origin HEAD:pilot/oidc-key-rotation-v1

  verify:
    needs: harden-auth-05-cache
    if: always() && needs.harden-auth-05-cache.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canonical repository verification resumes after AUTH-05 timestamp hardening.'
