name: Format guided walkthrough

on:
  push:
    branches:
      - feat/web-guided-walkthrough-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-guided-walkthrough-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/platform-web/src/guided-walkthrough.tsx tests/browser/guided-walkthrough.e2e.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-web/src/guided-walkthrough.tsx tests/browser/guided-walkthrough.e2e.spec.ts
          git commit -m "style(web): format guided walkthrough"
          git push origin HEAD:feat/web-guided-walkthrough-v1
