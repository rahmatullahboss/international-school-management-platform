name: PR98 teacher resource selection

on:
  push:
    branches:
      - ux/operational-school-erp-v1

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/operational-school-erp-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Wire Teacher resource register selection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('apps/platform-web/src/operational-module-surface.tsx')
          text = source.read_text()

          old_start = '''function TeacherResources(): ReactElement {\n  return ('''
          new_start = '''function TeacherResources(): ReactElement {\n  type EditableResource = 'Multi-step equations practice' | 'Geometry quiz' | 'Calculus intro';\n  const [selectedResource, setSelectedResource] = useState<EditableResource>(\n    'Multi-step equations practice',\n  );\n  const selectedResourceDetail =\n    selectedResource === 'Multi-step equations practice'\n      ? {\n          title: 'Multi-step equations practice',\n          description: 'Practice set for tomorrow’s lesson.',\n          classScope: 'Year 8A',\n          asset: 'equations_v1.pdf',\n          accessibility: 'Printable algebra practice with typed equations',\n          warning: 'A prior file has the same filename. Saving creates a new version rather than overwriting it.',\n        }\n      : selectedResource === 'Geometry quiz'\n        ? {\n            title: 'Geometry quiz',\n            description: 'Geometry checkpoint quiz for the current Year 8A unit.',\n            classScope: 'Year 8A',\n            asset: 'geometry.pdf',\n            accessibility: 'Printable geometry quiz with diagram descriptions',\n            warning: 'This resource is near its current availability end date. Publishing creates a new version.',\n          }\n        : {\n            title: 'Calculus intro',\n            description: 'Introductory calculus resource link requires repair before republishing.',\n            classScope: 'Year 12C',\n            asset: 'Broken link',\n            accessibility: 'External calculus introduction resource',\n            warning: 'The current authorised link is unavailable. Repair remains a draft-only preview until a production write contract is connected.',\n          };\n\n  return ('''
          if old_start not in text:
            raise SystemExit('TeacherResources function marker missing')
          text = text.replace(old_start, new_start, 1)

          replacements = [
            ("                'Edit',", '''                <button\n                  aria-label="Edit Multi-step equations practice"\n                  aria-pressed={selectedResource === 'Multi-step equations practice'}\n                  key="a"\n                  onClick={() => setSelectedResource('Multi-step equations practice')}\n                  type="button"\n                >\n                  Edit\n                </button>,'''),
            ("                'Preview',", '                <PilotUnavailableAction key="a">Preview</PilotUnavailableAction>,'),
            ("                'Edit',", '''                <button\n                  aria-label="Edit Geometry quiz"\n                  aria-pressed={selectedResource === 'Geometry quiz'}\n                  key="a"\n                  onClick={() => setSelectedResource('Geometry quiz')}\n                  type="button"\n                >\n                  Edit\n                </button>,'''),
            ("                'Repair',", '''                <button\n                  aria-label="Repair Calculus intro"\n                  aria-pressed={selectedResource === 'Calculus intro'}\n                  key="a"\n                  onClick={() => setSelectedResource('Calculus intro')}\n                  type="button"\n                >\n                  Repair\n                </button>,'''),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Missing TeacherResources action marker: {old!r}')
            text = text.replace(old, new, 1)

          old_pane = '''        <Pane\n          title="Edit resource"\n          description="Revisions create a new version; published history is not overwritten."\n        >\n          <form className="operational-form">\n            <label>\n              Title\n              <input defaultValue="Multi-step equations practice" />\n            </label>\n            <label>\n              Description\n              <textarea rows={4} defaultValue="Practice set for tomorrow’s lesson." />\n            </label>\n            <label>\n              Class scope\n              <select multiple defaultValue={['Year 8A']}>\n                <option>Year 8A</option>\n                <option>Year 9B</option>\n              </select>\n            </label>\n            <label>\n              File\n              <input readOnly value="equations_v1.pdf" />\n            </label>\n            <label>\n              Accessibility description\n              <input defaultValue="Printable algebra practice with typed equations" />\n            </label>\n            <Notice title="Duplicate upload warning" tone="warning">\n              A prior file has the same filename. Saving creates a new version rather than\n              overwriting it.\n            </Notice>'''
          new_pane = '''        <Pane\n          title={selectedResource === 'Calculus intro' ? 'Repair resource' : 'Edit resource'}\n          description="Revisions create a new version; published history is not overwritten."\n        >\n          <form className="operational-form" key={selectedResource}>\n            <label>\n              Title\n              <input defaultValue={selectedResourceDetail.title} />\n            </label>\n            <label>\n              Description\n              <textarea rows={4} defaultValue={selectedResourceDetail.description} />\n            </label>\n            <label>\n              Class scope\n              <select multiple defaultValue={[selectedResourceDetail.classScope]}>\n                <option>Year 8A</option>\n                <option>Year 9B</option>\n                <option>Year 12C</option>\n              </select>\n            </label>\n            <label>\n              Asset\n              <input readOnly value={selectedResourceDetail.asset} />\n            </label>\n            <label>\n              Accessibility description\n              <input defaultValue={selectedResourceDetail.accessibility} />\n            </label>\n            <Notice title="Resource boundary" tone="warning">\n              {selectedResourceDetail.warning}\n            </Notice>'''
          if old_pane not in text:
            raise SystemExit('TeacherResources edit pane marker missing')
          text = text.replace(old_pane, new_pane, 1)
          source.write_text(text)

          unit = Path('apps/platform-web/src/operational-module-surface.test.tsx')
          unit_text = unit.read_text()
          if 'renders Teacher resource selection controls' in unit_text:
            raise SystemExit('Teacher resource unit regression already exists')
          insertion = '''\n\n  it('renders Teacher resource selection controls without exposing unsupported preview as working', () => {\n    const markup = renderRoute('/teacher/resources', 'teacher');\n\n    expect(markup).toContain('Edit Multi-step equations practice');\n    expect(markup).toContain('Edit Geometry quiz');\n    expect(markup).toContain('Repair Calculus intro');\n    expect(markup).toContain('Preview');\n    expect(markup).toContain('disabled=""');\n    expect(markup).toContain('Resource boundary');\n  });'''
          closing = unit_text.rfind('\n});')
          if closing < 0:
            raise SystemExit('Unit test describe closing marker missing')
          unit.write_text(unit_text[:closing] + insertion + unit_text[closing:])

          browser = Path('tests/browser/platform-shell.spec.ts')
          browser_text = browser.read_text()
          if 'switches Teacher resource edit context in place' in browser_text:
            raise SystemExit('Teacher resource browser regression already exists')
          browser_text += '''\n\ntest('switches Teacher resource edit context in place', async ({ page }) => {\n  await page.goto('/teacher/resources');\n  await expect(page.getByRole('textbox', { name: 'Title' })).toHaveValue('Multi-step equations practice');\n  await page.getByRole('button', { name: 'Edit Geometry quiz' }).click();\n  await expect(page.getByRole('textbox', { name: 'Title' })).toHaveValue('Geometry quiz');\n  await expect(page.getByRole('textbox', { name: 'Asset' })).toHaveValue('geometry.pdf');\n  await page.getByRole('button', { name: 'Repair Calculus intro' }).click();\n  await expect(page.getByRole('heading', { name: 'Repair resource' })).toBeVisible();\n  await expect(page.getByRole('textbox', { name: 'Title' })).toHaveValue('Calculus intro');\n  await expect(page.getByRole('textbox', { name: 'Asset' })).toHaveValue('Broken link');\n});\n'''
          browser.write_text(browser_text)
          PY
      - run: npx prettier --write apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx tests/browser/platform-shell.spec.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run apps/platform-web/src/operational-module-surface.test.tsx
      - run: npm run build
      - run: npm run check:experience-budget
      - name: Commit verified slice and remove helper
        run: |
          rm .github/workflows/pr98-teacher-resource-selection.yml
          rm -f .github/pr98-teacher-resource-selection-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-web/src/operational-module-surface.tsx apps/platform-web/src/operational-module-surface.test.tsx tests/browser/platform-shell.spec.ts .github/workflows/pr98-teacher-resource-selection.yml .github/pr98-teacher-resource-selection-trigger.txt
          git commit -m 'feat(ux): make teacher resource register selectable'
          git push origin HEAD:ux/operational-school-erp-v1
