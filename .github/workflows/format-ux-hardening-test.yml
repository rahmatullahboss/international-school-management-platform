name: Format UX hardening test

on:
  push:
    branches:
      - codex/ux-hardening-reflow-rtl-20260809
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/ux-hardening-reflow-rtl-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Format only hardening test
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write tests/browser/ux-hardening.spec.ts
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then exit 0; fi
          test "$changed" = "tests/browser/ux-hardening.spec.ts"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser/ux-hardening.spec.ts
          git commit -m "test(ux): format hardening coverage"
          git push origin HEAD:codex/ux-hardening-reflow-rtl-20260809
