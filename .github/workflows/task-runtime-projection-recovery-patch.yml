name: Task Runtime Projection Recovery Patch

on:
  push:
    branches:
      - task/runtime-projection-dead-letter-recovery-20260812

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/runtime-projection-dead-letter-recovery-20260812
      - name: Patch existing gate wiring without rewriting historical verifier content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          auth = "tests/integration/verify-auth-durable-context.sh"
          replace_once(auth,
              "GATE-PROD-ADMISSIONS-LIFECYCLE-WORK-QUEUE-V1",
              "GATE-PROD-RUNTIME-PROJECTION-RECOVERY-V1")
          replace_once(auth,
              "if (migrations.length !== 16) {\n  throw new Error(`expected sixteen post-integration migrations, got ${migrations.length}`);\n}",
              "if (migrations.length !== 17) {\n  throw new Error(`expected seventeen post-integration migrations, got ${migrations.length}`);\n}")
          replace_once(auth,
              "'PILOT-14', 'PILOT-15', 'PROD-05'].includes(migration.stream)",
              "'PILOT-14', 'PILOT-15', 'PROD-05', 'PROD-06'].includes(migration.stream)")
          replace_once(auth,
              "IF (SELECT count(*) FROM platform.schema_migration) <> 56 THEN\n    RAISE EXCEPTION 'expected 56 total migration ledger rows';",
              "IF (SELECT count(*) FROM platform.schema_migration) <> 57 THEN\n    RAISE EXCEPTION 'expected 57 total migration ledger rows';")
          replace_once(auth,
              "OR to_regclass('platform.runtime_projection_dead_letter') IS NULL",
              "OR to_regclass('platform.runtime_projection_dead_letter') IS NULL\n     OR to_regclass('platform.runtime_projection_recovery_receipt') IS NULL")
          replace_once(auth,
              "OR to_regprocedure('platform.read_runtime_projection_operations_snapshot(uuid,integer,integer)') IS NULL",
              "OR to_regprocedure('platform.read_runtime_projection_operations_snapshot(uuid,integer,integer)') IS NULL\n     OR to_regprocedure('platform.recover_runtime_projection_dead_letter(uuid,uuid,uuid,text,text,uuid)') IS NULL")

          package = "package.json"
          replace_once(package,
              '"verify:persona-e2e": "bash tests/integration/verify-product-persona-e2e.sh",\n    "verify":',
              '"verify:persona-e2e": "bash tests/integration/verify-product-persona-e2e.sh",\n    "verify:projection-recovery": "bash tests/integration/verify-runtime-projection-dead-letter-recovery.sh",\n    "verify":')

          ci = ".github/workflows/ci.yml"
          old = """      - name: Verify admissions lifecycle work queue
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-admissions-lifecycle-work-queue.sh
      - name: Verify live Neon serverless driver
"""
          new = """      - name: Verify admissions lifecycle work queue
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash tests/integration/verify-admissions-lifecycle-work-queue.sh
      - name: Verify runtime projection dead-letter recovery
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: npm run verify:projection-recovery
      - name: Verify live Neon serverless driver
"""
          replace_once(ci, old, new)
          PY
          git diff --check
          git diff -- tests/integration/verify-auth-durable-context.sh package.json .github/workflows/ci.yml
      - name: Commit gate wiring
        run: |
          if git diff --quiet; then
            echo "Gate wiring already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/verify-auth-durable-context.sh package.json .github/workflows/ci.yml
          git commit -m "test(projections): wire recovery production gate"
          git push origin HEAD:task/runtime-projection-dead-letter-recovery-20260812
