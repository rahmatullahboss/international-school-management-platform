name: Family UTC Presentation Apply

on:
  pull_request:
    paths:
      - 'mobile/apps/family_app/lib/main.dart'
      - 'mobile/apps/family_app/lib/family_interaction_screens.dart'
      - 'mobile/apps/family_app/lib/family_utc_presentation.dart'
      - 'mobile/apps/family_app/test/family_utc_presentation_test.dart'
      - 'mobile/tool/apply_family_utc_presentation.py'
      - '.github/workflows/family-utc-presentation-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true
      - name: Apply explicit UTC Family presentation
        run: python3 mobile/tool/apply_family_utc_presentation.py
      - name: Format changed Dart files
        run: |
          dart format \
            mobile/apps/family_app/lib/main.dart \
            mobile/apps/family_app/lib/family_interaction_screens.dart \
            mobile/apps/family_app/lib/family_utc_presentation.dart \
            mobile/apps/family_app/test/family_utc_presentation_test.dart
      - name: Commit applied UTC presentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Family UTC presentation already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/apps/family_app/lib/main.dart \
            mobile/apps/family_app/lib/family_interaction_screens.dart \
            mobile/apps/family_app/lib/family_utc_presentation.dart \
            mobile/apps/family_app/test/family_utc_presentation_test.dart
          git commit -m 'fix(mobile): stop inferring Family device timezone'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
