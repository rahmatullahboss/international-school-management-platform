name: Finalize PILOT-01 Documentation

on:
  push:
    branches:
      - pilot/runtime-portal-composition

permissions:
  contents: write

concurrency:
  group: pilot-runtime-docs-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/runtime-portal-composition
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm ci

      - name: Reconcile pilot evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          candidate = 'a50ad782489137f5afd806e30c7a3e249b5074ec'
          base = '41639fab433491df0395d02217a70c6eb2ddb775'
          root_ci = '30484622352'
          deploy_run = '30484622364'
          web_url = 'https://international-school-platform-web-staging.rahmatullahzisan.workers.dev'
          api_url = 'https://international-school-platform-api-staging.rahmatullahzisan.workers.dev/health'

          board_path = root / 'docs/execution/03-agent-board.json'
          board = json.loads(board_path.read_text(encoding='utf-8'))
          board['updated_at'] = '2026-07-30'
          board['program_status'] = 'pilot_runtime_composed'
          board.setdefault('reviewed_bases', {})['cloudflare_staging'] = base
          board['pilot_runtime'] = {
              'id': 'PILOT-01',
              'name': 'Runtime Portal Composition and Staging Acceptance',
