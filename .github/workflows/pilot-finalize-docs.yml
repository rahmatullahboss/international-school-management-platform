              'branch': 'pilot/runtime-portal-composition',
              'base_sha': base,
              'verified_candidate_sha': candidate,
              'root_ci_run': root_ci,
              'cloudflare_deploy_run': deploy_run,
              'routes': {
                  'role_chooser': f'{web_url}/',
                  'admin': f'{web_url}/admin',
                  'teacher': f'{web_url}/teacher',
                  'guardian': f'{web_url}/family',
                  'student': f'{web_url}/student',
                  'api_health': api_url,
              },
              'asset_evidence': {
                  'initial_javascript_bytes': 203338,
                  'initial_css_bytes': 8475,
                  'total_javascript_bytes': 283316,
                  'total_css_bytes': 60355,
                  'violations': [],
              },
              'deployment_versions': {
                  'api_worker_version': '360f923e-1518-4d1d-9540-3f02c4939216',
                  'web_worker_version': '11539129-464f-4f80-8fc1-8254f4c9e1be',
              },
              'data_boundary': 'synthetic staging records only; production mutations disabled',
              'remaining_release_boundary': [
                  'permission-aware Worker API read models',
                  'reviewed OAuth/OIDC and tenant context',
                  'approved staging tenant seed and reset tooling',
                  'safe pilot mutations and live permission-negative tests',
                  'monitoring, backup and rollback rehearsal',
                  'owner-led user acceptance and explicit production authorization',
              ],
          }
          board_path.write_text(json.dumps(board, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          tracker = f'''# Whole-Module Program Progress Tracker

**Program:** `international-school-platform-v1`  
