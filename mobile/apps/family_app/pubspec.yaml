version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  go_router: ^17.3.0
  school_api_client: ^0.1.0
  school_app_bootstrap: ^0.1.0
  school_authentication: ^0.1.0
  school_design_system: ^0.1.0
  school_family_domain: ^0.1.0
  school_mobile_core: ^0.1.0
  school_secure_documents: ^0.1.0
  school_native_notifications: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
